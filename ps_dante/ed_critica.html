<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edizione Digitale TEI</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Mirador IIIF Viewer -->
  <script src="https://unpkg.com/mirador@3.3.0/dist/mirador.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
    rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    <link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
  rel="stylesheet" />

  <style>
    :root {
      --accent: #a03f33;
      --accent-light: rgba(160, 63, 51, 0.08);
      --accent-hover: rgba(160, 63, 51, 0.15);
      --bg: #fbf9f4;
      --bg-panel: #f5f3ee;
      --text: #1a1410;
      --muted: #6b7280;
      --border: #e2ddd6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Source Sans 3", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }

    /* ── LAYOUT ── */
    .layout-single #col-right {
      display: none !important;
    }

    .layout-single #col-left {
      width: 100% !important;
      border-right: none !important;
    }

    .layout-dual #col-right {
      display: flex !important;
    }

    .layout-dual #col-left {
      width: 50% !important;
      border-right: 1px solid var(--border) !important;
    }

    .hidden {
      display: none !important;
    }

    /* ── SIDEBAR ── */
    aside {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.18s;
      text-align: left;
    }

    .nav-btn:hover {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text);
    }

    .nav-btn.active {
      background: white;
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 800;
    }

    .nav-btn .material-symbols-outlined {
      font-size: 18px;
      font-variation-settings:
        "FILL" 0,
        "wght" 400,
        "GRAD" 0,
        "opsz" 24;
    }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
      background: white;
      min-height: 40px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 0 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      margin-bottom: -1px;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── SCROLLABLE PANES ── */
    .scroll-pane {
      flex: 1;
      overflow-y: auto;
    }

    .scroll-pane::-webkit-scrollbar {
      width: 4px;
    }

    .scroll-pane::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    /* ── FRONT-MATTER ── */
    .prose {
      max-width: 720px;
      margin: 0 auto;
      padding: 52px 48px;
    }

    .prose h1 {
      font-family: "Source Sans 3", sans-serif, ;
      font-size: 1.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin: 0 0 2rem;
      color: var(--accent);
    }

    .prose h2 {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 2.5rem 0 0.8rem;
    }

    .prose p {
      font-family: "Source Serif 4", serif;
      font-size: 1.05rem;
      line-height: 1.85;
      margin: 0 0 1.2rem;
    }

    /* ── TESTO CRITICO ── */
    .tei-content {
      font-family: "Source Serif 4", serif;
      font-size: 1.1rem;
      line-height: 1.9;
      padding: 48px 52px;
    }

    .tei-lg {
      margin-bottom: 1.5rem;
    }

    .tei-l {
      position: relative;
      padding-left: 3.5rem;
      margin-bottom: 0.15rem;
    }

    .line-n {
      position: absolute;
      left: 0;
      width: 2.8rem;
      text-align: right;
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.7rem;
      color: var(--accent);
      opacity: 0.55;
      user-select: none;
      top: 0.25em;
    }

    /* ── APP ── */
    .tei-app {
      border-bottom: 1px dotted var(--accent);
      background: var(--accent-light);
      cursor: pointer;
      padding: 0 1px;
      transition: background 0.15s;
    }

    .tei-app.conjecture::before {
      content: "⟨";
      font-size: 0.85em;
      color: var(--accent);
    }

    .tei-app.conjecture::after {
      content: "⟩";
      font-size: 0.85em;
      color: var(--accent);
    }

    .tei-app:hover,
    .tei-app.hl {
      background: var(--accent-hover);
    }

    .tei-app.hl {
      outline: 1px solid var(--accent);
      border-radius: 2px;
    }

    /* ── SEG / NOTE ── */
    .tei-seg {
      cursor: pointer;
    }

    .note-marker {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.65em;
      vertical-align: super;
      line-height: 1;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      border-bottom: none;
      transition: color 0.15s;
    }

    .note-marker:hover,
    .note-marker.hl {
      color: var(--accent);
    }

    /* ── APPARATO ── */
    .app-entry {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-family: "Source Serif 4", serif;
      font-size: 0.95rem;
      transition: background 0.15s;
      cursor: pointer;
    }

    .app-entry:hover {
      background: #faf8f5;
    }

    .app-entry.hl {
      background: rgba(160, 63, 51, 0.15);
      outline: 1px solid rgba(160, 63, 51, 0.15);
    }

    .app-entry .line-ref {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--muted);
      margin-right: 8px;
    }

    .app-entry .lem-text {
      color: var(--accent);
      font-style: italic;
    }

    .app-entry .rdg-text {
      font-style: italic;
    }

    .app-entry .wit-sig {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* ── COMMENTO ── */
    .note-entry {
      border-left: 3px solid var(--accent);
      padding: 14px 18px;
      margin: 16px;
      background: rgba(132, 139, 144, 0.116);
      font-family: "Source Serif 4", serif;
      font-size: 0.95rem;
      transition: background 0.15s;
    }

    .note-entry.hl {
      background: rgba(83, 104, 120, 0.13);
    }

    .note-marker-label {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }

    /* ── TESTIMONI ── */
    .wit-entry {
      display: flex;
      align-items: baseline;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .wit-id {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: oldstyle-nums;
      min-width: 36px;
    }

    .wit-name {
      font-family: "Source Serif 4", serif;
      font-size: 1.05rem;
    }

    /* ── FILTRI APPARATO ── */
    .filter-bar {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #fafaf8;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .filter-bar label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-right: 4px;
    }

    .filter-chip {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--muted);
      transition: all 0.15s;
      font-family: "Source Sans 3", sans-serif;
    }

    .filter-chip.on {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .filter-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
    }

    /* ── FACSIMILE ── */
    .fac-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .fac-toolbar {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .fac-viewer {
      flex: 1;
      overflow: hidden;
      cursor: grab;
      background: #e8e6e0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fac-viewer:active {
      cursor: grabbing;
    }

    .fac-viewport {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.08s ease-out;
    }

    .fac-img {
      height: 85vh;
      max-width: none;
      pointer-events: none;
      display: block;
      border-radius: 3px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    }

    .fac-btn {
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: white;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .fac-btn .material-symbols-outlined {
      font-size: 16px;
      font-variation-settings:
        "FILL" 0,
        "wght" 400,
        "GRAD" 0,
        "opsz" 24;
    }

    .fac-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .fac-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .fac-select {
      font-family: "Source Sans 3", sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--text);
      cursor: pointer;
    }

    .page-indicator {
      font-family: "Source Sans 3", sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      min-width: 52px;
      text-align: center;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(251, 249, 244, 0.97);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
    }

    .header-author {
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .header-title {
      font-family: "Source Serif 4", serif;
      font-style: italic;
      color: var(--accent);
      font-size: 0.95rem;
    }

    .header-status {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #aaa;
    }

    /* ── TRADUZIONE ── */
    .tei-translation .tei-l {
      font-style: italic;
      color: #4b5563;
    }

    /* section col */
    section.col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
    }

    /* ── MISC ── */
    .sep {
      height: 1px;
      background: var(--border);
      margin: 8px 20px;
    }

    /* ── FACSIMILE / MIRADOR ── */
    .fac-wrapper { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .fac-toolbar {
      padding: 8px 14px; border-bottom: 1px solid var(--border); background: white;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 8px; flex-shrink: 0;
    }
    .fac-mirador-container { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    .fac-btn { padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; background: white; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
    .fac-btn .material-symbols-outlined { font-size: 16px; }
    .fac-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .fac-btn:disabled { opacity: 0.3; cursor: default; }
    .fac-select { font-family: "Source Sans 3", sans-serif; font-size: 11px; font-weight: 700; padding: 5px 8px; border-radius: 5px; border: 1.5px solid var(--border); background: white; color: var(--text); cursor: pointer; }
    .page-indicator { font-family: "Source Sans 3", sans-serif; font-size: 12px; font-weight: 800; color: var(--accent); min-width: 72px; text-align: center; }
    .fac-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #e8e6e0; flex-direction: column; gap: 12px; z-index: 5; }
    .fac-loading-text { font-family: "Source Sans 3", sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .fac-spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Barra superiore finestra Mirador */
    #mirador-mount-L [class*="windowTopBar"], #mirador-mount-R [class*="windowTopBar"],
    #mirador-mount-L [class*="topBar"],        #mirador-mount-R [class*="topBar"] {
      background-color: white !important; border-bottom: 1px solid var(--border) !important; box-shadow: none !important;
    }
    /* mirador-window-top-bar visibile: contiene il pulsante ≡ per il pannello info */
    /* Rimuove la linea blu superiore (border-top del Window di Mirador) */
    #mirador-mount-L > div,
    #mirador-mount-R > div,
    #mirador-mount-L [class*="Window"],
    #mirador-mount-R [class*="Window"],
    #mirador-mount-L [class*="window"],
    #mirador-mount-R [class*="window"] {
      border-top: none !important;
      outline: none !important;
      box-shadow: none !important;
    }
    #mirador-mount-L button, #mirador-mount-R button { color: var(--muted) !important; }
    #mirador-mount-L button:hover, #mirador-mount-R button:hover { color: var(--accent) !important; }
    /* Posizionamento canvas-nav */
    #mirador-mount-L .mirador-osd-container, #mirador-mount-R .mirador-osd-container { position: relative !important; }
    #mirador-mount-L .mirador-canvas-nav, #mirador-mount-R .mirador-canvas-nav {
      position: absolute !important; bottom: 8px !important; top: auto !important;
      left: 50% !important; transform: translateX(-50%) !important;
      height: auto !important; width: auto !important;
      background: transparent !important; box-shadow: none !important;
    }
  </style>
</head>

<body>
  <!-- ═══════════════════════════════════ HEADER ═══════════════════════════════════ -->
  <header>
    <div class="header-inner">
      <div id="header-meta" style="display: flex; gap: 16px; align-items: baseline">
        <span style="color: #aaa; font-size: 13px">Caricamento…</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <a href="../index.html"
           style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .15s"
           onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">
          <span class="material-symbols-outlined" style="font-size:14px;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20">arrow_back</span>Home
        </a>
        <span id="loading-status" class="header-status"></span>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════ BODY ═══════════════════════════════════ -->
  <div style="display: flex; height: calc(100vh - 53px); overflow: hidden" id="main-body" class="layout-single">
    <!-- SIDEBAR -->
    <aside>
      <div style="padding: 20px 20px 14px">
        <div style="
              font-size: 9px;
              font-weight: 800;
              text-transform: uppercase;
              letter-spacing: 0.15em;
              color: var(--muted);
            ">
          Edizione Digitale
        </div>
      </div>
      <nav id="sidebar-nav" style="flex: 1; padding: 4px 0"></nav>
      <div class="sep"></div>
      <div style="padding: 14px 20px">
        <div id="resp-info" style="
              font-size: 9px;
              color: #bbb;
              text-transform: uppercase;
              letter-spacing: 0.1em;
              font-weight: 700;
              line-height: 1.6;
            "></div>
      </div>
    </aside>

    <!-- MAIN -->
    <main style="flex: 1; display: flex; overflow: hidden">
      <!-- COL LEFT -->
      <section class="col" id="col-left" style="flex: 1; border-right: 1px solid var(--border)">
        <div class="tab-bar hidden" id="tabs-L"></div>
        <div class="scroll-pane" id="scroll-L">
          <!-- front-matter views: create dinamicamente da buildFrontMatter() -->
          <div id="view-witnesses" class="prose hidden"></div>
          <div id="view-bibliography" class="prose hidden"></div>
          <!-- edition panes -->
          <div id="panes-L" class="hidden" style="height: 100%; display: flex; flex-direction: column">
            <div id="app-filters-L" class="hidden"></div>
            <div style="flex: 1; overflow-y: auto" class="scroll-pane" id="inner-scroll-L">
              <div id="out-testo-L" class="tei-content hidden"></div>
              <div id="out-facsimile-L" class="hidden" style="height: 100%"></div>
              <div id="out-traduzione-L" class="tei-content tei-translation hidden"></div>
              <div id="out-apparato-L" class="hidden"></div>
              <div id="out-commento-L" class="hidden"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- COL RIGHT -->
      <section class="col" id="col-right" style="flex: 1; display: none">
        <div class="tab-bar" id="tabs-R"></div>
        <div class="scroll-pane" id="scroll-R" style="flex: 1; display: flex; flex-direction: column">
          <div id="app-filters-R" class="hidden"></div>
          <div style="flex: 1; overflow-y: auto" class="scroll-pane" id="inner-scroll-R">
            <div id="out-testo-R" class="tei-content hidden"></div>
            <div id="out-facsimile-R" class="hidden" style="height: 100%"></div>
            <div id="out-traduzione-R" class="tei-content tei-translation hidden"></div>
            <div id="out-apparato-R" class="hidden"></div>
            <div id="out-commento-R" class="hidden"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ═══════════════════════════════════ SCRIPT ═══════════════════════════════════ -->
  <script>
    /* ──────────────────────────────────────────────────────────────
 CONFIGURAZIONE
────────────────────────────────────────────────────────────── */
    const TEI_FILE = "ps_dante.xml"; // ← modifica qui con il nome del file XML
    const NS = "http://www.tei-c.org/ns/1.0";

    let xml = null;

    // State
    // Stato Mirador per colonna
    const MIRADOR_EL = { L: "mirador-mount-L", R: "mirador-mount-R" };
    const miradorState = {
      L: { initialized: false, pages: [], pageIdx: 0, viewer: null, canvases: [], storeSubscribed: false, blobUrl: null },
      R: { initialized: false, pages: [], pageIdx: 0, viewer: null, canvases: [], storeSubscribed: false, blobUrl: null },
    };
    // Indice superfici TEI: witId -> { manifestUrl, zones:[{n}] }
    let surfaceByWit = {};

    // Which pane is active per column
    const activePaneId = { L: "testo", R: "apparato" };

    // Active witness filter sets per column
    const witnessFilter = { L: new Set(), R: new Set() };
    // Variant type filter
    const variantFilter = {
      L: new Set(["substantive", "orthographic"]),
      R: new Set(["substantive", "orthographic"]),
    };

    // Note counter map: segId -> noteIndex
    let noteIndexMap = {};
    let appEntryData = []; // [{id, lineN, lemText, isConj, rdgs:[{wit,text,type}]}]
    let commentData = []; // [{target, text}]
    let witnesses = []; // [{id, text}]
    let allWitIds = [];
    let activeWitIds = []; // solo i testimoni con almeno un <rdg> nell'edizione

    // Available pane ids (discovered from XML)
    let availablePanes = [];

    /* ──────────────────────────────────────────────────────────────
 BOOT
────────────────────────────────────────────────────────────── */
    document.addEventListener("DOMContentLoaded", async () => {
      const status = document.getElementById("loading-status");
      status.textContent = "Caricamento…";
      try {
        const r = await fetch(TEI_FILE);
        if (!r.ok) throw new Error(r.status);
        xml = new DOMParser().parseFromString(
          await r.text(),
          "application/xml",
        );
        buildAll();
        status.textContent = "Laboratorio di Filologia romanza digitale";
      } catch (e) {
        status.textContent = "Errore XML";
        console.error(e);
      }
    });

    /* ──────────────────────────────────────────────────────────────
 BUILD ALL
────────────────────────────────────────────────────────────── */
    function buildAll() {
      buildHeader();
      buildWitnesses();
      buildFrontMatter();
      buildEditionData();
      buildSidebar();
      buildFacsimile();

      // Apre sulla prima sezione front-matter disponibile nell'XML,
      // con fallback a "witnesses" se il front-matter è assente.
      const defaultView =
        frontSections.length > 0 ? frontSections[0].id : "witnesses";
      selectView(defaultView);
    }

    /* ──────────────────────────────────────────────────────────────
 HEADER
────────────────────────────────────────────────────────────── */
    function buildHeader() {
      const author =
        xml.getElementsByTagNameNS(NS, "author")[0]?.textContent?.trim() ||
        "";
      const title =
        xml.getElementsByTagNameNS(NS, "title")[0]?.textContent?.trim() || "";
      const resp =
        xml.getElementsByTagNameNS(NS, "name")[0]?.textContent?.trim() || "";
      document.getElementById("header-meta").innerHTML = `
    <span class="header-author">${author}</span>
    <span class="header-title">${title}</span>`;
      if (resp)
        document.getElementById("resp-info").textContent =
          `Ed. digitale a cura di ${resp}`;
    }

    /* ──────────────────────────────────────────────────────────────
 WITNESSES
────────────────────────────────────────────────────────────── */
    function buildWitnesses() {
      witnesses = Array.from(xml.getElementsByTagNameNS(NS, "witness")).map(
        (w) => ({
          id: w.getAttribute("xml:id"),
          text: w.textContent.trim(),
        }),
      );
      allWitIds = witnesses.map((w) => w.id);
      // Inizializzazione provvisoria: verrà sovrascritta da buildEditionData()
      // con i soli testimoni che hanno effettivamente dei <rdg>.
      ["L", "R"].forEach((c) => {
        witnessFilter[c] = new Set(allWitIds);
      });

      // Render witness list view
      let h = '<h1>Testimoni</h1><div style="margin-top:2rem">';
      witnesses.forEach((w) => {
        h += `<div class="wit-entry"><span class="wit-id">${w.id}</span><span class="wit-name">${w.text}</span></div>`;
      });
      h += "</div>";
      document.getElementById("view-witnesses").innerHTML = h;
    }

    /* ──────────────────────────────────────────────────────────────
 FRONT MATTER
────────────────────────────────────────────────────────────── */
    // Mappa dei tipi di <div> front-matter noti → metadati sidebar.
    // I tipi non in questa mappa ma presenti nell'XML vengono comunque
    // rilevati e visualizzati con icona e etichetta generiche (fallback).
    const KNOWN_FRONT_TYPES = {
      introduction: { icon: "info", label: "Introduzione" },
      preface: { icon: "info", label: "Prefazione" },
      foreword: { icon: "info", label: "Premessa" },
      editorialNote: { icon: "manage_search", label: "Nota al testo" },
      criteria: { icon: "book", label: "Criteri editoriali" },
      commentary: { icon: "comment", label: "Commento" },
      abstract: { icon: "summarize", label: "Abstract" },
      dedication: { icon: "favorite", label: "Dedica" },
      acknowledgements: { icon: "handshake", label: "Ringraziamenti" },
    };

    // Costruita dinamicamente in buildFrontMatter(); ogni voce:
    // { type, id, icon, label, headText }
    let frontSections = [];

    function buildFrontMatter() {
      frontSections = [];
      const frontEl = xml.getElementsByTagNameNS(NS, "front")[0];
      const divs = frontEl
        ? Array.from(frontEl.childNodes).filter(
          (n) => n.nodeType === 1 && n.localName === "div",
        )
        : Array.from(xml.getElementsByTagNameNS(NS, "div")).filter((d) => {
          const t = d.getAttribute("type");
          return t && t in KNOWN_FRONT_TYPES;
        });

      divs.forEach((d) => {
        const type = d.getAttribute("type");
        if (!type || type === "edition" || type === "translation") return;
        const known = KNOWN_FRONT_TYPES[type];
        const headText =
          d.getElementsByTagNameNS(NS, "head")[0]?.textContent?.trim() ||
          known?.label ||
          type;
        const section = {
          type,
          id: "front-" + type,
          icon: known?.icon || "article",
          label: known?.label || headText,
          headText,
        };
        frontSections.push(section);

        // Creare il div di vista nel DOM se non esiste ancora
        let el = document.getElementById("view-front-" + type);
        if (!el) {
          el = document.createElement("div");
          el.id = "view-front-" + type;
          el.className = "prose hidden";
          document.getElementById("scroll-L").appendChild(el);
        }
        el.innerHTML = "<h1>" + headText + "</h1>" + formatTEIDiv(d);
      });

      // Bibliography
      const listBibl = xml.getElementsByTagNameNS(NS, "listBibl")[0];
      const biblEl = document.getElementById("view-bibliography");
      if (listBibl) {
        let h = '<h1>Bibliografia</h1><div style="margin-top:1.5rem">';
        Array.from(listBibl.getElementsByTagNameNS(NS, "bibl")).forEach(
          (b) => {
            const biblHtml = b.innerHTML.replace(/<hi\s+rend="italic">(.*?)<\/hi>/g, '<em>$1</em>');
h += `<p style="font-family:'Source Serif 4',serif;font-size:1rem;line-height:1.8;margin-bottom:0.6rem;padding-left:2rem;text-indent:-2rem">${smartQuotesHtml(biblHtml)}</p>`;
          },
        );
        h += "</div>";
        biblEl.innerHTML = h;
      } else {
        biblEl.innerHTML =
          '<h1>Bibliografia</h1><p style="color:#aaa;font-style:italic">Nessun dato bibliografico nell\'XML.</p>';
      }
    }

    function formatTEIDiv(node) {
      let h = "";
      node.childNodes.forEach((c) => {
        if (c.localName === "p") h += `<p>${smartQuotesHtml(c.innerHTML)}</p>`;
        if (c.localName === "head") return;
        if (c.nodeType === 3 && c.textContent.trim())
          h += `<p>${smartQuotes(c.textContent)}</p>`;
      });
      return h;
    }

    /* ──────────────────────────────────────────────────────────────
 SIDEBAR
────────────────────────────────────────────────────────────── */
    // Le voci statiche della sidebar (non front-matter).
    // Le voci del front-matter vengono inserite dinamicamente da buildSidebar()
    // in base a frontSections, prima del separatore.
    const SIDEBAR_STATIC_BOTTOM = [
      {
        id: "witnesses",
        icon: "local_library",
        label: "Testimoni",
        always: true,
      },
      { separator: true },
      {
        id: "edition",
        icon: "auto_stories",
        label: "Edizione",
        always: true,
      },
      { separator: true },
      {
        id: "bibliography",
        icon: "article",
        label: "Bibliografia",
        key: "listBibl",
      },
    ];

    function buildSidebar() {
      const nav = document.getElementById("sidebar-nav");
      let h = "";

      // Voci front-matter dinamiche
      frontSections.forEach((sec) => {
        h += `<button class="nav-btn" id="nav-${sec.id}" onclick="selectView('${sec.id}')">
      <span class="material-symbols-outlined">${sec.icon}</span>${sec.label}
    </button>`;
      });

      // Voci statiche finali
      SIDEBAR_STATIC_BOTTOM.forEach((item) => {
        if (item.separator) {
          h += '<div class="sep"></div>';
          return;
        }
        if (!item.always && item.key) {
          const found =
            xml.getElementsByTagNameNS(NS, item.key)?.length > 0;
          if (!found) return;
        }
        h += `<button class="nav-btn" id="nav-${item.id}" onclick="selectView('${item.id}')">
      <span class="material-symbols-outlined">${item.icon}</span>${item.label}
    </button>`;
      });

      nav.innerHTML = h;
    }

    /* ──────────────────────────────────────────────────────────────
 VIEW SWITCHING
────────────────────────────────────────────────────────────── */
    function selectView(viewId) {
      // Update sidebar
      document
        .querySelectorAll(".nav-btn")
        .forEach((b) => b.classList.remove("active"));
      const nb = document.getElementById("nav-" + viewId);
      if (nb) nb.classList.add("active");

      const body = document.getElementById("main-body");
      const scroll = document.getElementById("scroll-L");

      if (viewId === "edition") {
        body.classList.replace("layout-single", "layout-dual");
        // Show tab bars
        document.getElementById("tabs-L").classList.remove("hidden");
        document.getElementById("tabs-R").classList.remove("hidden");
        // Hide front-matter
        hideFrontMatter();
        // Show edition panes container
        document.getElementById("panes-L").classList.remove("hidden");
        scroll.style.overflow = "hidden";
        scroll.style.height = "100%";
        // Default panes
        switchPane("L", activePaneId.L);
        switchPane("R", activePaneId.R);
      } else {
        body.classList.replace("layout-dual", "layout-single");
        document.getElementById("tabs-L").classList.add("hidden");
        document.getElementById("panes-L").classList.add("hidden");
        scroll.style.overflow = "";
        scroll.style.height = "";
        hideFrontMatter();
        const v = document.getElementById("view-" + viewId);
        if (v) v.classList.remove("hidden");
      }
    }

    function hideFrontMatter() {
      // Nasconde tutte le viste front-matter dinamiche
      frontSections.forEach((sec) => {
        document.getElementById("view-" + sec.id)?.classList.add("hidden");
      });
      // Nasconde le viste statiche
      ["witnesses", "bibliography"].forEach((id) => {
        document.getElementById("view-" + id)?.classList.add("hidden");
      });
    }

    /* ──────────────────────────────────────────────────────────────
 EDITION DATA
────────────────────────────────────────────────────────────── */
    function buildEditionData() {
      const edition = Array.from(xml.getElementsByTagNameNS(NS, "div")).find(
        (d) => d.getAttribute("type") === "edition",
      );
      if (!edition) return;

      // Discover panes
      availablePanes = ["testo"];
      if (xml.getElementsByTagNameNS(NS, "surface").length > 0)
        availablePanes.push("facsimile");
      if (
        Array.from(xml.getElementsByTagNameNS(NS, "div")).some(
          (d) => d.getAttribute("type") === "translation",
        )
      )
        availablePanes.push("traduzione");
      if (edition.getElementsByTagNameNS(NS, "app").length > 0)
        availablePanes.push("apparato");
      if (
        edition.getElementsByTagNameNS(NS, "note").length > 0 ||
        edition.getElementsByTagNameNS(NS, "seg").length > 0
      )
        availablePanes.push("commento");

      // Build tabs
      buildTabs();

      // Parse notes
      commentData = Array.from(
        edition.getElementsByTagNameNS(NS, "note"),
      ).map((n) => ({
        target: n.getAttribute("target")?.replace("#", "") || "",
        text: smartQuotesHtml(n.innerHTML),
      }));

      // Assign note indices in document order.
      // Walk the edition in DOM order: for each <seg> and for each <app> that has
      // a matching <note>, assign a progressive index.
      let noteIdx = 1;
      noteIndexMap = {};
      const noteTargets = new Set(commentData.map((nd) => nd.target));

      // Collect all annotated anchors in document order
      const walker = document.createTreeWalker
        ? null // we'll use a manual recursive walk on the XML instead
        : null;

      function walkForNoteAnchors(node) {
        if (node.nodeType === 1) {
          const localName = node.localName;
          const id = node.getAttribute("xml:id");
          if (
            (localName === "seg" || localName === "app") &&
            id &&
            noteTargets.has(id)
          ) {
            if (!noteIndexMap[id]) noteIndexMap[id] = noteIdx++;
          }
          Array.from(node.childNodes).forEach(walkForNoteAnchors);
        }
      }
      walkForNoteAnchors(edition);

      // Parse app entries
      appEntryData = Array.from(
        edition.getElementsByTagNameNS(NS, "app"),
      ).map((app) => {
        const id = app.getAttribute("xml:id");
        const lemEl = app.getElementsByTagNameNS(NS, "lem")[0];
        const isConj = lemEl?.getAttribute("type") === "conjecture";
        const lemText = lemEl?.textContent?.trim() || "";
        // Find parent line n
        let parent = app.parentNode;
        while (parent && parent.localName !== "l") parent = parent.parentNode;
        const lineN = parent?.getAttribute("n") || "";

        const rdgs = Array.from(app.getElementsByTagNameNS(NS, "rdg")).map(
          (r) => ({
            wit: r.getAttribute("wit") || "",
            text: r.textContent.trim(),
            type: r.getAttribute("type") || "substantive",
          }),
        );
        return { id, lineN, lemText, isConj, rdgs };
      });

      // Calcola i testimoni che compaiono effettivamente in almeno un <rdg>
      const activeWitSet = new Set();
      appEntryData.forEach((entry) => {
        entry.rdgs.forEach((r) => {
          r.wit.trim().split(/\s+/).forEach((w) => {
            const id = w.replace("#", "");
            if (id) activeWitSet.add(id);
          });
        });
      });
      // Mantieni l'ordine originale di allWitIds, filtrando a quelli attivi
      activeWitIds = allWitIds.filter((id) => activeWitSet.has(id));
      // Inizializza i filtri solo sui testimoni attivi
      ["L", "R"].forEach((c) => {
        witnessFilter[c] = new Set(activeWitIds);
      });

      // Render text
      let textHtml = "";
      Array.from(edition.getElementsByTagNameNS(NS, "lg")).forEach((lg) => {
        textHtml += '<div class="tei-lg">';
        Array.from(lg.getElementsByTagNameNS(NS, "l")).forEach((l) => {
          const n = l.getAttribute("n");
          textHtml += `<div class="tei-l"><span class="line-n">${n}</span>${walkLine(l)}</div>`;
        });
        textHtml += "</div>";
      });

      ["L", "R"].forEach((c) => {
        document.getElementById(`out-testo-${c}`).innerHTML = textHtml;
      });

      // Render apparatus (will be re-rendered on filter change)
      renderApparatus("L");
      renderApparatus("R");

      // Render commento
      renderCommento("L");
      renderCommento("R");

      // Render traduzione
      buildTranslation();

      // Build filter bars
      buildFilterBars();

      // Bind text interactions
      bindTextEvents();
    }

    /* ──────────────────────────────────────────────────────────────
 SMART QUOTES
────────────────────────────────────────────────────────────── */
    function smartQuotes(str) {
      if (!str) return str;
      return str
        // 1. Virgolette doppie: " che apre (aggiunta la chiusura della tonda dopo [^"])
        .replace(/(^|[\s(\[{>«])"([^"])/g, '$1\u201C$2')
        // 2. Virgolette doppie: " che chiude
        .replace(/"([\s.,;:!?)\]}>»]|$)/g, '\u201D$1')
        // 3. Apostrofo interno a parola (dell', l'uomo, ecc.)
        .replace(/(\w)'(\w)/g, '$1\u2019$2')
        // 4. Apostrofo iniziale elisione ('l → l')
        .replace(/(^|[\s])'(\w)/g, '$1\u2018$2')
        // 5. Apostrofo residuo → chiusura
        .replace(/'/g, '\u2019');
    }

    // Applica smartQuotes solo ai nodi testuali di una stringa HTML,
    // senza toccare tag o attributi.
    function smartQuotesHtml(html) {
      if (!html) return html;
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      const walker = document.createTreeWalker(tmp, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        node.textContent = smartQuotes(node.textContent);
      }
      return tmp.innerHTML;
    }

    function walkLine(l) {
      let out = "";
      l.childNodes.forEach((node) => {
        if (node.nodeType === 3) {
          out += smartQuotes(node.textContent);
          return;
        }
        if (node.nodeType !== 1) return;
        if (node.localName === "app") {
          const id = node.getAttribute("xml:id");
          const lemEl = node.getElementsByTagNameNS(NS, "lem")[0];
          const isConj = lemEl?.getAttribute("type") === "conjecture";
          const lemText = lemEl?.textContent?.trim() || "";
          const ni = noteIndexMap[id] || ""; // note marker if this app has a note
          const marker = ni
            ? `<sup class="note-marker" data-seg-id="${id}">${ni}</sup>`
            : "";
          out += `<span class="tei-app${isConj ? " conjecture" : ""}" data-app-id="${id}">${lemText}</span>${marker}`;
        } else if (node.localName === "seg") {
          const sid = node.getAttribute("xml:id");
          const ni = noteIndexMap[sid] || "";
          out += `<span class="tei-seg" data-seg-id="${sid}">${node.textContent}<sup class="note-marker" data-seg-id="${sid}">${ni}</sup></span>`;
        } else {
          out += node.textContent;
        }
      });
      return out;
    }

    /* ──────────────────────────────────────────────────────────────
 TABS
────────────────────────────────────────────────────────────── */
    const paneLabels = {
      testo: "Testo Critico",
      facsimile: "Facsimile",
      traduzione: "Traduzione",
      apparato: "Apparato",
      commento: "Commento",
    };

    function buildTabs() {
      ["L", "R"].forEach((c) => {
        const bar = document.getElementById("tabs-" + c);
        let h = "";
        availablePanes.forEach((p) => {
          h += `<button class="tab" data-pane="${p}" data-col="${c}" onclick="switchPane('${c}','${p}')">${paneLabels[p]}</button>`;
        });
        bar.innerHTML = h;
      });
    }

    function switchPane(col, paneId) {
      activePaneId[col] = paneId;
      // Update tabs
      document.querySelectorAll(`[data-col="${col}"].tab`).forEach((t) => {
        t.classList.toggle("active", t.dataset.pane === paneId);
      });
      // Show/hide panes
      const paneIds = [
        "testo",
        "facsimile",
        "traduzione",
        "apparato",
        "commento",
      ];
      paneIds.forEach((p) => {
        const el = document.getElementById(`out-${p}-${col}`);
        if (el) el.classList.toggle("hidden", p !== paneId);
      });
      // Show/hide filter bar
      const fb = document.getElementById(`app-filters-${col}`);
      if (fb) fb.classList.toggle("hidden", paneId !== "apparato");
      // Facsimile init
      if (paneId === "facsimile") initFacsimileDisplay(col);
    }

    /* ──────────────────────────────────────────────────────────────
 APPARATUS
────────────────────────────────────────────────────────────── */
    function renderApparatus(col) {
      const wf = witnessFilter[col];
      const vf = variantFilter[col];
      let h = "";

      appEntryData.forEach((entry) => {
        // Build visible rdgs
        const visRdgs = entry.rdgs.filter((r) => {
          if (!vf.has(r.type)) return false;
          // Filter by witness
          const wits = r.wit
            .trim()
            .split(/\s+/)
            .map((w) => w.replace("#", ""));
          return wits.some((w) => wf.has(w) || w === "");
        });

        // Apparato negativo: skip entries with no rdgs different from lem
        // (rdg empty = om., still shown if witnesses visible)
        if (visRdgs.length === 0) return;

        // Format lem
        const lemDisp = entry.isConj ? `⟨${entry.lemText}⟩` : entry.lemText;
        // Format rdgs
        let rdgParts = [];
        visRdgs.forEach((r) => {
          const wits = r.wit
            .trim()
            .split(/\s+/)
            .map((w) => w.replace("#", ""))
            .filter((w) => wf.has(w));
          if (wits.length === 0) return;
          const witStr = wits.join(", ");
          if (!r.text) {
            rdgParts.push(
              `<span style="font-style:normal">om.</span> <span class="wit-sig">${witStr}</span>`,
            );
          } else {
            rdgParts.push(
              `<span class="rdg-text">${r.text}</span> <span class="wit-sig">${witStr}</span>`,
            );
          }
        });

        if (rdgParts.length === 0) return;

        h += `<div class="app-entry" data-app-id="${entry.id}">
      <span class="line-ref">${entry.lineN}</span>
      <span class="lem-text">${lemDisp}</span>]
      ${rdgParts.join("; ")}
    </div>`;
      });

      if (!h)
        h =
          '<div style="padding:20px;color:#aaa;font-size:13px;font-style:italic">Nessuna variante da mostrare.</div>';
      document.getElementById(`out-apparato-${col}`).innerHTML = h;
      // Rebind
      document
        .querySelectorAll(`#out-apparato-${col} .app-entry`)
        .forEach((el) => {
          el.addEventListener("click", () => {
            // Clicked from apparatus: scroll the lem in the OTHER col
            const appId = el.dataset.appId;
            document
              .querySelectorAll(".tei-app.hl, .app-entry.hl")
              .forEach((e) => e.classList.remove("hl"));
            document
              .querySelectorAll(`.tei-app[data-app-id="${appId}"]`)
              .forEach((e) => e.classList.add("hl"));
            el.classList.add("hl");
            const tgtCol = otherCol(col);
            const span = document.querySelector(
              `#out-testo-${tgtCol} .tei-app[data-app-id="${appId}"]`,
            );
            if (span) {
              if (span) {
                ensurePaneVisible(tgtCol, "testo");
                setTimeout(
                  () =>
                    span.scrollIntoView({
                      behavior: "smooth",
                      block: "center",
                    }),
                  120,
                );
              }
            }
          });
        });
    }

    /* ──────────────────────────────────────────────────────────────
 COMMENTO
────────────────────────────────────────────────────────────── */
    function renderCommento(col) {
      let h = "";
      commentData.forEach((nd) => {
        const ni = noteIndexMap[nd.target] || "";
        h += `<div class="note-entry" id="note-${col}-${nd.target}" data-note-target="${nd.target}">
      <div class="note-marker-label"><sup>${ni}</sup> Nota di commento</div>
      <div style="font-family:'Source Serif 4',serif;font-size:0.97rem;line-height:1.75">${nd.text}</div>
    </div>`;
      });
      if (!h)
        h =
          '<div style="padding:20px;color:#aaa;font-size:13px;font-style:italic">Nessuna nota di commento.</div>';
      document.getElementById(`out-commento-${col}`).innerHTML = h;
      // Bind note → hl in text
      document
        .querySelectorAll(`#out-commento-${col} .note-entry`)
        .forEach((el) => {
          el.addEventListener("click", () => {
            const segId = el.dataset.noteTarget;
            document
              .querySelectorAll(
                ".note-marker.hl, .tei-seg.hl, .note-entry.hl",
              )
              .forEach((e) => e.classList.remove("hl"));
            document
              .querySelectorAll(`.note-marker[data-seg-id="${segId}"]`)
              .forEach((e) => e.classList.add("hl"));
            document
              .querySelectorAll(`.tei-seg[data-seg-id="${segId}"]`)
              .forEach((e) => e.classList.add("hl"));
            el.classList.add("hl");
            const tgtCol = otherCol(col);
            const marker = document.querySelector(
              `#out-testo-${tgtCol} .note-marker[data-seg-id="${segId}"]`,
            );
            if (marker) {
              ensurePaneVisible(tgtCol, "testo");
              setTimeout(
                () =>
                  marker.scrollIntoView({
                    behavior: "smooth",
                    block: "center",
                  }),
                120,
              );
            }
          });
        });
    }

    /* ──────────────────────────────────────────────────────────────
 TRADUZIONE
────────────────────────────────────────────────────────────── */
    function buildTranslation() {
      const trans = Array.from(xml.getElementsByTagNameNS(NS, "div")).find(
        (d) => d.getAttribute("type") === "translation",
      );
      if (!trans) return;
      let h = "";
      const lines = Array.from(trans.getElementsByTagNameNS(NS, "l"));
      const paras = Array.from(trans.getElementsByTagNameNS(NS, "p"));
      if (lines.length > 0) {
        lines.forEach((l) => {
          h += `<div class="tei-l"><span class="line-n">${l.getAttribute("n")}</span>${smartQuotes(l.textContent)}</div>`;
        });
      } else {
        paras.forEach((p) => {
          h += `<p style="font-family:'Source Serif 4',serif;font-size:1.05rem;line-height:1.85;margin:0 0 1.2rem;font-style:italic">${smartQuotesHtml(p.innerHTML)}</p>`;
        });
      }
      document.getElementById("out-traduzione-L").innerHTML = h;
      document.getElementById("out-traduzione-R").innerHTML = h;
    }

    /* ──────────────────────────────────────────────────────────────
 FILTER BARS
────────────────────────────────────────────────────────────── */
    function buildFilterBars() {
      ["L", "R"].forEach((col) => {
        const fb = document.getElementById(`app-filters-${col}`);
        // Witness chips
        let h = '<div class="filter-bar">';
        h += "<label>Testimoni</label>";
        activeWitIds.forEach((wid) => {
          h += `<button class="filter-chip on" data-col="${col}" data-wit="${wid}" onclick="toggleWit('${col}','${wid}',this)">${wid}</button>`;
        });
        h += '<div class="filter-divider"></div>';
        h += "<label>Varianti</label>";
        h += `<button class="filter-chip on" data-col="${col}" data-vtype="substantive"   onclick="toggleVType('${col}','substantive',this)">Sostanziali</button>`;
        h += `<button class="filter-chip on" data-col="${col}" data-vtype="orthographic"  onclick="toggleVType('${col}','orthographic',this)">Ortografiche</button>`;
        h += "</div>";
        fb.innerHTML = h;
      });
    }

    function toggleWit(col, witId, btn) {
      if (witnessFilter[col].has(witId)) witnessFilter[col].delete(witId);
      else witnessFilter[col].add(witId);
      btn.classList.toggle("on", witnessFilter[col].has(witId));
      renderApparatus(col);
    }

    function toggleVType(col, vtype, btn) {
      if (variantFilter[col].has(vtype)) variantFilter[col].delete(vtype);
      else variantFilter[col].add(vtype);
      btn.classList.toggle("on", variantFilter[col].has(vtype));
      renderApparatus(col);
    }

    /* ──────────────────────────────────────────────────────────────
 TEXT INTERACTIONS
────────────────────────────────────────────────────────────── */
    /* ──────────────────────────────────────────────────────────────
 UTILITY: which column does a DOM element belong to?
────────────────────────────────────────────────────────────── */
    function colOf(el) {
      if (el.closest("#col-left")) return "L";
      if (el.closest("#col-right")) return "R";
      return null;
    }
    function otherCol(col) {
      return col === "L" ? "R" : "L";
    }

    function bindTextEvents() {
      document.body.addEventListener("click", (e) => {
        // App span in text → open rdg in the OTHER column
        const appSpan = e.target.closest(".tei-app");
        if (appSpan) {
          const srcCol = colOf(appSpan);
          highlightApp(appSpan.dataset.appId, srcCol);
          return;
        }

        // Note marker / seg → open note in the OTHER column
        const marker = e.target.closest(".note-marker, .tei-seg");
        if (marker) {
          const sid = marker.dataset.segId;
          if (sid) {
            const srcCol = colOf(marker);
            highlightNote(sid, srcCol);
            return;
          }
        }

        // Clic su area neutra: rimuovi tutte le evidenziazioni
        if (!e.target.closest(".app-entry, .note-entry")) {
          document
            .querySelectorAll(
              ".tei-app.hl, .app-entry.hl, .note-marker.hl, .tei-seg.hl, .note-entry.hl",
            )
            .forEach((el) => el.classList.remove("hl"));
        }
      });
    }

    /*
highlightApp(appId, srcCol)
  srcCol = column where the click originated ('L', 'R', or null if from apparatus)
Logic:
  - If clicked from text (srcCol known): highlight lem in ALL text panels, open rdg
    in the opposite column's apparatus. The source column pane is NOT changed.
  - If clicked from apparatus (srcCol=null): highlight lem in text panels of ALL
    columns that are currently showing testo; scroll to it. Do not change those panes.
*/
    function highlightApp(appId, srcCol) {
      document
        .querySelectorAll(".tei-app.hl, .app-entry.hl")
        .forEach((el) => el.classList.remove("hl"));

      // Always highlight lem spans everywhere (visual feedback only, no pane switch)
      document
        .querySelectorAll(`.tei-app[data-app-id="${appId}"]`)
        .forEach((el) => el.classList.add("hl"));

      if (srcCol) {
        // Clicked from text: open apparatus in the OTHER column
        const tgtCol = otherCol(srcCol);
        ensurePaneVisible(tgtCol, "apparato");
        const entry = document.querySelector(
          `#out-apparato-${tgtCol} [data-app-id="${appId}"]`,
        );
        if (entry) {
          entry.classList.add("hl");
          setTimeout(
            () =>
              entry.scrollIntoView({ behavior: "smooth", block: "center" }),
            120,
          );
        }
        // Also highlight (but don't switch) apparatus in the source column if it's already open
        const entrySrc = document.querySelector(
          `#out-apparato-${srcCol} [data-app-id="${appId}"]`,
        );
        if (entrySrc) entrySrc.classList.add("hl");
      } else {
        // Clicked from apparatus: determine which column the apparatus lives in,
        // then scroll/highlight the lem in the OTHER column's testo
        // (caller passes srcCol=null; we detect via the clicked element stored in lastAppClick)
        ["L", "R"].forEach((col) => {
          const span = document.querySelector(
            `#out-testo-${col} .tei-app[data-app-id="${appId}"]`,
          );
          if (!span) return;
          if (activePaneId[col] === "testo") {
            setTimeout(
              () =>
                span.scrollIntoView({ behavior: "smooth", block: "center" }),
              120,
            );
          }
        });
      }
    }

    /*
highlightNote(segId, srcCol)
  srcCol = column of the clicked marker/seg, or null if click came from a note-entry
*/
    function highlightNote(segId, srcCol) {
      document
        .querySelectorAll(".note-marker.hl, .tei-seg.hl, .note-entry.hl")
        .forEach((el) => el.classList.remove("hl"));

      // Highlight all markers and segs everywhere (visual only)
      document
        .querySelectorAll(`.note-marker[data-seg-id="${segId}"]`)
        .forEach((el) => el.classList.add("hl"));
      document
        .querySelectorAll(`.tei-seg[data-seg-id="${segId}"]`)
        .forEach((el) => el.classList.add("hl"));

      if (srcCol) {
        // Clicked from text: open commento in the OTHER column
        const tgtCol = otherCol(srcCol);
        ensurePaneVisible(tgtCol, "commento");
        const ne = document.getElementById(`note-${tgtCol}-${segId}`);
        if (ne) {
          ne.classList.add("hl");
          setTimeout(
            () => ne.scrollIntoView({ behavior: "smooth", block: "center" }),
            120,
          );
        }
        // Also highlight (don't switch) note in source column if commento already open
        const neSrc = document.getElementById(`note-${srcCol}-${segId}`);
        if (neSrc) neSrc.classList.add("hl");
      } else {
        // Clicked from note panel: scroll to marker in the other column's testo
        ["L", "R"].forEach((col) => {
          const marker = document.querySelector(
            `#out-testo-${col} .note-marker[data-seg-id="${segId}"]`,
          );
          if (!marker) return;
          if (activePaneId[col] === "testo") {
            setTimeout(
              () =>
                marker.scrollIntoView({
                  behavior: "smooth",
                  block: "center",
                }),
              120,
            );
          }
        });
      }
    }

    function ensurePaneVisible(col, paneId) {
      if (
        document
          .getElementById("main-body")
          .classList.contains("layout-single")
      ) {
        selectView("edition");
      }
      if (activePaneId[col] !== paneId) {
        switchPane(col, paneId);
      }
    }

    /* ──────────────────────────────────────────────────────────────
 FACSIMILE — Mirador IIIF
 Struttura TEI attesa:
   <surface xml:id="A" corresp="#A">
     <graphic url="...manifest.json" mimeType="application/ld+json"/>
     <zone xml:id="A_9r" n="9r"/>
     <zone xml:id="A_9v" n="9v"/>
   </surface>
────────────────────────────────────────────────────────────── */

    /* ── PARSING TEI: costruisce surfaceByWit ── */
    function buildFacsimile() {
      const surfaces = Array.from(xml.getElementsByTagNameNS(NS, "surface"));
      if (!surfaces.length) return;

      // FIX 1: popola surfaceByWit qui, non altrove
      surfaceByWit = {};
      surfaces.forEach(surf => {
        const witId = (surf.getAttribute("corresp") || surf.getAttribute("xml:id") || "").replace("#","");
        const graphic = surf.getElementsByTagNameNS(NS, "graphic")[0];
        const manifestUrl = graphic?.getAttribute("url") || "";
        const zones = Array.from(surf.getElementsByTagNameNS(NS, "zone")).map(z => ({
          id:      z.getAttribute("xml:id") || "",
          n:       z.getAttribute("n") || "",
          corresp: z.getAttribute("corresp") || "",  // opzionale: id parziale canvas
        }));
        if (witId && manifestUrl) surfaceByWit[witId] = { manifestUrl, zones };
      });

      // Costruisce HTML dei pannelli
      ["L","R"].forEach(col => {
        const container = document.getElementById("out-facsimile-" + col);
        // FIX 5: usa concatenazione invece di template literal annidato
        // Usa template literal esterno — col è una variabile JS, non HTML
        const q = col; // alias leggibile
        container.innerHTML = `
          <div class="fac-wrapper">
            <div class="fac-toolbar">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)">Testimone</span>
                <select class="fac-select" id="fac-wit-${q}" onchange="facWitChange('${q}',this.value)">
                  ${witnesses.filter(w => surfaceByWit[w.id]).map(w => `<option value="${w.id}">${w.id} – ${w.text}</option>`).join("")}
                </select>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <button class="fac-btn" id="fac-first-${q}" onclick="facPage('${q}','first')">inizio</button>
                <button class="fac-btn" id="fac-prev-${q}"  onclick="facPage('${q}','prev')">prec.</button>
                <span class="page-indicator" id="fac-page-${q}">–</span>
                <button class="fac-btn" id="fac-next-${q}" onclick="facPage('${q}','next')">succ.</button>
                <button class="fac-btn" id="fac-last-${q}" onclick="facPage('${q}','last')">fine</button>
              </div>
            </div>
            <div class="fac-mirador-container" style="position:relative;flex:1;min-height:0">
              <div class="fac-loading" id="fac-loading-${q}">
                <div class="fac-spinner"></div>
                <div class="fac-loading-text">Caricamento facsimile…</div>
              </div>
              <div id="mirador-mount-${q}" style="width:100%;height:100%"></div>
            </div>
          </div>`;
      });
    }

    function initFacsimileDisplay(col) {
      // FIX 2: surfaceByWit è già popolato da buildFacsimile, chiamata sicura
      const witId = witnesses[0]?.id;
      if (witId) facWitChange(col, witId);
    }

    function facWitChange(col, witId) {
      const sel = document.getElementById("fac-wit-" + col);
      if (sel) sel.value = witId;
      const st   = miradorState[col];
      const data = surfaceByWit[witId];
      if (!data) return;
      st.pages   = data.zones.map(z => ({ n: z.n, id: z.id, corresp: z.corresp || "", manifestUrl: data.manifestUrl }));
      st.pageIdx = 0;
      // FIX 3: resetta anche storeSubscribed per il nuovo testimone
      st.initialized    = false;
      st.storeSubscribed = false;
      if (st.blobUrl) { URL.revokeObjectURL(st.blobUrl); st.blobUrl = null; }
      // Sostituisce il div mount con uno nuovo: React non può rimontarsi su un nodo già usato
      const oldMount = document.getElementById(MIRADOR_EL[col]);
      if (oldMount) {
        const newMount = document.createElement("div");
        newMount.id    = MIRADOR_EL[col];
        newMount.style.cssText = "width:100%;height:100%";
        oldMount.replaceWith(newMount);
      }
      const loading = document.getElementById("fac-loading-" + col);
      if (loading) loading.style.display = "";
      initMiradorForCol(col);
      updateFacNav(col);
    }

    function facPage(col, action) {
      const st     = miradorState[col];
      const max    = st.pages.length - 1;
      const before = st.pageIdx; // salva PRIMA di qualsiasi modifica
      let   target = before;
      if      (action === "first")             target = 0;
      else if (action === "last")              target = max;
      else if (action === "prev" && before > 0)    target = before - 1;
      else if (action === "next" && before < max)  target = before + 1;
      if (target === before) return; // nessun cambiamento
      st.pageIdx = target;
      miradorNavigateTo(col, target, before);
      updateFacNav(col);
    }

    function updateFacNav(col) {
      const st  = miradorState[col];
      const cur = st.pages[st.pageIdx];
      const lbl = document.getElementById("fac-page-" + col);
      if (lbl) lbl.textContent = cur ? "c. " + cur.n : "–";
      const isFirst = st.pageIdx === 0;
      const isLast  = st.pageIdx === st.pages.length - 1;
      ["first","prev"].forEach(k => {
        const b = document.getElementById("fac-" + k + "-" + col);
        if (b) b.disabled = isFirst;
      });
      ["next","last"].forEach(k => {
        const b = document.getElementById("fac-" + k + "-" + col);
        if (b) b.disabled = isLast;
      });
    }

    /* ── Avvia Mirador (idempotente per testimone corrente) ── */
    function initMiradorForCol(col) {
      const st = miradorState[col];
      if (!st.pages.length)  return;
      if (st.initialized)    return;
      st.initialized = true;
      mountMirador(col);
    }

    function hideMiradorLoading(col) {
      const el = document.getElementById("fac-loading-" + col);
      if (el) el.style.display = "none";
    }

    /* ── Helper: estrae canvas da manifest IIIF v2/v3 ── */
    function extractCanvasesFromManifest(manifest) {
      if (manifest.items) return manifest.items;
      if (manifest.sequences?.[0]?.canvases) return manifest.sequences[0].canvases;
      return [];
    }

    /* ── Helper: label testuale di una canvas (v2 e v3) ── */
    function getCanvasLabel(canvas) {
      const lbl = canvas.label;
      if (!lbl) return "";
      if (typeof lbl === "string") return lbl;
      if (typeof lbl === "object") {
        const vals = Object.values(lbl);
        const first = vals[0];
        if (Array.isArray(first)) return first[0] || "";
        return first || "";
      }
      return "";
    }

    /* ── Helper: filtra canvas per foglio — match esatto > startsWith > includes ── */
    function filterCanvasesByFolio(canvases, pages) {
      return pages.map(p => {
        // Se la zona ha @corresp, cerca per id canvas (match esatto sul suffisso)
        if (p.corresp) {
          const found = canvases.find(c => (c["@id"] || c.id || "").includes(p.corresp));
          if (found) return found;
        }
        // Altrimenti match per label: esatto > startsWith > includes
        const n = p.n.toLowerCase();
        let found = canvases.find(c => getCanvasLabel(c).toLowerCase() === n);
        if (!found) found = canvases.find(c => getCanvasLabel(c).toLowerCase().startsWith(n));
        if (!found) found = canvases.find(c => getCanvasLabel(c).toLowerCase().includes(n));
        return found;
      }).filter(Boolean);
    }

    /* ── Helper: manifest IIIF 2.x ridotto con solo le canvas selezionate ── */
    function buildReducedManifest(source, canvases) {
      const label = source.label || source["@label"] || "Facsimile";
      return {
        "@context":  "http://iiif.io/api/presentation/2/context.json",
        "@id":       source["@id"] || "https://example.org/reduced",
        "@type":     "sc:Manifest",
        "label":     typeof label === "object"
                       ? (Object.values(label)[0]?.[0] || "Facsimile")
                       : label,
        "sequences": [{
          "@type":    "sc:Sequence",
          "@id":      (source["@id"] || "https://example.org") + "/sequence/normal",
          "canvases": canvases,
        }],
        "metadata":  source.metadata || [],
      };
    }

    /* ── Monta Mirador: fetch manifest → filtra canvas → Blob URL ── */
    async function mountMirador(col) {
      const st          = miradorState[col];
      const manifestUrl = st.pages[0]?.manifestUrl;
      if (!manifestUrl) return;

      let sourceManifest;
      try {
        const r = await fetch(manifestUrl, {
          headers: { Accept: "application/json, application/ld+json" }
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        sourceManifest = await r.json();
      } catch(e) {
        const el = document.getElementById("fac-loading-" + col);
        if (el) el.innerHTML =
          '<div style="padding:24px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8">' +
          '<strong style="display:block;margin-bottom:8px">Facsimile non disponibile</strong>' +
          'Manifest non raggiungibile: ' + e.message + '<br><br>' +
          '<span style="font-size:10px">URL: ' + manifestUrl + '</span></div>';
        return;
      }

      const allCanvases = extractCanvasesFromManifest(sourceManifest);
      if (!allCanvases.length) return;

      const foundCanvases = filterCanvasesByFolio(allCanvases, st.pages);
      const finalCanvases = foundCanvases.length === st.pages.length
        ? foundCanvases
        : allCanvases.slice(0, wantedNs.length);

      st.canvases = finalCanvases;
      st.pageIdx  = 0;

      const reduced = buildReducedManifest(sourceManifest, finalCanvases);
      if (st.blobUrl) URL.revokeObjectURL(st.blobUrl);
      st.blobUrl = URL.createObjectURL(
        new Blob([JSON.stringify(reduced)], { type: "application/json" })
      );

      hideMiradorLoading(col);

      st.viewer = Mirador.viewer({
        id: MIRADOR_EL[col],
        windows: [{
          id:                          "win-" + col,
          loadedManifest:              st.blobUrl,
          canvasIndex:                 0,
          view:                        "single",
          thumbnailNavigationPosition: "off",
          allowClose:                  false,
          allowMaximize:               false,
          allowTopMenuButton:          false,
          hideWindowTitle:             true,
          sideBarOpenByDefault:        false,
        }],
        workspace: {
          showZoomControls:      true,
          type:                  "mosaic",
          isWorkspaceAddVisible: false,
        },
        workspaceControlPanel: { enabled: false },
        thumbnailNavigation:   { defaultPosition: "off" },
        window: {
          allowMaximize:        false,
          allowClose:           false,
          allowTopMenuButton:   false,
          sideBarOpenByDefault: false,
          hideWindowTitle:      true,
        },
      });

      installStoreSync(col);
      updateFacNav(col);
      fixMiradorCanvasNav(col);
    }

    function installStoreSync(col) {
      const st        = miradorState[col];
      const container = document.getElementById(MIRADOR_EL[col]);
      if (!container || st.storeSubscribed) return;
      st.storeSubscribed = true;
      const poll = setInterval(() => {
        const btnNext = container.querySelector('button[aria-label="Next item"]');
        const btnPrev = container.querySelector('button[aria-label="Previous item"]');
        if (!btnNext || !btnPrev) return;
        clearInterval(poll);
        btnNext.addEventListener("click", () => {
          if (st.pageIdx < st.canvases.length - 1) { st.pageIdx++; setTimeout(() => updateFacNav(col), 80); }
        });
        btnPrev.addEventListener("click", () => {
          if (st.pageIdx > 0) { st.pageIdx--; setTimeout(() => updateFacNav(col), 80); }
        });
      }, 200);
    }

    /* FIX 4: firma corretta con before e targetIdx separati */
    function miradorNavigateTo(col, targetIdx, before) {
      const st        = miradorState[col];
      const container = document.getElementById(MIRADOR_EL[col]);
      if (!container) return;
      const diff  = targetIdx - before;
      if (diff === 0) return;
      const label  = diff > 0 ? "Next item" : "Previous item";
      const steps  = Math.abs(diff);
      let clicked  = 0;
      const poll = setInterval(() => {
        const btn = container.querySelector('button[aria-label="' + label + '"]');
        if (!btn || btn.disabled) { clearInterval(poll); return; }
        btn.click();
        clicked++;
        if (clicked >= steps) { clearInterval(poll); updateFacNav(col); }
      }, 120);
    }

    function fixMiradorCanvasNav(col) {
      const container = document.getElementById(MIRADOR_EL[col]);
      if (!container) return;
      let attempts = 0;
      const interval = setInterval(() => {
        attempts++;
        container.querySelectorAll(".mirador-canvas-nav").forEach(el => {
          el.style.setProperty("background",       "transparent", "important");
          el.style.setProperty("background-color", "transparent", "important");
          el.style.setProperty("box-shadow",       "none",        "important");
          el.style.setProperty("position",         "absolute",    "important");
          el.style.setProperty("bottom",           "8px",         "important");
          el.style.setProperty("top",              "auto",        "important");
          el.style.setProperty("left",             "50%",         "important");
          el.style.setProperty("transform",        "translateX(-50%)", "important");
          el.style.setProperty("height",           "auto",        "important");
          el.style.setProperty("width",            "auto",        "important");
        });
        container.querySelectorAll(".mirador-osd-container").forEach(el => {
          el.style.setProperty("position", "relative", "important");
        });
        if (attempts >= 20) clearInterval(interval);
      }, 200);
    }

  </script>
</body>
