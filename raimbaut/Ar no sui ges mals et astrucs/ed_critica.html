<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edizione Digitale TEI</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Mirador IIIF Viewer -->
  <script src="https://unpkg.com/mirador@3.3.0/dist/mirador.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
    rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    <link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
  rel="stylesheet" />

  <style>
    :root {
      --accent: #a03f33;
      --accent-light: rgba(160, 63, 51, 0.08);
      --accent-hover: rgba(160, 63, 51, 0.15);
      --bg: #fbf9f4;
      --bg-panel: #f5f3ee;
      --text: #1a1410;
      --muted: #6b7280;
      --border: #e2ddd6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Source Sans 3", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }

    /* ── LAYOUT ── */
    .layout-single #col-right  { display: none !important; }
    .layout-single #col-left   { width: 100% !important; border-right: none !important; }
    .layout-single #col-resizer{ display: none !important; }
    .layout-dual   #col-right  { display: flex !important; }
    .layout-dual   #col-left   { width: var(--col-left-w, 50%); border-right: none !important; flex: none !important; }
    .layout-dual   #col-right  { flex: 1 !important; min-width: 15%; }

    .hidden {
      display: none !important;
    }

    /* ── RESIZER ── */
    #col-resizer {
      flex-shrink: 0;
      width: 12px;
      background: transparent;
      cursor: col-resize;
      position: relative;
      z-index: 20;
      user-select: none;
    }
    #col-resizer::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      background: var(--border);
      transition: background 0.2s;
    }
    #col-resizer::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 24px;
      background: #d1cdc8;
      border-radius: 99px;
      transition: background 0.2s, height 0.2s;
      z-index: 1;
    }
    #col-resizer:hover::before,
    #col-resizer.dragging::before {
      background: #bbb;
    }
    #col-resizer:hover::after,
    #col-resizer.dragging::after {
      background: #9e9e9e;
      height: 32px;
    }

    /* ── SIDEBAR ── */
    aside {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    aside.collapsed { width: 52px; }
    .sidebar-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

    /* Header sidebar con toggle */
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 12px 10px 16px; flex-shrink: 0; min-height: 48px; overflow: hidden;
    }
    aside.collapsed .sidebar-header { justify-content: center; padding: 14px 0 10px; }
    .sidebar-header-label {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.15em; color: var(--muted);
      white-space: nowrap; overflow: hidden; opacity: 1;
      transition: opacity 0.12s;
    }
    aside.collapsed .sidebar-header-label { opacity: 0; width: 0; pointer-events: none; }
    .sidebar-toggle-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px;
      border: none; background: transparent; cursor: pointer;
      color: var(--muted); display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s; padding: 0;
    }
    .sidebar-toggle-btn:hover { background: rgba(0,0,0,0.07); color: var(--text); }
    .sidebar-toggle-btn .material-symbols-outlined { font-size: 20px; }

    /* Nav buttons: icone centrate quando collassata */
    .nav-label { white-space: nowrap; overflow: hidden; transition: opacity 0.12s; }
    aside.collapsed .nav-label { opacity: 0; width: 0; pointer-events: none; display: none; }
    aside.collapsed .nav-btn { justify-content: center; padding: 11px 0; gap: 0; }
    aside.collapsed .sep { margin: 8px 10px; }
    aside.collapsed #resp-info { display: none; }
    aside.collapsed .sidebar-footer { display: none; }

    /* Sidebar tab — rimossa, toggle ora è interno */
    .sidebar-tab { display: none !important; }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, padding 0.22s, justify-content 0.22s;
      text-align: left;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    /* tooltip quando collassata */
    aside.collapsed .nav-btn[title]:hover::after {
      content: attr(title);
      position: fixed;
      left: 58px;
      background: #1a1410;
      color: white;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }

    .nav-btn:hover {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text);
    }

    .nav-btn.active {
      background: white;
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 800;
    }

    .nav-btn .material-symbols-outlined {
      font-size: 18px;
      font-variation-settings:
        "FILL" 0,
        "wght" 400,
        "GRAD" 0,
        "opsz" 24;
    }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
      background: white;
      min-height: 40px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab {
      padding: 0 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      margin-bottom: -1px;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── PIN / LOCK PANEL ──
       Pulsante puntina da disegno in fondo alla tab-bar. Stato attivo =
       pannello bloccato. La tab-bar bloccata mostra le tab disabilitate
       (lo switch di pane è gestito dai link cross-pane sull'altro pannello). */
    .pin-btn {
      margin-left: auto;
      padding: 0 12px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      transition: color 0.15s, border-color 0.15s, transform 0.2s;
      margin-bottom: -1px;
    }
    .pin-btn:hover {
      color: var(--text);
    }
    .pin-btn .material-symbols-outlined {
      font-size: 18px;
    }
    .pin-btn.locked {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .pin-btn.locked .material-symbols-outlined {
      font-variation-settings: "FILL" 1;
      transform: rotate(-30deg);
    }
    .tab-bar.locked .tab {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }
    .tab-bar.locked .tab.active {
      opacity: 0.85;
    }

    /* ── SCROLLABLE PANES ── */
    .scroll-pane {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color 0.3s;
    }
    .scroll-pane:hover {
      scrollbar-color: #d1cdc8 transparent;
    }

    .scroll-pane::-webkit-scrollbar {
      width: 6px;
    }
    .scroll-pane::-webkit-scrollbar-track {
      background: transparent;
    }
    .scroll-pane::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 99px;
      transition: background 0.3s;
    }
    .scroll-pane:hover::-webkit-scrollbar-thumb {
      background: #d1cdc8;
    }
    .scroll-pane::-webkit-scrollbar-thumb:hover {
      background: #b0aca6;
    }

    /* ── POPOVER NOTE FRONT ── */
    .fn-marker { font-family: "Source Sans 3", sans-serif; font-size: 0.65em; vertical-align: super; line-height: 1; color: var(--accent); font-weight: 700; cursor: pointer; }
    .fn-marker:hover { text-decoration: underline; }
    .fn-popover {
      position: fixed; z-index: 999;
      width: 340px; max-width: 90vw;
      background: white; border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      box-shadow: 0 4px 24px rgba(0,0,0,0.13);
      padding: 14px 16px 14px 14px;
      font-family: "Source Serif 4", serif;
      font-size: 0.9rem; line-height: 1.7; color: var(--text);
      opacity: 0; pointer-events: none;
      transition: opacity .12s;
    }
    .fn-popover.visible { opacity: 1; pointer-events: auto; }
    .fn-popover-head { font-family: "Source Sans 3", sans-serif; font-size: 8px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .fn-popover-close { position: absolute; top: 8px; right: 10px; font-size: 14px; color: var(--muted); cursor: pointer; background: none; border: none; line-height: 1; padding: 2px; }
    .fn-popover-close:hover { color: var(--accent); }

    /* ── FRONT-MATTER ── */
    .prose {
      max-width: 720px;
      margin: 0 auto;
      padding: 52px 48px;
    }

    .prose h1 {
      font-family: "Source Sans 3", sans-serif, ;
      font-size: 1.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin: 0 0 2rem;
      color: var(--accent);
    }

    .prose h2 {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 2.5rem 0 0.8rem;
    }

    .prose p {
      font-family: "Source Serif 4", serif;
      font-size: 1.05rem;
      line-height: 1.85;
      margin: 0 0 1.2rem;
    }

    /* ── TESTO CRITICO ── */
    .tei-content {
      font-family: "Source Serif 4", serif;
      font-size: 1.1rem;
      line-height: 1.9;
      padding: 48px 52px;
    }

    .tei-lg {
      margin-bottom: 1.5rem;
    }

    .tei-l {
      position: relative;
      padding-left: 3.5rem;
      margin-bottom: 0.15rem;
    }

    .line-n {
      position: absolute;
      left: 0;
      width: 2.8rem;
      text-align: right;
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.7rem;
      color: var(--accent);
      opacity: 0.55;
      user-select: none;
      top: 0.25em;
    }

    /* ── APP ── */
    .tei-app {
      border-bottom: 1px dotted var(--accent);
      background: var(--accent-light);
      cursor: pointer;
      padding: 0 1px;
      transition: background 0.15s;
    }

    .tei-app.conjecture::before {
      content: "⟨";
      font-size: 0.85em;
      color: var(--accent);
    }

    .tei-app.conjecture::after {
      content: "⟩";
      font-size: 0.85em;
      color: var(--accent);
    }

    .tei-app:hover,
    .tei-app.hl {
      background: var(--accent-hover);
    }

    .tei-app.hl {
      outline: 1px solid var(--accent);
      border-radius: 2px;
    }

    /* ── SEG / NOTE ── */
    .tei-seg {
      cursor: pointer;
    }

    .note-marker {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.65em;
      vertical-align: super;
      line-height: 1;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      border-bottom: none;
      transition: color 0.15s;
    }

    .note-marker:hover,
    .note-marker.hl {
      color: var(--accent);
    }

    /* ── APPARATO ── */
    .app-entry {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-family: "Source Serif 4", serif;
      font-size: 0.95rem;
      transition: background 0.15s;
      cursor: pointer;
    }

    .app-entry:hover {
      background: #faf8f5;
    }

    .app-entry.hl {
      background: rgba(160, 63, 51, 0.15);
      outline: 1px solid rgba(160, 63, 51, 0.15);
    }

    .app-entry .line-ref {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--muted);
      margin-right: 8px;
    }

    .app-entry .lem-text {
      color: var(--accent);
      font-style: italic;
    }

    .app-entry .rdg-text {
      font-style: italic;
    }

    .app-entry .wit-sig {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* ── COMMENTO ── */
    .note-entry {
      border-left: 3px solid var(--accent);
      padding: 14px 18px;
      margin: 16px;
      background: rgba(132, 139, 144, 0.116);
      font-family: "Source Serif 4", serif;
      font-size: 0.95rem;
      transition: background 0.15s;
    }

    .note-entry.hl {
      background: rgba(83, 104, 120, 0.13);
    }

    .note-marker-label {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }

    /* ── TESTIMONI ── */
    .wit-entry {
      display: flex;
      align-items: baseline;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .wit-id {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: oldstyle-nums;
      min-width: 36px;
    }

    .wit-name {
      font-family: "Source Serif 4", serif;
      font-size: 1.05rem;
    }

    /* ── FILTRI APPARATO ── */
    .filter-bar {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #fafaf8;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .filter-bar label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-right: 4px;
    }

    .filter-chip {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--muted);
      transition: all 0.15s;
      font-family: "Source Sans 3", sans-serif;
    }

    .filter-chip.on {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .filter-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
    }

    /* ── FACSIMILE ── */
    .fac-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .fac-toolbar {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .fac-viewer {
      flex: 1;
      overflow: hidden;
      cursor: grab;
      background: #e8e6e0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fac-viewer:active {
      cursor: grabbing;
    }

    .fac-viewport {
      position: absolute;
      transform-origin: center center;
      transition: transform 0.08s ease-out;
    }

    .fac-img {
      height: 85vh;
      max-width: none;
      pointer-events: none;
      display: block;
      border-radius: 3px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    }

    .fac-btn {
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: white;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .fac-btn .material-symbols-outlined {
      font-size: 16px;
      font-variation-settings:
        "FILL" 0,
        "wght" 400,
        "GRAD" 0,
        "opsz" 24;
    }

    .fac-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .fac-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .fac-select {
      font-family: "Source Sans 3", sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--text);
      cursor: pointer;
    }

    .page-indicator {
      font-family: "Source Sans 3", sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      min-width: 52px;
      text-align: center;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(251, 249, 244, 0.97);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
    }

    .header-author {
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .header-title {
      font-family: "Source Serif 4", serif;
      font-style: italic;
      color: var(--accent);
      font-size: 0.95rem;
    }

    .header-status {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #aaa;
    }

    /* ── TRADUZIONE ── */
    .tei-translation .tei-l {
      font-style: italic;
      color: #4b5563;
    }

    /* section col */
    section.col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
    }

    /* ── MISC ── */
    .sep {
      height: 1px;
      background: var(--border);
      margin: 8px 20px;
    }

    /* ── FACSIMILE / MIRADOR ── */
    .fac-wrapper { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .fac-toolbar {
      padding: 8px 14px; border-bottom: 1px solid var(--border); background: white;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 8px; flex-shrink: 0;
    }
    .fac-mirador-container { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    /* ── Barra info IIIF (collassabile, tra toolbar e Mirador) ── */
    .fac-info-bar {
      flex-shrink: 0; border-bottom: 1px solid var(--border);
      background: #f7f5f0; font-family: "Source Sans 3", sans-serif;
      font-size: 10px; color: var(--muted); overflow: hidden;
    }
    .fac-info-bar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 14px; cursor: pointer; user-select: none;
      border-bottom: 1px solid transparent; transition: border-color .15s;
    }
    .fac-info-bar.open .fac-info-bar-header { border-bottom-color: var(--border); }
    .fac-info-bar-title {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--muted);
    }
    .fac-info-bar-toggle {
      font-size: 11px; transition: transform .2s; display: inline-block;
    }
    .fac-info-bar.open .fac-info-bar-toggle { transform: rotate(180deg); }
    .fac-info-bar-body {
      max-height: 0; overflow: hidden;
      transition: max-height .25s cubic-bezier(0.4,0,0.2,1);
    }
    .fac-info-bar.open .fac-info-bar-body { max-height: 200px; overflow-y: auto; }
    .fac-info-bar-inner { padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 3px; }
    .fac-info-row { display: flex; gap: 6px; line-height: 1.4; }
    .fac-info-label { font-weight: 700; flex-shrink: 0; color: var(--muted); }
    .fac-info-value { color: var(--text); word-break: break-all; }
    .fac-info-value a { color: var(--accent); text-decoration: none; }
    .fac-info-value a:hover { text-decoration: underline; }
    .fac-btn { padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; background: white; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
    .fac-btn .material-symbols-outlined { font-size: 16px; }
    .fac-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .fac-btn:disabled { opacity: 0.3; cursor: default; }
    .fac-select { font-family: "Source Sans 3", sans-serif; font-size: 11px; font-weight: 700; padding: 5px 8px; border-radius: 5px; border: 1.5px solid var(--border); background: white; color: var(--text); cursor: pointer; }
    .page-indicator { font-family: "Source Sans 3", sans-serif; font-size: 12px; font-weight: 800; color: var(--accent); min-width: 72px; text-align: center; }
    .fac-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #e8e6e0; flex-direction: column; gap: 12px; z-index: 5; }
    .fac-loading-text { font-family: "Source Sans 3", sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .fac-spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Barra superiore e nav verticale Mirador nascosti (info IIIF ora nella barra dedicata) */
    #mirador-mount-L [class*="windowTopBar"], #mirador-mount-R [class*="windowTopBar"],
    #mirador-mount-L [class*="topBar"],        #mirador-mount-R [class*="topBar"],
    #mirador-mount-L .mirador-window-top-bar,  #mirador-mount-R .mirador-window-top-bar,
    #mirador-mount-L .MuiDrawer-root,          #mirador-mount-R .MuiDrawer-root {
      display: none !important;
    }
    /* mirador-window-top-bar visibile: contiene il pulsante ≡ per il pannello info */
    /* Rimuove la linea blu superiore (border-top del Window di Mirador) */
    #mirador-mount-L > div,
    #mirador-mount-R > div,
    #mirador-mount-L [class*="Window"],
    #mirador-mount-R [class*="Window"],
    #mirador-mount-L [class*="window"],
    #mirador-mount-R [class*="window"] {
      border-top: none !important;
      outline: none !important;
      box-shadow: none !important;
    }
    #mirador-mount-L button, #mirador-mount-R button { color: var(--muted) !important; }
    #mirador-mount-L button:hover, #mirador-mount-R button:hover { color: var(--accent) !important; }
    /* Fix 1: sfondo grigio — viene da mirador-workspace-viewport */
    #mirador-mount-L .mirador-workspace-viewport,
    #mirador-mount-R .mirador-workspace-viewport { background: white !important; }
    /* Fix 2: altezza canvas — mirador10 ha height:300px hardcoded da JSS */
    #mirador-mount-L .mirador10,
    #mirador-mount-R .mirador10 { height: 100% !important; }
    /* Fix 3: canvas-nav posizionamento e stacked info */
    #mirador-mount-L .mirador-osd-container, #mirador-mount-R .mirador-osd-container { position: relative !important; }
    #mirador-mount-L .mirador-canvas-nav, #mirador-mount-R .mirador-canvas-nav {
      position: absolute !important; bottom: 8px !important; top: auto !important;
      left: 50% !important; transform: translateX(-50%) !important;
      height: auto !important; width: auto !important;
      background: transparent !important; box-shadow: none !important;
      display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important;
      align-items: center !important;
    }
    /* Pulsanti zoom e navigazione: dimensione ridotta per stare su una riga */
    #mirador-mount-L .mirador-canvas-nav button,
    #mirador-mount-R .mirador-canvas-nav button {
      padding: 4px !important; width: 32px !important; height: 32px !important;
    }
    #mirador-mount-L .mirador-canvas-nav .MuiSvgIcon-root,
    #mirador-mount-R .mirador-canvas-nav .MuiSvgIcon-root {
      font-size: 18px !important; width: 18px !important; height: 18px !important;
    }
    #mirador-mount-L .mirador-canvas-nav-stacked .mirador-osd-info,
    #mirador-mount-R .mirador-canvas-nav-stacked .mirador-osd-info,
    #mirador-mount-L .mirador-canvas-count,
    #mirador-mount-R .mirador-canvas-count,
    #mirador-mount-L .mirador-canvas-label,
    #mirador-mount-R .mirador-canvas-label { display: none !important; }
    /* Fix 4: mirador-osd-navigation (prev/next) — Mirador lo imposta
       position:absolute; bottom:0; width:100% via classe JSS dinamica.
       Con il nostro position:absolute sul padre (.mirador-canvas-nav)
       questo lo fa collassare sopra i pulsanti zoom dopo certe interazioni
       (drag, zoom, canvas-switch). Lo riportiamo nel flusso flex del padre. */
    #mirador-mount-L .mirador-canvas-nav .mirador-osd-navigation,
    #mirador-mount-R .mirador-canvas-nav .mirador-osd-navigation {
      position: static !important;
      width: auto !important;
      background: transparent !important;
    }
  /* ── Media queries responsive ─────────────────────────────────────
     Scala il font-size radice per adattare proporzionalmente tutto
     il layout ai diversi formati di schermo.
     Copia diretta dal viewer diplomatico v8.4.
  ─────────────────────────────────────────────────────────────── */
  @media (max-width: 1600px) { html { font-size: 15px; } }
  @media (max-width: 1400px) { html { font-size: 14px; } }

    .layout-dual #col-right { display: none !important; }
    .layout-dual #col-left  { width: 100% !important; border-right: none !important; }
  }
  </style>
</head>

<body>
  <!-- ═══════════════════════════════════ HEADER ═══════════════════════════════════ -->
  <header>
    <div class="header-inner">
      <div id="header-meta" style="display: flex; gap: 16px; align-items: baseline">

      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <a id="home-link" href="../index.html"
           style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .15s"
           onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">
          <span class="material-symbols-outlined" style="font-size:14px;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20">arrow_back</span>Home
        </a>
        <span id="loading-status" class="header-status"></span>

  <!-- ═══════════════════════════════════ BODY ═══════════════════════════════════ -->
  <div style="display: flex; height: calc(100vh - 53px); overflow: hidden" id="main-body" class="layout-single">

      <div class="sidebar-content">
        <div class="sidebar-header">
          <span class="sidebar-header-label">Edizione Digitale</span>
          <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Comprimi menu" aria-label="Comprimi menu">
            <span class="material-symbols-outlined">left_panel_close</span>
          </button>
        </div>
        <nav id="sidebar-nav" style="flex: 1; padding: 4px 0; overflow-y: auto; overflow-x: hidden;"></nav>

      </div>
    </aside>
    <button class="sidebar-tab" id="sidebar-tab" title="Mostra/nascondi menu">&#8249;</button>

    <!-- MAIN -->
    <main style="flex: 1; display: flex; overflow: hidden">
      <!-- COL LEFT -->
      <section class="col" id="col-left" style="flex: 1; border-right: 1px solid var(--border)">
        <div class="tab-bar hidden" id="tabs-L"></div>
        <div class="scroll-pane" id="scroll-L">
          <!-- front-matter views: create dinamicamente da buildFrontMatter() -->
          <div id="view-witnesses" class="prose hidden"></div>
          <div id="view-bibliography" class="prose hidden"></div>
          <!-- edition panes -->
          <div id="panes-L" class="hidden" style="height: 100%; display: flex; flex-direction: column">
            <div id="app-filters-L" class="hidden"></div>
            <div style="flex: 1; overflow-y: auto" class="scroll-pane" id="inner-scroll-L">
              <div id="out-testo-L" class="tei-content hidden"></div>
              <div id="out-facsimile-L" class="hidden" style="height: 100%"></div>
              <div id="out-traduzione-L" class="tei-content tei-translation hidden"></div>
              <div id="out-apparato-L" class="hidden"></div>
              <div id="out-commento-L" class="hidden"></div>
            </div>
          </div>
        </div>

      <!-- RESIZER -->
      <div id="col-resizer" title="Trascina per ridimensionare i pannelli"></div>

      <!-- COL RIGHT -->
      <section class="col" id="col-right" style="flex: 1; display: none; min-width: 15%; border-left: 1px solid var(--border)">
        <div class="tab-bar" id="tabs-R"></div>
        <div class="scroll-pane" id="scroll-R" style="flex: 1; display: flex; flex-direction: column">
          <div id="app-filters-R" class="hidden"></div>
          <div style="flex: 1; overflow-y: auto" class="scroll-pane" id="inner-scroll-R">
            <div id="out-testo-R" class="tei-content hidden"></div>
            <div id="out-facsimile-R" class="hidden" style="height: 100%"></div>
            <div id="out-traduzione-R" class="tei-content tei-translation hidden"></div>
            <div id="out-apparato-R" class="hidden"></div>
            <div id="out-commento-R" class="hidden"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ═══════════════════════════════════ SCRIPT ═══════════════════════════════════ -->
  <script>
    /* ──────────────────────────────────────────────────────────────
 CONFIGURAZIONE
────────────────────────────────────────────────────────────── */
    const TEI_FILE = "389,14.xml"; // ← modifica qui con il nome del file XML
    const NS = "http://www.tei-c.org/ns/1.0";

    let xml = null;

    // State
    // Stato Mirador per colonna
    const MIRADOR_EL = { L: "mirador-mount-L", R: "mirador-mount-R" };
    const miradorState = {
      L: { initialized: false, pages: [], pageIdx: 0, viewer: null, canvases: [], storeSubscribed: false, blobUrl: null },
      R: { initialized: false, pages: [], pageIdx: 0, viewer: null, canvases: [], storeSubscribed: false, blobUrl: null },
    };
    // Indice superfici TEI: witId -> { manifestUrl, zones:[{n}] }
    let surfaceByWit = {};

    // Which pane is active per column
    const activePaneId = { L: "testo", R: "apparato" };

    // Active witness filter sets per column
    const witnessFilter = { L: new Set(), R: new Set() };
    // Variant type filter
    const variantFilter = {
      L: new Set(["substantive", "orthographic"]),
      R: new Set(["substantive", "orthographic"]),
    };

    // Note counter map: segId -> noteIndex
    let noteIndexMap = {};
    let appEntryData = []; // [{id, lineN, lemText, isConj, rdgs:[{wit,text,type}]}]
    let commentData = []; // [{target, text}]
    let witnesses = []; // [{id, text}]
    let allWitIds = [];
    let activeWitIds = []; // solo i testimoni con almeno un <rdg> nell'edizione

    // Available pane ids (discovered from XML)
    let availablePanes = [];

    /* ── Barra info IIIF ── */
    function toggleFacInfoBar(col) {
      document.getElementById("fac-info-bar-" + col)?.classList.toggle("open");
    }

    function populateFacInfoBar(col, manifest, manifestUrl) {
      const el = document.getElementById("fac-info-inner-" + col);
      if (!el) return;
      function getLabel(v) {
        if (!v) return "";
        if (typeof v === "string") return v;
        if (Array.isArray(v)) return v[0] || "";
        if (typeof v === "object") {
          const vals = Object.values(v)[0];
          return Array.isArray(vals) ? vals[0] : (vals || "");
        }
        return "";
      }
      function getMeta(key) {
        const meta = manifest.metadata || [];
        for (const m of meta) {
          const lbl = getLabel(m.label).toLowerCase();
          if (lbl.includes(key.toLowerCase())) return getLabel(m.value);
        }
        return "";
      }
      const title  = getLabel(manifest.label) || getLabel(manifest.title) || "";
      const repo   = getMeta("repository") || getMeta("biblioth") || getMeta("institution") || "";
      const date   = getMeta("date") || getMeta("data") || "";
      const shelf  = getMeta("shelfmark") || getMeta("segnatura") || getMeta("cote") || "";
      const source = getMeta("source images") || getMeta("source image") || getMeta("images source") || "";
      function asLink(val) {
        if (!val) return val;
        return /^https?:\/\//i.test(val)
          ? `<a href="${val}" target="_blank" rel="noopener">${val} ↗</a>`
          : val;
      }
      const rows  = [
        repo   && ["Istituzione",    repo],
        shelf  && ["Segnatura",      shelf],
        date   && ["Data",           date],
        source && ["Fonte immagini", asLink(source)],
        ["Manifest", `<a href="${manifestUrl}" target="_blank" rel="noopener">IIIF manifest ↗</a>`],
      ].filter(Boolean);
      el.innerHTML = rows.map(([lbl, val]) =>
        `<div class="fac-info-row">
           <span class="fac-info-label">${lbl}</span>
           <span class="fac-info-value">${val}</span>
         </div>`
      ).join("");
    }

    /* ── Toggle sidebar (linguetta) ── */
    /* ──────────────────────────────────────────────────────────────
 BOOT
────────────────────────────────────────────────────────────── */
    document.addEventListener("DOMContentLoaded", async () => {
      // ── Toggle sidebar (linguetta) ──
      document.getElementById("sidebar-tab")?.addEventListener("click", () => {
        if (window.innerWidth > 1440) return;
        const sidebar = document.getElementById("main-sidebar");
        const tab     = document.getElementById("sidebar-tab");
        sidebar.classList.toggle("collapsed");
        tab.innerHTML = sidebar.classList.contains("collapsed") ? "&#8250;" : "&#8249;";
      });

      const status = document.getElementById("loading-status");
      status.textContent = "Caricamento…";
      try {
        const r = await fetch(TEI_FILE);
        if (!r.ok) throw new Error(r.status);
        xml = new DOMParser().parseFromString(
          await r.text(),
          "application/xml",
        );
        buildAll();
        status.textContent = "Laboratorio di Filologia romanza digitale";
      } catch (e) {
        status.textContent = "Errore XML";
        console.error(e);
      }
    });

    /* ──────────────────────────────────────────────────────────────
   NOTE FRONT (popover)
────────────────────────────────────────────────────────────── */
    function renderFrontNoteContent(noteNode) {
      let h = "";
      noteNode.childNodes.forEach(c => {
        if (c.nodeType === 3) {
          h += smartQuotes(c.textContent);
        } else if (c.nodeType === 1) {
          if (c.localName === "em") {
            h += `<em>${smartQuotes(c.textContent)}</em>`;
          } else if (c.localName === "hi") {
            const r = c.getAttribute('rend') || '';
            const t = smartQuotes(c.textContent);
            h += r === 'bold' ? `<strong>${t}</strong>` : `<em>${t}</em>`;
          } else if (c.localName === "strong") {
            h += `<strong>${smartQuotes(c.textContent)}</strong>`;
          } else if (c.localName === "ref") {
            h += `<a href="${c.getAttribute('target')||'#'}" style="color:var(--accent2)">${smartQuotes(c.textContent)}</a>`;
          } else if (c.localName === "p") {
            h += `<p style="margin:0 0 0.5rem">${renderFrontNoteContent(c)}</p>`;
          } else {
            h += smartQuotes(c.textContent);
          }
        }
      });
      return h;
    }

    function buildFrontNotes(frontSections) {
      const frontEl = xml.getElementsByTagNameNS(NS, "front")[0];
      if (!frontEl) return;
      let globalNoteIdx = 0;
      frontSections.forEach(sec => {
        const viewEl = document.getElementById("view-front-" + sec.type);
        if (!viewEl) return;
        const divEl = Array.from(xml.getElementsByTagNameNS(NS,"div"))
          .find(d => d.getAttribute("type") === sec.type);
        if (!divEl) return;
        if (!divEl.getElementsByTagNameNS(NS,"note").length) return;
        const headText = divEl.getElementsByTagNameNS(NS,"head")[0]?.textContent?.trim() || sec.headText || "";
        let h = "";
        Array.from(divEl.childNodes).forEach(c => {
          if (c.localName === "head") return;
          if (c.localName === "p") {
            let ph = "";
            c.childNodes.forEach(node => {
              if (node.nodeType === 3) {
                ph += smartQuotes(node.textContent);
              } else if (node.nodeType === 1) {
                if (node.localName === "note") {
                  globalNoteIdx++;
                  const noteHtml = renderFrontNoteContent(node);
                  ph += `<sup class="fn-marker" data-fn-html="${encodeURIComponent(noteHtml)}" data-fn-n="${globalNoteIdx}" tabindex="0">${globalNoteIdx}</sup>`;
                } else if (node.localName === "hi") {
                  const r = node.getAttribute('rend') || '';
                  const t = smartQuotes(node.textContent);
                  ph += r === 'bold' ? `<strong>${t}</strong>` : `<em>${t}</em>`;
                } else if (node.localName === "em") {
                  ph += `<em>${smartQuotes(node.textContent)}</em>`;
                } else {
                  ph += smartQuotes(node.textContent);
                }
              }
            });
            h += `<p>${ph}</p>`;
          } else if (c.nodeType === 3 && c.textContent.trim()) {
            h += `<p>${smartQuotes(c.textContent)}</p>`;
          }
        });
        viewEl.innerHTML = `<h1>${headText}</h1>${h}`;
      });
    }

    function initFrontNotePopover() {
      const popover = document.getElementById("fn-popover");
      const body    = document.getElementById("fn-popover-body");
      const head    = document.getElementById("fn-popover-head");
      const close   = document.getElementById("fn-popover-close");
      if (!popover) return;
      let activeMarker = null;

      function showPopover(marker) {
        const html = decodeURIComponent(marker.dataset.fnHtml || "");
        const n    = marker.dataset.fnN || "";
        body.innerHTML = html;
        head.textContent = `Nota ${n}`;
        popover.classList.add("visible");
        activeMarker = marker;
        positionPopover(marker);
      }

      function hidePopover() {
        popover.classList.remove("visible");
        activeMarker = null;
      }

      function positionPopover(marker) {
        const rect = marker.getBoundingClientRect();
        const pw   = popover.offsetWidth  || 340;
        const ph   = popover.offsetHeight || 120;
        const vw   = window.innerWidth;
        const vh   = window.innerHeight;
        const gap  = 8;
        let left = rect.left;
        if (left + pw > vw - 8) left = vw - pw - 8;
        if (left < 8) left = 8;
        let top;
        if (rect.bottom + gap + ph < vh) {
          top = rect.bottom + gap;
        } else {
          top = rect.top - gap - ph;
        }
        popover.style.left = left + "px";
        popover.style.top  = Math.max(8, top) + "px";
      }

      document.body.addEventListener("click", e => {
        const marker = e.target.closest(".fn-marker");
        if (marker) {
          e.stopPropagation();
          if (activeMarker === marker) { hidePopover(); return; }
          showPopover(marker);
          return;
        }
        if (!e.target.closest("#fn-popover")) hidePopover();
      });

      close.addEventListener("click", e => { e.stopPropagation(); hidePopover(); });
      window.addEventListener("resize", () => { if (activeMarker) positionPopover(activeMarker); });
    }

    /* ──────────────────────────────────────────────────────────────
 BUILD ALL
────────────────────────────────────────────────────────────── */
    function buildAll() {
      buildHeader();
      buildWitnesses();
      buildFrontMatter();
      buildFrontNotes(frontSections);
      initFrontNotePopover();
      buildEditionData();
      buildSidebar();
      buildFacsimile();

      // Apre sulla prima sezione front-matter disponibile nell'XML,
      // con fallback a "witnesses" se il front-matter è assente.
      const defaultView =
        frontSections.length > 0 ? frontSections[0].id : "witnesses";
      selectView(defaultView);
    }

    /* ──────────────────────────────────────────────────────────────
 HEADER
────────────────────────────────────────────────────────────── */
    function buildHeader() {
      const author =
        xml.getElementsByTagNameNS(NS, "author")[0]?.textContent?.trim() ||
        "";
      const title =
        xml.getElementsByTagNameNS(NS, "title")[0]?.textContent?.trim() || "";
      const resp =
        xml.getElementsByTagNameNS(NS, "name")[0]?.textContent?.trim() || "";
      document.getElementById("header-meta").innerHTML = `
    <span class="header-author">${author}</span>
    <span class="header-title">${title}</span>`;
      if (resp)
        document.getElementById("resp-info").textContent =
          `Ed. digitale a cura di ${resp}`;
    }

    /* ──────────────────────────────────────────────────────────────
 WITNESSES
────────────────────────────────────────────────────────────── */
    function buildWitnesses() {
      witnesses = Array.from(xml.getElementsByTagNameNS(NS, "witness")).map(
        (w) => ({
          id:      w.getAttribute("xml:id"),
          text:    w.textContent.trim(),        // plain (per <option>, attributi)
          textHtml: renderWitText(w),           // con <sup> (per display HTML)
        }),
      );
      allWitIds = witnesses.map((w) => w.id);
      // Inizializzazione provvisoria: verrà sovrascritta da buildEditionData()
      // con i soli testimoni che hanno effettivamente dei <rdg>.
      ["L", "R"].forEach((c) => {
        witnessFilter[c] = new Set(allWitIds);
      });

      // Render witness list view
      let h = '<h1>Testimoni</h1><div style="margin-top:2rem">';
      witnesses.forEach((w) => {
        h += `<div class="wit-entry"><span class="wit-id">${witLabel(w.id)}</span><span class="wit-name">${w.textHtml}</span></div>`;
      });
      h += "</div>";
      document.getElementById("view-witnesses").innerHTML = h;
    }

    /* ──────────────────────────────────────────────────────────────
 FRONT MATTER
────────────────────────────────────────────────────────────── */
    // Mappa dei tipi di <div> front-matter noti → metadati sidebar.
    // I tipi non in questa mappa ma presenti nell'XML vengono comunque
    // rilevati e visualizzati con icona e etichetta generiche (fallback).
    const KNOWN_FRONT_TYPES = {
      introduction: { icon: "info", label: "Introduzione" },
      preface: { icon: "info", label: "Prefazione" },
      foreword: { icon: "info", label: "Premessa" },
      editorialNote: { icon: "manage_search", label: "Nota al testo" },
      criteria: { icon: "book", label: "Criteri editoriali" },
      commentary: { icon: "comment", label: "Commento" },
      abstract: { icon: "summarize", label: "Abstract" },
      dedication: { icon: "favorite", label: "Dedica" },
      acknowledgements: { icon: "handshake", label: "Ringraziamenti" },
    };

    // Costruita dinamicamente in buildFrontMatter(); ogni voce:
    // { type, id, icon, label, headText }
    let frontSections = [];

    function buildFrontMatter() {
      frontSections = [];
      const frontEl = xml.getElementsByTagNameNS(NS, "front")[0];
      const divs = frontEl
        ? Array.from(frontEl.childNodes).filter(
          (n) => n.nodeType === 1 && n.localName === "div",
        )
        : Array.from(xml.getElementsByTagNameNS(NS, "div")).filter((d) => {
          const t = d.getAttribute("type");
          return t && t in KNOWN_FRONT_TYPES;
        });

      divs.forEach((d) => {
        const type = d.getAttribute("type");
        if (!type || type === "edition" || type === "translation") return;
        const known = KNOWN_FRONT_TYPES[type];
        const headText =
          d.getElementsByTagNameNS(NS, "head")[0]?.textContent?.trim() ||
          known?.label ||
          type;
        const section = {
          type,
          id: "front-" + type,
          icon: known?.icon || "article",
          label: known?.label || headText,
          headText,
        };
        frontSections.push(section);

        // Creare il div di vista nel DOM se non esiste ancora
        let el = document.getElementById("view-front-" + type);
        if (!el) {
          el = document.createElement("div");
          el.id = "view-front-" + type;
          el.className = "prose hidden";
          document.getElementById("scroll-L").appendChild(el);
        }
        el.innerHTML = "<h1>" + headText + "</h1>" + formatTEIDiv(d);
      });

      // Bibliography
      const listBibl = xml.getElementsByTagNameNS(NS, "listBibl")[0];
      const biblEl = document.getElementById("view-bibliography");
      if (listBibl) {
        let h = '<h1>Bibliografia</h1><div style="margin-top:1.5rem">';
        Array.from(listBibl.getElementsByTagNameNS(NS, "bibl")).forEach(
          (b) => {
            const biblHtml = b.innerHTML.replace(/<hi\s+rend="italic">(.*?)<\/hi>/g, '<em>$1</em>');
h += `<p style="font-family:'Source Serif 4',serif;font-size:1rem;line-height:1.8;margin-bottom:0.6rem;padding-left:2rem;text-indent:-2rem">${smartQuotesHtml(biblHtml)}</p>`;
          },
        );
        h += "</div>";
        biblEl.innerHTML = h;
      } else {
        biblEl.innerHTML =
          '<h1>Bibliografia</h1><p style="color:#aaa;font-style:italic">Nessun dato bibliografico nell\'XML.</p>';
      }
    }

    function formatTEIDiv(node) {
      let h = "";
      node.childNodes.forEach((c) => {
        if (c.localName === "p") h += `<p>${smartQuotesHtml(c.innerHTML)}</p>`;
        if (c.localName === "head") return;
        if (c.nodeType === 3 && c.textContent.trim())
          h += `<p>${smartQuotes(c.textContent)}</p>`;
      });
      return h;
    }

    /* ──────────────────────────────────────────────────────────────
 SIDEBAR
────────────────────────────────────────────────────────────── */
    // Le voci statiche della sidebar (non front-matter).
    // Le voci del front-matter vengono inserite dinamicamente da buildSidebar()
    // in base a frontSections, prima del separatore.
    const SIDEBAR_STATIC_BOTTOM = [
      {
        id: "witnesses",
        icon: "local_library",
        label: "Testimoni",
        always: true,
      },
      { separator: true },
      {
        id: "edition",
        icon: "auto_stories",
        label: "Edizione",
        always: true,
      },
      { separator: true },
      {
        id: "bibliography",
        icon: "article",
        label: "Bibliografia",
        key: "listBibl",
      },
    ];

    function buildSidebar() {
      const nav = document.getElementById("sidebar-nav");
      let h = "";

      // Voci front-matter dinamiche
      frontSections.forEach((sec) => {
        h += `<button class="nav-btn" id="nav-${sec.id}" onclick="selectView('${sec.id}')" title="${sec.label}">
      <span class="material-symbols-outlined">${sec.icon}</span><span class="nav-label">${sec.label}</span>
    </button>`;
      });

      // Voci statiche finali
      SIDEBAR_STATIC_BOTTOM.forEach((item) => {
        if (item.separator) {
          h += '<div class="sep"></div>';
          return;
        }
        if (!item.always && item.key) {
          const found =
            xml.getElementsByTagNameNS(NS, item.key)?.length > 0;
          if (!found) return;
        }
        h += `<button class="nav-btn" id="nav-${item.id}" onclick="selectView('${item.id}')" title="${item.label}">
      <span class="material-symbols-outlined">${item.icon}</span><span class="nav-label">${item.label}</span>
    </button>`;
      });

      nav.innerHTML = h;

      // Toggle sidebar
      const toggleBtn = document.getElementById("sidebar-toggle");
      const sidebar   = document.getElementById("main-sidebar");
      toggleBtn.addEventListener("click", function () {
        const collapsed = sidebar.classList.toggle("collapsed");
        toggleBtn.querySelector(".material-symbols-outlined").textContent =
          collapsed ? "right_panel_close" : "left_panel_close";
        toggleBtn.title = collapsed ? "Espandi menu" : "Comprimi menu";
      });
    }

    /* ──────────────────────────────────────────────────────────────
 VIEW SWITCHING
────────────────────────────────────────────────────────────── */
    function selectView(viewId) {
      // Update sidebar
      document
        .querySelectorAll(".nav-btn")
        .forEach((b) => b.classList.remove("active"));
      const nb = document.getElementById("nav-" + viewId);
      if (nb) nb.classList.add("active");

      // Auto-collasso sidebar in modalità edizione
      const sidebar   = document.getElementById("main-sidebar");
      const toggleBtn = document.getElementById("sidebar-toggle");
      if (viewId === "edition") {
        sidebar.classList.add("collapsed");
        if (toggleBtn) {
          toggleBtn.querySelector(".material-symbols-outlined").textContent = "right_panel_close";
          toggleBtn.title = "Espandi menu";
        }
      } else {
        sidebar.classList.remove("collapsed");
        if (toggleBtn) {
          toggleBtn.querySelector(".material-symbols-outlined").textContent = "left_panel_close";
          toggleBtn.title = "Comprimi menu";
        }
      }

      const body = document.getElementById("main-body");
      const scroll = document.getElementById("scroll-L");

      if (viewId === "edition") {
        body.classList.replace("layout-single", "layout-dual");
        // Show tab bars
        document.getElementById("tabs-L").classList.remove("hidden");
        document.getElementById("tabs-R").classList.remove("hidden");
        // Hide front-matter
        hideFrontMatter();
        // Show edition panes container
        document.getElementById("panes-L").classList.remove("hidden");
        scroll.style.overflow = "hidden";
        scroll.style.height = "100%";
        // Default panes
        switchPane("L", activePaneId.L);
        switchPane("R", activePaneId.R);
      } else {
        body.classList.replace("layout-dual", "layout-single");
        document.getElementById("tabs-L").classList.add("hidden");
        document.getElementById("panes-L").classList.add("hidden");
        scroll.style.overflow = "";
        scroll.style.height = "";
        hideFrontMatter();
        // Esce dalla modalità edizione: rilascia eventuale lock attivo.
        // Il lock ha senso solo in layout-dual; restando attivo in front-matter
        // creerebbe confusione al rientro in edizione.
        if (lockedCol !== null) {
          lockedCol = null;
          applyLockUI();
        }
        const v = document.getElementById("view-" + viewId);
        if (v) v.classList.remove("hidden");
      }
    }

    function hideFrontMatter() {
      // Nasconde tutte le viste front-matter dinamiche
      frontSections.forEach((sec) => {
        document.getElementById("view-" + sec.id)?.classList.add("hidden");
      });
      // Nasconde le viste statiche
      ["witnesses", "bibliography"].forEach((id) => {
        document.getElementById("view-" + id)?.classList.add("hidden");
      });
    }

    /* ──────────────────────────────────────────────────────────────
 EDITION DATA
────────────────────────────────────────────────────────────── */
    function buildEditionData() {
      try {
      const edition = Array.from(xml.getElementsByTagNameNS(NS, "div")).find(
        (d) => d.getAttribute("type") === "edition",
      );
      if (!edition) {
        console.warn('buildEditionData: nessun <div type="edition"> trovato nel TEI');
        return;
      }

      // Discover panes
      availablePanes = ["testo"];
      if (xml.getElementsByTagNameNS(NS, "surface").length > 0)
        availablePanes.push("facsimile");
      if (
        Array.from(xml.getElementsByTagNameNS(NS, "div")).some(
          (d) => d.getAttribute("type") === "translation",
        )
      )
        availablePanes.push("traduzione");
      if (edition.getElementsByTagNameNS(NS, "app").length > 0)
        availablePanes.push("apparato");
      if (
        edition.getElementsByTagNameNS(NS, "note").length > 0 ||
        edition.getElementsByTagNameNS(NS, "seg").length > 0
      )
        availablePanes.push("commento");

      // Build tabs
      buildTabs();

      commentData = Array.from(
        edition.getElementsByTagNameNS(NS, "note"),
      ).map((n) => ({
        target: n.getAttribute("target")?.replace("#", "") || "",
        text: noteToHtml(n),
      }));

      // Assign note indices in document order.
      // Walk the edition in DOM order: for each <seg> and for each <app> that has
      // a matching <note>, assign a progressive index.
      let noteIdx = 1;
      noteIndexMap = {};
      const noteTargets = new Set(commentData.map((nd) => nd.target));

      walkForNoteAnchors(edition, noteTargets);

      // Parse app entries
      appEntryData = Array.from(
        edition.getElementsByTagNameNS(NS, "app"),
      ).map((app) => {
        const id = app.getAttribute("xml:id");
        const lemEl = app.getElementsByTagNameNS(NS, "lem")[0];
        const isConj = lemEl?.getAttribute("type") === "conjecture";
        const lemText = smartQuotes(lemTextFlat(lemEl));
        // Find parent line n
        let parent = app.parentNode;
        while (parent && parent.localName !== "l") parent = parent.parentNode;
        const lineN = parent?.getAttribute("n") || "";

        // Solo i <rdg> figli diretti — esclude quelli degli <app> annidati nel <lem>
        const rdgs = Array.from(app.childNodes)
          .filter(n => n.nodeType === 1 && n.localName === 'rdg')
          .map((r) => ({
            wit: r.getAttribute("wit") || "",
            text: smartQuotes(r.textContent.trim()),
            type: r.getAttribute("type") || "substantive",
          }));
        return { id, lineN, lemText, isConj, rdgs };
      });

      // Calcola i testimoni che compaiono effettivamente in almeno un <rdg>
      const activeWitSet = new Set();
      appEntryData.forEach((entry) => {
        entry.rdgs.forEach((r) => {
          r.wit.trim().split(/\s+/).forEach((w) => {
            const id = w.replace("#", "");
            if (id) activeWitSet.add(id);
          });
        });
      });
      // Mantieni l'ordine originale di allWitIds, filtrando a quelli attivi
      activeWitIds = allWitIds.filter((id) => activeWitSet.has(id));
      // Inizializza i filtri solo sui testimoni attivi
      ["L", "R"].forEach((c) => {
        witnessFilter[c] = new Set(activeWitIds);
      });

      // Render text — Fase 4D: nuovo stack Parser + Renderer
      // sostituisce il vecchio loop con walkLine
      const critLgs  = parseCritEdition(edition);
      const textHtml = renderCritEdition(critLgs);

      ["L", "R"].forEach((c) => {
        document.getElementById(`out-testo-${c}`).innerHTML = textHtml;
      });

      // Render apparatus (will be re-rendered on filter change)
      renderApparatus("L");
      renderApparatus("R");

      // Render commento
      renderCommento("L");
      renderCommento("R");

      // Render traduzione
      buildTranslation();

      // Build filter bars
      buildFilterBars();

      // Bind text interactions
      bindTextEvents();
      } catch(e) {
        console.error('buildEditionData: errore inatteso:', e);
        document.getElementById('out-testo-L').innerHTML =
          '<div style="padding:2rem;color:var(--accent);font-size:0.9rem">' +
          '<strong>Errore nel caricamento dell’edizione.</strong><br>' +
          'Verificare la struttura del file XML e la console per i dettagli.</div>';
      }
    }


    /* ═══════════════════════════════════════════════════════════════
       TIPI CRIT — Costruttori e validazione (Fase 4A)
       Ogni funzione crea un oggetto CritNode puro (no HTML, no DOM).
       Il Parser (Fase 4B) li produce; il Renderer (Fase 4C) li consuma.
       Tipi: text, app, seg, hi.
    ═══════════════════════════════════════════════════════════════ */

    /* ── Helper di validazione (privato) ── */
    function _critReq(val, name, expected) {
      const ok = expected === 'array' ? Array.isArray(val) : typeof val === expected;
      if (!ok) throw new Error(
        `CritNode: '${name}' deve essere ${expected}, ricevuto ${Array.isArray(val) ? 'array' : typeof val}`
      );
    }
    function _critOpt(val, name, expected) {
      if (val !== undefined) _critReq(val, name, expected);
    }

    /* Nodo testo puro. */
    function createCritText(value) {
      _critReq(value, 'value', 'string');
      return { kind: 'text', value };
    }

    /*
     * Luogo critico (<app>).
     * @param {string}  id      - xml:id dell'<app>
     * @param {string}  lemText - testo del <lem>
     * @param {boolean} isConj  - true se lem type="conjecture"
     * @param {number|string} noteIdx - indice nota ('' se assente)
     */
    function createCritApp(id, lemText, isConj, noteIdx) {
      _critReq(id,      'id',      'string');
      _critReq(lemText, 'lemText', 'string');
      _critReq(isConj,  'isConj',  'boolean');
      return { kind: 'app', id, lemText, isConj, noteIdx: noteIdx || '' };
    }

    /*
     * Ancora di nota nel testo (<seg>).
     * @param {string}  id      - xml:id del <seg>
     * @param {string}  text    - contenuto testuale
     * @param {number|string} noteIdx - indice nota
     */
    function createCritSeg(id, text, noteIdx) {
      _critReq(id,   'id',   'string');
      _critReq(text, 'text', 'string');
      return { kind: 'seg', id, text, noteIdx: noteIdx || '' };
    }

    /*
     * Formattazione (<hi>).
     * @param {string} rend  - 'italic' | 'bold'
     * @param {string} text  - contenuto testuale
     */
    function createCritHi(rend, text) {
      if (rend !== 'italic' && rend !== 'bold' && rend !== '')
        throw new Error(`CritNode: 'rend' deve essere 'italic', 'bold' o '', ricevuto '${rend}'`);
      _critReq(text, 'text', 'string');
      return { kind: 'hi', rend, text };
    }

    /*
     * Verso completo.
     * @param {string}     n       - numero verso
     * @param {CritNode[]} content - nodi del verso
     */
    function createCritVerse(n, content) {
      _critReq(n,       'n',       'string');
      _critReq(content, 'content', 'array');
      return { kind: 'verse', n, content };
    }

    /*
     * Blocco versale (<lg>).
     * @param {string}       lgN    - attributo n (può essere '')
     * @param {CritVerse[]}  verses - array di versi
     */
    function createCritLg(lgN, verses) {
      _critReq(lgN,    'lgN',    'string');
      _critReq(verses, 'verses', 'array');
      return { kind: 'lg', n: lgN, verses };
    }

    /* ──────────────────────────────────────────────────────────────
 UTILITY NOTE — estratte da buildEditionData (Fase 1)
────────────────────────────────────────────────────────────── */

    /*
     * Converte un nodo TEI <note> in HTML renderizzabile.
     * Gestisce: testo puro, <hi rend="italic/bold">, <em>, <strong>.
     * @param {Element} noteEl
     * @returns {string}
     */
    function noteToHtml(noteEl) {
      let out = "";
      noteEl.childNodes.forEach(child => {
        if (child.nodeType === 3) {
          out += smartQuotes(child.textContent);
        } else if (child.localName === "hi") {
          const rend = child.getAttribute("rend") || "";
          const t = smartQuotes(child.textContent);
          if (rend === "italic")      out += `<em>${t}</em>`;
          else if (rend === "bold")   out += `<strong>${t}</strong>`;
          else                        out += t;
        } else if (child.localName === "em") {
          out += `<em>${smartQuotes(child.textContent)}</em>`;
        } else if (child.localName === "strong") {
          out += `<strong>${smartQuotes(child.textContent)}</strong>`;
        } else {
          out += smartQuotes(child.textContent);
        }
      });
      return out;
    }

    /*
     * Percorre ricorsivamente il div edizione e assegna indici progressivi
     * a <seg> e <app> che hanno una nota associata.
     * Usa e aggiorna noteIndexMap (globale) e noteIdx (chiusura).
     * @param {Element} node       - nodo da visitare
     * @param {Set}     noteTargets - set di id con nota associata
     */
    function walkForNoteAnchors(node, noteTargets) {
      if (node.nodeType === 1) {
        const localName = node.localName;
        const id = node.getAttribute("xml:id");
        if (
          (localName === "seg" || localName === "app") &&
          id &&
          noteTargets.has(id)
        ) {
          if (!noteIndexMap[id]) {
            noteIndexMap[id] = Object.keys(noteIndexMap).length + 1;
          }
        }
        Array.from(node.childNodes).forEach(n => walkForNoteAnchors(n, noteTargets));
      }
    }


    /* ═══════════════════════════════════════════════════════════════
       PARSER CRIT — Fase 4B
       Funzioni pure: DOM Element → CritNode (nessun HTML, nessuno stato).
       noteIdx NON viene letto qui — è compito del Renderer (Fase 4C)
       leggere noteIndexMap al momento della resa visiva.
    ═══════════════════════════════════════════════════════════════ */

    /* Estrae il testo piatto di un <lem>, escludendo il contenuto degli <app>
       annidati. Usato per il display nell'apparato: evita che un <lem> con
       <app> interno produca stringhe come "siamo a cosa casa" invece di
       "siamo a cosa". Cammina i childNodes ricorsivamente ma salta i <app>
       (e i loro discendenti). */
     /* Whitespace-only text nodes vengono filtrati.
     * @param {NodeList} nodeList
     * @returns {CritNode[]}
     */
    function parseCritNodes(nodeList) {
      return Array.from(nodeList).flatMap(node => {
        if (node.nodeType === 3) {
          const t = node.textContent;
          if (!t || (t.trim() === '' && t.includes('\n'))) return [];
          return [createCritText(t)];
        }
        if (node.nodeType !== 1) return [];
        switch (node.localName) {
          case 'app': return [parseCritApp(node)];
          case 'seg': return [parseCritSeg(node)];
          case 'hi':  return [parseCritHi(node)];
          default:    return node.textContent.trim()
                        ? [createCritText(node.textContent)]
                        : [];
        }
      });
    }

    /*
     * <app xml:id="v1"><lem>dreit</lem>...</app> → CritAppNode
     * noteIdx lasciato '' — il Renderer leggerà noteIndexMap.
     * @param {Element} appEl
     * @returns {CritAppNode}
     */
    function parseCritApp(appEl) {
      const id     = appEl.getAttribute('xml:id') || '';
      const lemEl  = appEl.getElementsByTagNameNS(NS, 'lem')[0];
      const isConj = lemEl?.getAttribute('type') === 'conjecture';
      // lemText: testo piatto usato nell'apparato (display della voce)
      const lemText = lemTextFlat(lemEl);
      // lemContent: struttura ricorsiva usata nel pannello testo.
      // Parsare i childNodes del <lem> (non del <app>) garantisce che un
      // <app> annidato produca il proprio span.tei-app cliccabile.
      const lemContent = lemEl ? parseCritNodes(lemEl.childNodes) : [];
      const node = createCritApp(id, lemText, isConj, '');
      node.lemContent = lemContent;
      return node;
    }

    /*
     * <seg xml:id="s1">testo</seg> → CritSegNode
     * noteIdx lasciato '' — il Renderer leggerà noteIndexMap.
     * @param {Element} segEl
     * @returns {CritSegNode}
     */
    function parseCritSeg(segEl) {
      const id   = segEl.getAttribute('xml:id') || '';
      const text = segEl.textContent || '';
      return createCritSeg(id, text, '');
    }

    /*
     * <hi rend="italic">cors</hi> → CritHiNode
     * rend non riconosciuto → '' (testo nudo nel renderer).
     * @param {Element} hiEl
     * @returns {CritHiNode}
     */
    function parseCritHi(hiEl) {
      const r    = hiEl.getAttribute('rend') || '';
      const rend = (r === 'italic' || r === 'bold') ? r : '';
      return createCritHi(rend, hiEl.textContent || '');
    }

    /*
     * <l n="1">...</l> → CritVerseNode
     * @param {Element} lEl
     * @returns {CritVerseNode}
     */
    function parseCritVerse(lEl) {
      const n       = lEl.getAttribute('n') || '';
      const content = parseCritNodes(lEl.childNodes);
      return createCritVerse(n, content);
    }

    /*
     * <lg n="1">...</lg> → CritLgNode
     * @param {Element} lgEl
     * @returns {CritLgNode}
     */
    function parseCritLg(lgEl) {
      const lgN   = lgEl.getAttribute('n') || '';
      const verses = Array.from(lgEl.getElementsByTagNameNS(NS, 'l'))
        .map(l => parseCritVerse(l));
      return createCritLg(lgN, verses);
    }

    /*
     * Parser principale: <div type="edition"> → CritLg[]
     * @param {Element} editionDiv
     * @returns {CritLgNode[]}
     */
    function parseCritEdition(editionDiv) {
      return Array.from(editionDiv.getElementsByTagNameNS(NS, 'lg'))
        .map(lg => parseCritLg(lg));
    }


    /* ═══════════════════════════════════════════════════════════════
       RENDERER CRIT — Fase 4C
       Funzioni pure: CritNode → stringa HTML.
       Legge noteIndexMap (globale, già popolato da walkForNoteAnchors)
       ma non lo modifica.
    ═══════════════════════════════════════════════════════════════ */

    /*
     * Accumula l'HTML di un array di CritNode.
     * @param {CritNode[]} nodes
     * @returns {string}
     */
    function renderCritNodes(nodes) {
      return nodes.map(renderCritNode).join('');
    }

    /*
     * Dispatcher per kind.
     * @param {CritNode} node
     * @returns {string}
     */
    function renderCritNode(node) {
      switch (node.kind) {
        case 'text': return renderCritText(node);
        case 'app':  return renderCritApp(node);
        case 'seg':  return renderCritSeg(node);
        case 'hi':   return renderCritHi(node);
        default:     return '';
      }
    }

    /* Testo puro con smart quotes. */
    function renderCritText(node) {
      return smartQuotes(node.value);
    }

    /*
     * <app> → span.tei-app con marker nota opzionale.
     * Produce span.tei-app con marker nota opzionale.
     */
    function renderCritApp(node) {
      const ni     = noteIndexMap[node.id] || '';
      const marker = ni
        ? `<sup class="note-marker" data-seg-id="${node.id}">${ni}</sup>`
        : '';
      // Usa lemContent (struttura ricorsiva) se disponibile — gestisce <app> annidati.
      // Fallback su lemText per compatibilità con nodi costruiti senza lemContent.
      const lemHtml = (node.lemContent && node.lemContent.length)
        ? renderCritNodes(node.lemContent)
        : smartQuotes(node.lemText);
      return `<span class="tei-app${node.isConj ? ' conjecture' : ''}" ` +
             `data-app-id="${node.id}">${lemHtml}</span>${marker}`;
    }

    /*
     * <seg> → span.tei-seg con marker nota.
     * Produce span.tei-seg con marker nota.
     */
    function renderCritSeg(node) {
      const ni = noteIndexMap[node.id] || '';
      return `<span class="tei-seg" data-seg-id="${node.id}">${node.text}` +
             `<sup class="note-marker" data-seg-id="${node.id}">${ni}</sup></span>`;
    }

    /*
     * <hi> → em | strong | testo nudo.
     */
    function renderCritHi(node) {
      const t = smartQuotes(node.text);
      if (node.rend === 'italic') return `<em>${t}</em>`;
      if (node.rend === 'bold')   return `<strong>${t}</strong>`;
      return t;
    }

    /*
     * CritVerseNode → <div class="tei-l">
     */
    function renderCritVerse(verse) {
      return `<div class="tei-l"><span class="line-n">${verse.n}</span>` +
             `${renderCritNodes(verse.content)}</div>`;
    }

    /*
     * CritLgNode → <div class="tei-lg">
     */
    function renderCritLg(lg) {
      const lgAttr = lg.n ? ` data-lg="${lg.n}"` : '';
      return `<div class="tei-lg"${lgAttr}>${lg.verses.map(renderCritVerse).join('')}</div>`;
    }

    /*
     * Entry point del renderer: CritLg[] → stringa HTML completa.
     * @param {CritLgNode[]} lgs
     * @returns {string}
     */
    function renderCritEdition(lgs) {
      return lgs.map(renderCritLg).join('');
    }

    /* ──────────────────────────────────────────────────────────────
 SMART QUOTES
────────────────────────────────────────────────────────────── */
    function smartQuotes(str) {
      if (!str) return str;
      return str
        // 1. Virgolette doppie: " che apre (aggiunta la chiusura della tonda dopo [^"])
        .replace(/(^|[\s(\[{>«])"([^"])/g, '$1\u201C$2')
        // 2. Virgolette doppie: " che chiude
        .replace(/"([\s.,;:!?)\]}>»]|$)/g, '\u201D$1')
        // 3. Apostrofo interno a parola (dell', l'uomo, ecc.)
        .replace(/(\w)'(\w)/g, '$1\u2019$2')
        // 4. Apostrofo iniziale elisione ('l → l')
        .replace(/(^|[\s])'(\w)/g, '$1\u2018$2')
        // 5. Apostrofo residuo → chiusura
        .replace(/'/g, '\u2019');
    }

    // Applica smartQuotes solo ai nodi testuali di una stringa HTML,
    // senza toccare tag o attributi.
    function smartQuotesHtml(html) {
      if (!html) return html;
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      const walker = document.createTreeWalker(tmp, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        node.textContent = smartQuotes(node.textContent);
      }
      return tmp.innerHTML;
    }


    /* ──────────────────────────────────────────────────────────────
 TABS
────────────────────────────────────────────────────────────── */
    const paneLabels = {
      testo: "Testo Critico",
      facsimile: "Facsimile",
      traduzione: "Traduzione",
      apparato: "Apparato",
      commento: "Commento",
    };

    function buildTabs() {
      ["L", "R"].forEach((c) => {
        const bar = document.getElementById("tabs-" + c);
        let h = "";
        availablePanes.forEach((p) => {
          h += `<button class="tab" data-pane="${p}" data-col="${c}" onclick="switchPane('${c}','${p}')">${paneLabels[p]}</button>`;
        });
        // Pulsante pin (blocca pannello) — allineato a destra via margin-left:auto
        h += `<button class="pin-btn" data-col="${c}" onclick="toggleLock('${c}')" title="Blocca pannello" aria-label="Blocca pannello">
          <span class="material-symbols-outlined">push_pin</span>
        </button>`;
        bar.innerHTML = h;
      });
      // Riapplica lo stato di lock dopo un rebuild della tab-bar
      applyLockUI();
    }

    /* Aggiorna l'UI in base a lockedCol. Idempotente — può essere chiamata
       ogni volta che la tab-bar viene ricostruita o lockedCol cambia. */
    function applyLockUI() {
      ["L", "R"].forEach((c) => {
        const bar = document.getElementById("tabs-" + c);
        const pin = bar ? bar.querySelector(".pin-btn") : null;
        if (!bar || !pin) return;
        const isLocked = (lockedCol === c);
        bar.classList.toggle("locked", isLocked);
        pin.classList.toggle("locked", isLocked);
        pin.title = isLocked ? "Sblocca pannello" : "Blocca pannello";
      });
    }

    /* Toggle del lock su una colonna. Mutuamente esclusivo:
       bloccare L sblocca automaticamente R (e viceversa). */
    function toggleLock(col) {
      lockedCol = (lockedCol === col) ? null : col;
      applyLockUI();
    }

    function switchPane(col, paneId) {
      activePaneId[col] = paneId;
      // Update tabs
      document.querySelectorAll(`[data-col="${col}"].tab`).forEach((t) => {
        t.classList.toggle("active", t.dataset.pane === paneId);
      });
      // Show/hide panes
      const paneIds = [
        "testo",
        "facsimile",
        "traduzione",
        "apparato",
        "commento",
      ];
      paneIds.forEach((p) => {
        const el = document.getElementById(`out-${p}-${col}`);
        if (el) el.classList.toggle("hidden", p !== paneId);
      });
      // Show/hide filter bar
      const fb = document.getElementById(`app-filters-${col}`);
      if (fb) fb.classList.toggle("hidden", paneId !== "apparato");
      // Facsimile init
      if (paneId === "facsimile") initFacsimileDisplay(col);
      // Allineamento traduzione (con piccolo delay per attendere il rendering)
      setTimeout(alignTranslation, 80);
    }

    /* ──────────────────────────────────────────────────────────────
 APPARATUS
────────────────────────────────────────────────────────────── */
    function renderApparatus(col) {
      const wf = witnessFilter[col];
      const vf = variantFilter[col];
      let h = "";

      appEntryData.forEach((entry) => {
        // Build visible rdgs
        const visRdgs = entry.rdgs.filter((r) => {
          if (!vf.has(r.type)) return false;
          // Filter by witness
          const wits = r.wit
            .trim()
            .split(/\s+/)
            .map((w) => w.replace("#", ""));
          return wits.some((w) => wf.has(w) || w === "");
        });

        // Apparato negativo: skip entries with no rdgs different from lem
        // (rdg empty = om., still shown if witnesses visible)
        if (visRdgs.length === 0) return;

        // Format lem
        const lemDisp = entry.isConj ? `⟨${entry.lemText}⟩` : entry.lemText;
        // Format rdgs
        let rdgParts = [];
        visRdgs.forEach((r) => {
          const wits = r.wit
            .trim()
            .split(/\s+/)
            .map((w) => w.replace("#", ""))
            .filter((w) => wf.has(w));
          if (wits.length === 0) return;
          const witStr = wits.map(witLabel).join(", ");
          if (!r.text) {
            rdgParts.push(
              `<span style="font-style:normal">om.</span> <span class="wit-sig">${witStr}</span>`,
            );
          } else {
            rdgParts.push(
              `<span class="rdg-text">${r.text}</span> <span class="wit-sig">${witStr}</span>`,
            );
          }
        });

        if (rdgParts.length === 0) return;

        h += `<div class="app-entry" data-app-id="${entry.id}">
      <span class="line-ref">${entry.lineN}</span>
      <span class="lem-text">${lemDisp}</span>]
      ${rdgParts.join("; ")}
    </div>`;
      });

      if (!h)
        h =
          '<div style="padding:20px;color:#aaa;font-size:13px;font-style:italic">Nessuna variante da mostrare.</div>';
      document.getElementById(`out-apparato-${col}`).innerHTML = h;
      // Rebind
      document
        .querySelectorAll(`#out-apparato-${col} .app-entry`)
        .forEach((el) => {
          el.addEventListener("click", () => {
            // Clicked from apparatus: scroll the lem in the OTHER col
            const appId = el.dataset.appId;
            document
              .querySelectorAll(".tei-app.hl, .app-entry.hl")
              .forEach((e) => e.classList.remove("hl"));
            document
              .querySelectorAll(`.tei-app[data-app-id="${appId}"]`)
              .forEach((e) => e.classList.add("hl"));
            el.classList.add("hl");
            const tgtCol = targetCol(col);
            const span = document.querySelector(
              `#out-testo-${tgtCol} .tei-app[data-app-id="${appId}"]`,
            );
            if (span) {
              if (span) {
                ensurePaneVisible(tgtCol, "testo");
                setTimeout(
                  () =>
                    span.scrollIntoView({
                      behavior: "smooth",
                      block: "center",
                    }),
                  120,
                );
              }
            }
          });
        });
    }

    /* ──────────────────────────────────────────────────────────────
 COMMENTO
────────────────────────────────────────────────────────────── */
    function renderCommento(col) {
      let h = "";
      commentData.forEach((nd) => {
        const ni = noteIndexMap[nd.target] || "";
        h += `<div class="note-entry" id="note-${col}-${nd.target}" data-note-target="${nd.target}">
      <div class="note-marker-label"><sup>${ni}</sup> Nota di commento</div>
      <div style="font-family:'Source Serif 4',serif;font-size:0.97rem;line-height:1.75">${nd.text}</div>
    </div>`;
      });
      if (!h)
        h =
          '<div style="padding:20px;color:#aaa;font-size:13px;font-style:italic">Nessuna nota di commento.</div>';
      document.getElementById(`out-commento-${col}`).innerHTML = h;
      // Bind note → hl in text
      document
        .querySelectorAll(`#out-commento-${col} .note-entry`)
        .forEach((el) => {
          el.addEventListener("click", () => {
            const segId = el.dataset.noteTarget;
            document
              .querySelectorAll(
                ".note-marker.hl, .tei-seg.hl, .note-entry.hl",
              )
              .forEach((e) => e.classList.remove("hl"));
            document
              .querySelectorAll(`.note-marker[data-seg-id="${segId}"]`)
              .forEach((e) => e.classList.add("hl"));
            document
              .querySelectorAll(`.tei-seg[data-seg-id="${segId}"]`)
              .forEach((e) => e.classList.add("hl"));
            el.classList.add("hl");
            const tgtCol = targetCol(col);
            const marker = document.querySelector(
              `#out-testo-${tgtCol} .note-marker[data-seg-id="${segId}"]`,
            );
            if (marker) {
              ensurePaneVisible(tgtCol, "testo");
              setTimeout(

                  }),

              );

          });
