    }

    /* ──────────────────────────────────────────────────────────────
 TRADUZIONE
────────────────────────────────────────────────────────────── */
    function buildTranslation() {
      const trans = Array.from(xml.getElementsByTagNameNS(NS, "div")).find(
        (d) => d.getAttribute("type") === "translation",
      );
      if (!trans) return;
      let h = "";
      const lines = Array.from(trans.getElementsByTagNameNS(NS, "l"));
      const paras = Array.from(trans.getElementsByTagNameNS(NS, "p"));
      if (lines.length > 0) {
        // Traduzione in versi: rispetta la struttura <lg>
        const lgs = Array.from(trans.getElementsByTagNameNS(NS, "lg"));
        if (lgs.length > 0) {
          lgs.forEach((lg) => {
            const lgN = lg.getAttribute("n") || "";
            h += `<div class="tei-lg"${lgN ? ` data-lg="${lgN}"` : ''}>`;
            Array.from(lg.getElementsByTagNameNS(NS, "l")).forEach((l) => {
              h += `<div class="tei-l"><span class="line-n">${l.getAttribute("n")}</span>${smartQuotes(l.textContent.trim())}</div>`;
            });
            h += `</div>`;
          });
        } else {
          // Nessun <lg>: fallback a lista piatta
          lines.forEach((l) => {
            h += `<div class="tei-l"><span class="line-n">${l.getAttribute("n")}</span>${smartQuotes(l.textContent.trim())}</div>`;
          });
        }
      } else {
        paras.forEach((p) => {
          const pN = p.getAttribute("n") || "";
          h += `<p${pN ? ` data-tp="${pN}"` : ''} style="font-family:'Source Serif 4',serif;font-size:1.05rem;line-height:1.85;margin:0 0 1.2rem;font-style:italic">${smartQuotesHtml(p.innerHTML)}</p>`;
        });
      }
      document.getElementById("out-traduzione-L").innerHTML = h;
      document.getElementById("out-traduzione-R").innerHTML = h;
    }

    /* ──────────────────────────────────────────────────────────────
 ALLINEAMENTO TRADUZIONE ↔ EDIZIONE
 Attivo solo quando un pannello mostra "testo" e l'altro "traduzione".
 Abbina <div data-lg="n"> con <p data-tp="n"> per numero.
────────────────────────────────────────────────────────────── */
    // Gestione scroll simultaneo — riferimento ai listener attivi per poterli rimuovere
    let _scrollListeners = null;

    function alignTranslation() {
      // Determina quale colonna ha il testo e quale la traduzione
      const textCol  = activePaneId["L"] === "testo" ? "L"
                     : activePaneId["R"] === "testo" ? "R" : null;
      const transCol = activePaneId["L"] === "traduzione" ? "L"
                     : activePaneId["R"] === "traduzione" ? "R" : null;

      // Rimuove listener scroll precedenti
      if (_scrollListeners) {
        _scrollListeners.textEl.removeEventListener("scroll", _scrollListeners.onTextScroll);
        _scrollListeners.transEl.removeEventListener("scroll", _scrollListeners.onTransScroll);
        _scrollListeners = null;
      }

      // Reset margini in ogni caso
      const resetMargins = (col) => {
        const cont = document.getElementById(`out-traduzione-${col}`);
        if (!cont) return;
        cont.querySelectorAll("p[data-tp]").forEach(p => p.style.marginTop = "");
      };

      if (!textCol || !transCol || textCol === transCol) {
        ["L","R"].forEach(resetMargins);
        return;
      }

      resetMargins(transCol);

      // Contenitori scroll
      const textScroll  = document.getElementById(`inner-scroll-${textCol}`);
      const transScroll = document.getElementById(`inner-scroll-${transCol}`);
      if (!textScroll || !transScroll) return;

      const textTop  = textScroll.getBoundingClientRect().top;

      // Allineamento: per ogni paragrafo trova il lg corrispondente
      const transCont = document.getElementById(`out-traduzione-${transCol}`);
      if (!transCont) return;

      transCont.querySelectorAll("p[data-tp]").forEach(p => {
        const n  = p.getAttribute("data-tp");
        const lg = document.querySelector(`#out-testo-${textCol} .tei-lg[data-lg="${n}"]`);
        if (!lg) return;
        const lgTop = lg.getBoundingClientRect().top - textTop;
        const pTop  = p.getBoundingClientRect().top - transCont.getBoundingClientRect().top;
        const delta = lgTop - pTop;
        if (delta > 0) p.style.marginTop = delta + "px";
      });

      // Scroll simultaneo — evita loop con flag
      let _syncing = false;
      const onTextScroll = () => {
        if (_syncing) return;
        _syncing = true;
        transScroll.scrollTop = textScroll.scrollTop;
        _syncing = false;
      };
      const onTransScroll = () => {
        if (_syncing) return;
        _syncing = true;
        textScroll.scrollTop = transScroll.scrollTop;
        _syncing = false;
      };
      textScroll.addEventListener("scroll",  onTextScroll);
      transScroll.addEventListener("scroll", onTransScroll);
      _scrollListeners = { textEl: textScroll, transEl: transScroll, onTextScroll, onTransScroll };
    }

    // Chiama alignTranslation dopo ogni switchPane e al resize
    window.addEventListener("resize", alignTranslation);

    /* ──────────────────────────────────────────────────────────────
 FILTER BARS
────────────────────────────────────────────────────────────── */
    /* Estrae il testo piatto di un <lem> per il display nell'apparato.
       Gli <app> annidati vengono sostituiti con il testo del loro <lem> diretto
       (es: "e <app><lem>freg</lem>...</app>" → "e freg"),
       evitando di includere anche i testi degli <rdg> figli. */
    function lemTextFlat(el) {
      if (!el) return '';
      let out = '';
      Array.from(el.childNodes).forEach(n => {
        if (n.nodeType === 3) { out += n.textContent; return; }
        if (n.nodeType !== 1) return;
        if (n.localName === 'app') {
          // Sostituisce l'<app> annidato con il testo del suo <lem> diretto
          const innerLem = n.getElementsByTagNameNS(NS, 'lem')[0]
                        || n.querySelector('lem');
          if (innerLem) out += lemTextFlat(innerLem);
          return;
        }
        out += lemTextFlat(n);
      });
      return out.replace(/\s+/g, ' ').trim();
    }

    function buildFilterBars() {
      ["L", "R"].forEach((col) => {
        const fb = document.getElementById(`app-filters-${col}`);
        let h = '<div class="filter-bar">';
        h += "<label>Testimoni</label>";
        // Pulsante "tutti" — toggle globale on/off
        h += `<button class="filter-chip on" id="wit-all-${col}" onclick="toggleAllWits('${col}',this)" title="Seleziona / deseleziona tutti">tutti</button>`;
        activeWitIds.forEach((wid) => {
          h += `<button class="filter-chip on" data-col="${col}" data-wit="${wid}" onclick="toggleWit('${col}','${wid}',this)">${witLabel(wid)}</button>`;
        });
        h += '<div class="filter-divider"></div>';
        h += "<label>Varianti</label>";
        h += `<button class="filter-chip on" data-col="${col}" data-vtype="substantive"   onclick="toggleVType('${col}','substantive',this)">Sostanziali</button>`;
        h += `<button class="filter-chip on" data-col="${col}" data-vtype="orthographic"  onclick="toggleVType('${col}','orthographic',this)">Ortografiche</button>`;
        h += "</div>";
        fb.innerHTML = h;
      });
    }

    /* Converte un xml:id testimone nella resa HTML con superscript.
       N^2 → N<sup>2</sup>  |  D^a → D<sup>a</sup>  |  A → A  */
    function witLabel(id) {
      return id.replace(/\^(\w+)/g, '<sup>$1</sup>');
    }

    /* Serializza il contenuto testuale di un elemento <witness> TEI
       convertendo <hi rend="sup"> → <sup> per la resa visiva HTML. */
    function renderWitText(el) {
      let html = '';
      Array.from(el.childNodes).forEach(node => {
        if (node.nodeType === 3) {
          html += node.textContent;
        } else if (node.nodeType === 1) {
          const rend = node.getAttribute('rend');
          if (rend === 'sup') html += `<sup>${node.textContent}</sup>`;
          else if (rend === 'italic') html += `<em>${node.textContent}</em>`;
          else if (rend === 'bold')   html += `<strong>${node.textContent}</strong>`;
          else html += node.textContent;
        }
      });
      return html.trim();
    }

    /* Toggle globale: se tutti selezionati → deseleziona tutti; altrimenti → seleziona tutti. */
    function toggleAllWits(col, btn) {
      const allOn = witnessFilter[col].size === activeWitIds.length;
      if (allOn) {
        // Deseleziona tutti
        witnessFilter[col].clear();
        document.querySelectorAll(`.filter-chip[data-col="${col}"][data-wit]`).forEach(c => c.classList.remove("on"));
        btn.classList.remove("on");
      } else {
        // Seleziona tutti
        activeWitIds.forEach(id => witnessFilter[col].add(id));
        document.querySelectorAll(`.filter-chip[data-col="${col}"][data-wit]`).forEach(c => c.classList.add("on"));
        btn.classList.add("on");
      }
      renderApparatus(col);
    }

    /* Aggiorna il pulsante "tutti" in base allo stato corrente dei chip. */
    function syncTuttiBtn(col) {
      const btn = document.getElementById(`wit-all-${col}`);
      if (btn) btn.classList.toggle("on", witnessFilter[col].size === activeWitIds.length);
    }

    /* Deseleziona tutti i testimoni del pannello col. */
    function clearWitFilter(col) {
      witnessFilter[col].clear();
      document.querySelectorAll(`.filter-chip[data-col="${col}"][data-wit]`).forEach(btn => {
        btn.classList.remove("on");
      });
      renderApparatus(col);
    }

    function toggleWit(col, witId, btn) {
      if (witnessFilter[col].has(witId)) witnessFilter[col].delete(witId);
      else witnessFilter[col].add(witId);
      btn.classList.toggle("on", witnessFilter[col].has(witId));
      syncTuttiBtn(col);
      renderApparatus(col);
    }

    function toggleVType(col, vtype, btn) {
      if (variantFilter[col].has(vtype)) variantFilter[col].delete(vtype);
      else variantFilter[col].add(vtype);
      btn.classList.toggle("on", variantFilter[col].has(vtype));
      renderApparatus(col);
    }

    /* ──────────────────────────────────────────────────────────────
 TEXT INTERACTIONS
────────────────────────────────────────────────────────────── */
    /* ──────────────────────────────────────────────────────────────
 UTILITY: which column does a DOM element belong to?
────────────────────────────────────────────────────────────── */
    function colOf(el) {
      if (el.closest("#col-left")) return "L";
      if (el.closest("#col-right")) return "R";
      return null;
    }
    function otherCol(col) {
      return col === "L" ? "R" : "L";
    }

    /* Stato del lock-panel: 'L', 'R', o null.
       Quando una colonna è "bloccata", le navigazioni cross-pane (note,
       apparato) NON la modificano: il bersaglio diventa sempre l'altra
       colonna. La regola unificata è in targetCol(). */
    let lockedCol = null;

    /* Sceglie la colonna di destinazione per una navigazione cross-pane:
       - se nessuna colonna è bloccata → otherCol(srcCol) (comportamento storico)
       - se una colonna è bloccata    → l'altra colonna (regardless srcCol)
       Quando lockedCol === null la funzione è equivalente a otherCol(srcCol),
       quindi il comportamento esistente è preservato bit-per-bit. */
    function targetCol(srcCol) {
      if (lockedCol) return otherCol(lockedCol);
      return otherCol(srcCol);
    }

    function bindTextEvents() {
      document.body.addEventListener("click", (e) => {
        // App span in text → open rdg in the OTHER column
        const appSpan = e.target.closest(".tei-app");
        if (appSpan) {
          const srcCol = colOf(appSpan);
          highlightApp(appSpan.dataset.appId, srcCol);
          return;
        }

        // Note marker / seg → open note in the OTHER column
        const marker = e.target.closest(".note-marker, .tei-seg");
        if (marker) {
          const sid = marker.dataset.segId;
          if (sid) {
            const srcCol = colOf(marker);
            highlightNote(sid, srcCol);
            return;
          }
        }

        // Clic su area neutra: rimuovi tutte le evidenziazioni
        if (!e.target.closest(".app-entry, .note-entry")) {
          document
            .querySelectorAll(
              ".tei-app.hl, .app-entry.hl, .note-marker.hl, .tei-seg.hl, .note-entry.hl",
            )
            .forEach((el) => el.classList.remove("hl"));
        }
      });
    }

    /*
highlightApp(appId, srcCol)
  srcCol = column where the click originated ('L', 'R', or null if from apparatus)
Logic:
  - If clicked from text (srcCol known): highlight lem in ALL text panels, open rdg
    in the opposite column's apparatus. The source column pane is NOT changed.
  - If clicked from apparatus (srcCol=null): highlight lem in text panels of ALL
    columns that are currently showing testo; scroll to it. Do not change those panes.
*/
    function highlightApp(appId, srcCol) {
      document
        .querySelectorAll(".tei-app.hl, .app-entry.hl")
        .forEach((el) => el.classList.remove("hl"));

      // Always highlight lem spans everywhere (visual feedback only, no pane switch)
      document
        .querySelectorAll(`.tei-app[data-app-id="${appId}"]`)
        .forEach((el) => el.classList.add("hl"));

      if (srcCol) {
        // Clicked from text: open apparatus in the OTHER column
        const tgtCol = targetCol(srcCol);
        ensurePaneVisible(tgtCol, "apparato");
        const entry = document.querySelector(
          `#out-apparato-${tgtCol} [data-app-id="${appId}"]`,
        );
        if (entry) {
          entry.classList.add("hl");
          setTimeout(
            () =>
              entry.scrollIntoView({ behavior: "smooth", block: "center" }),
            120,
          );
        }
        // Also highlight (but don't switch) apparatus in the source column if it's already open
        const entrySrc = document.querySelector(
          `#out-apparato-${srcCol} [data-app-id="${appId}"]`,
        );
        if (entrySrc) entrySrc.classList.add("hl");
      } else {
        // Clicked from apparatus: determine which column the apparatus lives in,
        // then scroll/highlight the lem in the OTHER column's testo
        // (caller passes srcCol=null; we detect via the clicked element stored in lastAppClick)
        ["L", "R"].forEach((col) => {
          const span = document.querySelector(
            `#out-testo-${col} .tei-app[data-app-id="${appId}"]`,
          );
          if (!span) return;
          if (activePaneId[col] === "testo") {
            setTimeout(
              () =>
                span.scrollIntoView({ behavior: "smooth", block: "center" }),
              120,
            );
          }
        });
      }
    }

    /*
highlightNote(segId, srcCol)
  srcCol = column of the clicked marker/seg, or null if click came from a note-entry
*/
    function highlightNote(segId, srcCol) {
      document
        .querySelectorAll(".note-marker.hl, .tei-seg.hl, .note-entry.hl")
        .forEach((el) => el.classList.remove("hl"));

      // Highlight all markers and segs everywhere (visual only)
      document
        .querySelectorAll(`.note-marker[data-seg-id="${segId}"]`)
        .forEach((el) => el.classList.add("hl"));
      document
        .querySelectorAll(`.tei-seg[data-seg-id="${segId}"]`)
        .forEach((el) => el.classList.add("hl"));

      if (srcCol) {
        // Clicked from text: open commento in the OTHER column
        const tgtCol = targetCol(srcCol);
        ensurePaneVisible(tgtCol, "commento");
        const ne = document.getElementById(`note-${tgtCol}-${segId}`);
        if (ne) {
          ne.classList.add("hl");
          setTimeout(
            () => ne.scrollIntoView({ behavior: "smooth", block: "center" }),
            120,
          );
        }
        // Also highlight (don't switch) note in source column if commento already open
        const neSrc = document.getElementById(`note-${srcCol}-${segId}`);
        if (neSrc) neSrc.classList.add("hl");
      } else {
        // Clicked from note panel: scroll to marker in the other column's testo
        ["L", "R"].forEach((col) => {
          const marker = document.querySelector(
            `#out-testo-${col} .note-marker[data-seg-id="${segId}"]`,
          );
          if (!marker) return;
          if (activePaneId[col] === "testo") {
            setTimeout(
              () =>
                marker.scrollIntoView({
                  behavior: "smooth",
                  block: "center",
                }),
              120,
            );
          }
        });
      }
    }

    function ensurePaneVisible(col, paneId) {
      if (
        document
          .getElementById("main-body")
          .classList.contains("layout-single")
      ) {
        selectView("edition");
      }
      if (activePaneId[col] !== paneId) {
        switchPane(col, paneId);
      }
    }

    /* ──────────────────────────────────────────────────────────────
 FACSIMILE — Mirador IIIF
 Struttura TEI attesa:
   <surface xml:id="A" corresp="#A">
     <graphic url="...manifest.json" mimeType="application/ld+json"/>
     <zone xml:id="A_9r" n="9r"/>
     <zone xml:id="A_9v" n="9v"/>
   </surface>
────────────────────────────────────────────────────────────── */

    /* ── PARSING TEI: costruisce surfaceByWit ── */
    function buildFacsimile() {
      const surfaces = Array.from(xml.getElementsByTagNameNS(NS, "surface"));
      if (!surfaces.length) return;

      // FIX 1: popola surfaceByWit qui, non altrove
      surfaceByWit = {};
      surfaces.forEach(surf => {
        const witId = (surf.getAttribute("corresp") || surf.getAttribute("xml:id") || "").replace("#","");
        const graphic = surf.getElementsByTagNameNS(NS, "graphic")[0];
        const manifestUrl = graphic?.getAttribute("url") || "";
        const zones = Array.from(surf.getElementsByTagNameNS(NS, "zone")).map(z => ({
          id:      z.getAttribute("xml:id") || "",
          n:       z.getAttribute("n") || "",
          corresp: z.getAttribute("corresp") || "",  // opzionale: id parziale canvas
        }));
        if (witId && manifestUrl) surfaceByWit[witId] = { manifestUrl, zones };
      });

      // Costruisce HTML dei pannelli
      ["L","R"].forEach(col => {
        const container = document.getElementById("out-facsimile-" + col);
        // FIX 5: usa concatenazione invece di template literal annidato
        // Usa template literal esterno — col è una variabile JS, non HTML
        const q = col; // alias leggibile
        container.innerHTML = `
          <div class="fac-wrapper">
            <div class="fac-toolbar">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)">Testimone</span>
                <select class="fac-select" id="fac-wit-${q}" onchange="facWitChange('${q}',this.value)">
                  ${witnesses.filter(w => surfaceByWit[w.id]).map(w => `<option value="${w.id}">${w.id} – ${w.text}</option>`).join("")}
                </select>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <button class="fac-btn" id="fac-first-${q}" onclick="facPage('${q}','first')">inizio</button>
                <button class="fac-btn" id="fac-prev-${q}"  onclick="facPage('${q}','prev')">prec.</button>
                <div style="position:relative" id="fac-dropdown-wrap-${q}">
                  <button id="fac-page-${q}"
                    onclick="facToggleDropdown('${q}')"
                    style="font-family:'Source Sans 3',sans-serif;font-size:11px;font-weight:800;
                           letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);
                           background:white;border:1px solid var(--border);border-radius:5px;
                           padding:5px 12px;cursor:pointer;min-width:72px;
                           display:flex;align-items:center;gap:6px;transition:border-color .15s"
                    onmouseover="this.style.borderColor='var(--accent)'"
                    onmouseout="this.style.borderColor='var(--border)'"
                    title="Scegli carta">
                    <span id="fac-page-label-${q}">–</span>
                    <span class="material-symbols-outlined"
                      style="font-size:14px;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20;opacity:.6">expand_more</span>
                  </button>
                  <div id="fac-select-${q}"
                    style="display:none;position:absolute;top:calc(100% + 4px);left:50%;
                           transform:translateX(-50%);background:white;border:1px solid var(--border);
                           border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.1);
                           z-index:100;min-width:100%;overflow:hidden">
                  </div>
                </div>
                <button class="fac-btn" id="fac-next-${q}" onclick="facPage('${q}','next')">succ.</button>
                <button class="fac-btn" id="fac-last-${q}" onclick="facPage('${q}','last')">fine</button>
              </div>
            </div>
            <div class="fac-info-bar" id="fac-info-bar-${q}">
              <div class="fac-info-bar-header" onclick="toggleFacInfoBar('${q}')">
                <span class="fac-info-bar-title">Info IIIF</span>
                <span class="fac-info-bar-toggle">▾</span>
              </div>
              <div class="fac-info-bar-body">
                <div class="fac-info-bar-inner" id="fac-info-inner-${q}">
                  <span style="color:#ccc">Caricamento…</span>
                </div>
              </div>
            </div>
            <div class="fac-mirador-container" style="position:relative;flex:1;min-height:0">
              <div class="fac-loading" id="fac-loading-${q}">
                <div class="fac-spinner"></div>
                <div class="fac-loading-text">Caricamento facsimile…</div>
              </div>
              <div id="mirador-mount-${q}" style="width:100%;height:100%"></div>
            </div>
          </div>`;
      });
    }

    function initFacsimileDisplay(col) {
      // FIX 2: surfaceByWit è già popolato da buildFacsimile, chiamata sicura
      const witId = witnesses[0]?.id;
      if (witId) facWitChange(col, witId);
    }

    function facWitChange(col, witId) {
      const sel = document.getElementById("fac-wit-" + col);
      if (sel) sel.value = witId;
      const st   = miradorState[col];
      const data = surfaceByWit[witId];
      if (!data) return;
      st.pages   = data.zones.map(z => ({ n: z.n, id: z.id, corresp: z.corresp || "", manifestUrl: data.manifestUrl }));
      st.pageIdx       = 0;
      st.canvasIndexes = []; // reset per il nuovo testimone
      // FIX 3: resetta anche storeSubscribed per il nuovo testimone
      st.initialized    = false;
      st.storeSubscribed = false;
      // Svuota dropdown così viene ripopolato con le carte del nuovo testimone
      ["L","R"].forEach(c => {
        const dd = document.getElementById("fac-select-" + c);
        if (dd) dd.innerHTML = "";
      });
      if (st.blobUrl) { URL.revokeObjectURL(st.blobUrl); st.blobUrl = null; }
      // Sostituisce il div mount con uno nuovo: React non può rimontarsi su un nodo già usato
      const oldMount = document.getElementById(MIRADOR_EL[col]);
      if (oldMount) {
        const newMount = document.createElement("div");
        newMount.id    = MIRADOR_EL[col];
        newMount.style.cssText = "width:100%;height:100%";
        oldMount.replaceWith(newMount);
      }
      const loading = document.getElementById("fac-loading-" + col);
      if (loading) loading.style.display = "";
      initMiradorForCol(col);
      updateFacNav(col);
    }

    function facPage(col, action) {
      try {
        const st = miradorState[col];
        if (!st || !st.pages || st.pages.length === 0) {
          console.warn(`facPage: nessuna pagina disponibile per la colonna "${col}"`);
          return;
        }
        const max    = st.pages.length - 1;
        const before = st.pageIdx;
        let   target = before;
        if      (action === "first")                  target = 0;
        else if (action === "last")                   target = max;
        else if (action === "prev" && before > 0)     target = before - 1;
        else if (action === "next" && before < max)   target = before + 1;
        if (target === before) return;
        st.pageIdx = target;
        miradorNavigateTo(col, target, before);
        updateFacNav(col);
      } catch(e) {
        console.error('facPage: errore inatteso:', e);
      }
    }

    function updateFacNav(col) {
      const st    = miradorState[col];
      const pages = st.pages;
      const max   = (st.canvasIndexes?.length || pages.length) - 1;

      // Aggiorna label del bottone
      const label   = pages[st.pageIdx]?.n || String(st.pageIdx + 1);
      const labelEl = document.getElementById("fac-page-label-" + col);
      if (labelEl) labelEl.textContent = label;

      // Popola il dropdown (solo la prima volta o se vuoto)
      const dropdown = document.getElementById("fac-select-" + col);
      if (dropdown && dropdown.children.length === 0) {
        pages.forEach((p, i) => {
          const item = document.createElement("button");
          item.textContent = p.n || String(i + 1);
          item.dataset.idx = i;
          item.style.cssText = `display:block;width:100%;padding:7px 16px;text-align:center;
            font-family:'Source Sans 3',sans-serif;font-size:10px;font-weight:700;
            letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);
            background:none;border:none;cursor:pointer;transition:all .12s;white-space:nowrap`;
          item.onmouseover = () => { item.style.background = "rgba(160,63,51,0.08)"; item.style.color = "var(--accent)"; };
          item.onmouseout  = () => { item.style.background = "none"; item.style.color = item.style.fontWeight === "800" ? "var(--accent)" : "var(--muted)"; };
          item.onclick = () => { facGoTo(col, i); facCloseDropdown(col); };
          dropdown.appendChild(item);
        });
      }
      // Evidenzia la voce corrente
      if (dropdown) {
        Array.from(dropdown.children).forEach((item, i) => {
          const active = i === st.pageIdx;
          item.style.color      = active ? "var(--accent)" : "var(--muted)";
          item.style.fontWeight = active ? "800" : "700";
        });
      }

      const isFirst = st.pageIdx === 0;
      const isLast  = st.pageIdx === max;
      ["first","prev"].forEach(k => {
        const b = document.getElementById("fac-" + k + "-" + col);
        if (b) b.disabled = isFirst;
      });
      ["next","last"].forEach(k => {
        const b = document.getElementById("fac-" + k + "-" + col);
        if (b) b.disabled = isLast;
      });
    }

    function facToggleDropdown(col) {
      const dd = document.getElementById("fac-select-" + col);
      if (!dd) return;
      const isOpen = dd.style.display !== "none";
      ["L","R"].forEach(c => facCloseDropdown(c));
      if (!isOpen) dd.style.display = "block";
    }

    function facCloseDropdown(col) {
      const dd = document.getElementById("fac-select-" + col);
      if (dd) dd.style.display = "none";
    }

    function facGoTo(col, value) {
      const st  = miradorState[col];
      const idx = typeof value === "number" ? value : parseInt(value, 10);
      if (isNaN(idx)) return;
      const maxIdx = (st.canvasIndexes?.length || st.pages.length) - 1;
      const before = st.pageIdx;
      st.pageIdx = Math.max(0, Math.min(idx, maxIdx));
      if (st.pageIdx !== before)
        miradorNavigateTo(col, st.pageIdx, before);
      updateFacNav(col);
    }

    document.addEventListener("click", e => {
      ["L","R"].forEach(col => {
        const wrap = document.getElementById("fac-dropdown-wrap-" + col);
        if (wrap && !wrap.contains(e.target)) facCloseDropdown(col);
      });
    });

    /* ── Avvia Mirador (idempotente per testimone corrente) ── */
    function initMiradorForCol(col) {
      const st = miradorState[col];
      if (!st.pages.length)  return;
      if (st.initialized)    return;
      st.initialized = true;
      mountMirador(col);
    }

    function hideMiradorLoading(col) {
      const el = document.getElementById("fac-loading-" + col);
      if (el) el.style.display = "none";
    }

    /* ── Helper: estrae canvas da manifest IIIF v2/v3 ── */
    function extractCanvasesFromManifest(manifest) {
      if (manifest.items) return manifest.items;
      if (manifest.sequences?.[0]?.canvases) return manifest.sequences[0].canvases;
      return [];
    }

    /* ── Helper: label testuale di una canvas (v2 e v3) ── */
    function getCanvasLabel(canvas) {
      const lbl = canvas.label;
      if (!lbl) return "";
      if (typeof lbl === "string") return lbl;
      if (typeof lbl === "object") {
        const vals = Object.values(lbl);
        const first = vals[0];
        if (Array.isArray(first)) return first[0] || "";
        return first || "";
      }
      return "";
    }

    /* ── Helper: filtra canvas per foglio — match esatto > startsWith > includes ── */
    function filterCanvasesByFolio(canvases, pages) {
      return pages.map(p => {
        // Se la zona ha @corresp, cerca per id canvas (match esatto sul suffisso)
        if (p.corresp) {
          const found = canvases.find(c => (c["@id"] || c.id || "").includes(p.corresp));
          if (found) return found;
        }
        // Altrimenti match per label: esatto > startsWith > includes
        const n = p.n.toLowerCase();
        let found = canvases.find(c => getCanvasLabel(c).toLowerCase() === n);
        if (!found) found = canvases.find(c => getCanvasLabel(c).toLowerCase().startsWith(n));
        if (!found) found = canvases.find(c => getCanvasLabel(c).toLowerCase().includes(n));
        return found;
      }).filter(Boolean);
    }

    /* ── Helper: manifest IIIF 2.x ridotto con solo le canvas selezionate ── */
    function buildReducedManifest(source, canvases) {
      const label = source.label || source["@label"] || "Facsimile";
      return {
        "@context":  "http://iiif.io/api/presentation/2/context.json",
        "@id":       source["@id"] || "https://example.org/reduced",
        "@type":     "sc:Manifest",
        "label":     typeof label === "object"
                       ? (Object.values(label)[0]?.[0] || "Facsimile")
                       : label,
        "sequences": [{
          "@type":    "sc:Sequence",
          "@id":      (source["@id"] || "https://example.org") + "/sequence/normal",
          "canvases": canvases,
        }],
        "metadata":  source.metadata || [],
      };
    }

    /* ── Monta Mirador: fetch manifest → filtra canvas → Blob URL ── */
    async function mountMirador(col) {
      const st          = miradorState[col];
      const manifestUrl = st.pages[0]?.manifestUrl;
      if (!manifestUrl) return;

      let sourceManifest;
      try {
        const r = await fetch(manifestUrl, {
          headers: { Accept: "application/json, application/ld+json" }
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        sourceManifest = await r.json();
      } catch(e) {
        const el = document.getElementById("fac-loading-" + col);
        if (el) el.innerHTML =
          '<div style="padding:24px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8">' +
          '<strong style="display:block;margin-bottom:8px">Facsimile non disponibile</strong>' +
          'Manifest non raggiungibile: ' + e.message + '<br><br>' +
          '<span style="font-size:10px">URL: ' + manifestUrl + '</span></div>';
        return;
      }

      const allCanvases = extractCanvasesFromManifest(sourceManifest);
      if (!allCanvases.length) return;

      // Popola la barra info IIIF con i metadati del manifest
      populateFacInfoBar(col, sourceManifest, manifestUrl);

      const foundCanvases = filterCanvasesByFolio(allCanvases, st.pages);
      const finalCanvases = foundCanvases.length === st.pages.length
        ? foundCanvases
        : allCanvases.slice(0, wantedNs.length);

      st.canvases      = finalCanvases;
      st.canvasIndexes = finalCanvases.map((_, i) => i);
      st.pageIdx       = 0;

      const reduced = buildReducedManifest(sourceManifest, finalCanvases);
      if (st.blobUrl) URL.revokeObjectURL(st.blobUrl);
      st.blobUrl = URL.createObjectURL(
        new Blob([JSON.stringify(reduced)], { type: "application/json" })
      );

      hideMiradorLoading(col);

      st.viewer = Mirador.viewer({
        id: MIRADOR_EL[col],
        windows: [{
          id:                          "win-" + col,
          loadedManifest:              st.blobUrl,
          canvasIndex:                 0,
          view:                        "single",
          thumbnailNavigationPosition: "off",
          allowClose:                  false,
          allowMaximize:               false,
          allowTopMenuButton:          false,
          hideWindowTitle:             true,
          sideBarOpenByDefault:        false,
        }],
        workspace: {
          showZoomControls:      true,
          type:                  "mosaic",
          isWorkspaceAddVisible: false,
        },
        workspaceControlPanel: { enabled: false },
        thumbnailNavigation:   { defaultPosition: "off" },
        window: {
          allowMaximize:        false,
          allowClose:           false,
          allowTopMenuButton:   false,
          sideBarOpenByDefault: false,
          hideWindowTitle:      true,
        },
      });

      installStoreSync(col);
      updateFacNav(col);
      fixMiradorCanvasNav(col);
    }

    function installStoreSync(col) {
      const st        = miradorState[col];
      const container = document.getElementById(MIRADOR_EL[col]);
      if (!container || st.storeSubscribed) return;
      st.storeSubscribed = true;
      const poll = setInterval(() => {
        const btnNext = container.querySelector('button[aria-label="Next item"]');
        const btnPrev = container.querySelector('button[aria-label="Previous item"]');
        if (!btnNext || !btnPrev) return;
        clearInterval(poll);
        btnNext.addEventListener("click", () => {
          if (st.pageIdx < st.canvases.length - 1) { st.pageIdx++; setTimeout(() => updateFacNav(col), 80); }
        });
        btnPrev.addEventListener("click", () => {
          if (st.pageIdx > 0) { st.pageIdx--; setTimeout(() => updateFacNav(col), 80); }
        });
      }, 200);
    }

    /* FIX 4: firma corretta con before e targetIdx separati */
    function miradorNavigateTo(col, targetIdx, before) {
      const st        = miradorState[col];
      const container = document.getElementById(MIRADOR_EL[col]);
      if (!container) return;
      const diff  = targetIdx - before;
      if (diff === 0) return;
      const label  = diff > 0 ? "Next item" : "Previous item";
      const steps  = Math.abs(diff);
      let clicked  = 0;
      const poll = setInterval(() => {
        const btn = container.querySelector('button[aria-label="' + label + '"]');
        if (!btn || btn.disabled) { clearInterval(poll); return; }
        btn.click();
        clicked++;
        if (clicked >= steps) { clearInterval(poll); updateFacNav(col); }
      }, 120);
    }

    function fixMiradorCanvasNav(col) {
      const container = document.getElementById(MIRADOR_EL[col]);
      if (!container) return;
      let attempts = 0;
      const interval = setInterval(() => {
        attempts++;
        container.querySelectorAll(".mirador-canvas-nav").forEach(el => {
          el.style.setProperty("background",       "transparent", "important");
          el.style.setProperty("background-color", "transparent", "important");
          el.style.setProperty("box-shadow",       "none",        "important");
          el.style.setProperty("position",         "absolute",    "important");
          el.style.setProperty("bottom",           "8px",         "important");
          el.style.setProperty("top",              "auto",        "important");
          el.style.setProperty("left",             "50%",         "important");
          el.style.setProperty("transform",        "translateX(-50%)", "important");
          el.style.setProperty("height",           "auto",        "important");
          el.style.setProperty("width",            "auto",        "important");
        });
        container.querySelectorAll(".mirador-osd-container").forEach(el => {
          el.style.setProperty("position", "relative", "important");
        });
        if (attempts >= 20) clearInterval(interval);
      }, 200);
    }


  /* ═══════════════════════════════════════════════════════════════
     TEST UNITARI — ed_critica v1.0
     Eseguire dalla console del browser: runTests()
     Verde ✓ = comportamento corretto, Rosso ✗ = regressione.
     I test non modificano il DOM della pagina.
  ═══════════════════════════════════════════════════════════════ */
  function runTests() {
    let passed = 0, failed = 0;

    function assert(desc, actual, expected) {
      const ok = typeof expected === 'boolean'
        ? actual === expected
        : actual === expected;
      if (ok) {
        passed++;
        console.log(`%c  ✓ ${desc}`, 'color:#2a6e3f');
      } else {
        failed++;
        console.error(`  ✗ ${desc}\n    atteso:   ${JSON.stringify(expected)}\n    ottenuto: ${JSON.stringify(actual)}`);
      }
    }

    // Helper: parsa una stringa XML e restituisce l'elemento radice
    function tei(xmlStr) {
      return new DOMParser()
        .parseFromString(`<root xmlns="http://www.tei-c.org/ns/1.0">${xmlStr}</root>`,
          'application/xml')
        .documentElement;
    }

    // Helper: primo elemento figlio per localName
    function firstEl(root, localName) {
      return root.getElementsByTagNameNS('http://www.tei-c.org/ns/1.0', localName)[0];
    }

    // Helper: azzera stato globale rilevante per i test
    function resetState() {
      noteIndexMap = {};
    }

    // ── SMARTQUOTES ──────────────────────────────────────────────
    console.group('%c TEST SMARTQUOTES', 'font-weight:bold;font-size:13px');

    assert('smartQuotes → stringa vuota',      smartQuotes(''),        '');
    assert('smartQuotes → null → null',         smartQuotes(null),      null);
    assert('smartQuotes → testo semplice',      smartQuotes('ciao'),    'ciao');

    // Apostrofo interno
    assert("smartQuotes → dell'uomo",
      smartQuotes("dell'uomo"), "dell\u2019uomo");
    assert("smartQuotes → l'amor",
      smartQuotes("l'amor"), "l\u2019amor");

    // Virgolette doppie
    assert('smartQuotes → "apre"',
      smartQuotes('"ciao"'), '\u201Cciao\u201D');
    assert('smartQuotes → " dopo spazio',
      smartQuotes('disse "ciao"'), 'disse \u201Cciao\u201D');

      createCritVerse('1', [createCritText('testo')]),
    ]));
    assert('renderCritLg senza n → no data-lg', rl2.includes('data-lg'), false);

    // renderCritEdition — round-trip completo
    resetState();
    noteIndexMap['e1n'] = 1;
    const reLgs = parseCritEdition(tei(
      '<div>' +
        '<lg n="1">' +
          '<l n="1">Farai ' +
            '<app xml:id="e1"><lem>dreit</lem></app>' +
            ' nien<seg xml:id="e1n"></seg></l>' +
        '</lg>' +
      '</div>'));
    const reHtml = renderCritEdition(reLgs);
    assert('round-trip → tei-lg',         reHtml.includes('tei-lg'),        true);
    assert('round-trip → tei-l',          reHtml.includes('tei-l'),         true);
    assert('round-trip → tei-app',        reHtml.includes('tei-app'),       true);
    assert('round-trip → tei-seg',        reHtml.includes('tei-seg'),       true);
    assert('round-trip → note-marker',    reHtml.includes('note-marker'),   true);
    assert('round-trip → testo Farai',    reHtml.includes('Farai'),         true);
    assert('round-trip → testo nien',     reHtml.includes('nien'),          true);

    console.groupEnd();


    // ── INTEGRAZIONE — FASE 4D ────────────────────────────────────
    console.group('%c TEST INTEGRAZIONE — FASE 4D', 'font-weight:bold;font-size:13px');

    // Round-trip completo: parse → render → HTML corretto
    resetState();
    noteIndexMap['i1'] = 1;
    const intDiv = tei(
      '<div>' +
        '<lg n="1">' +
          '<l n="1">Farai ' +
            '<app xml:id="ia1"><lem>un vers</lem><rdg wit="#C">un vers</rdg></app>' +
            ' de <seg xml:id="i1">dreit</seg></l>' +
          '<l n="2"><hi rend="italic">nien</hi> del tot</l>' +
        '</lg>' +
        '<lg n="2">' +
          '<l n="3"><app xml:id="ia2"><lem type="conjecture">joi</lem></app></l>' +
        '</lg>' +
      '</div>');
    const intLgs  = parseCritEdition(intDiv);
    const intHtml = renderCritEdition(intLgs);

    // Struttura
    assert('integrazione → 2 tei-lg',
      (intHtml.match(/tei-lg/g)||[]).length === 2, true);
    assert('integrazione → 3 tei-l"',
      (intHtml.match(/tei-l"/g)||[]).length === 3, true);

    // Contenuto lg1 verso1
    assert('integrazione → testo Farai',      intHtml.includes('Farai'),          true);
    assert('integrazione → app ia1',           intHtml.includes('data-app-id="ia1"'), true);
    assert('integrazione → seg i1 con marker', intHtml.includes('note-marker'),    true);
    assert('integrazione → numero nota 1',     intHtml.includes('>1<'),            true);

    // Contenuto lg1 verso2
    assert('integrazione → hi italic → em',   intHtml.includes('<em>nien</em>'),  true);
    assert('integrazione → testo del tot',     intHtml.includes('del tot'),        true);

    // Contenuto lg2 (congettura)
    assert('integrazione → congettura ia2',
      intHtml.includes('conjecture'), true);
    assert('integrazione → data-lg lg2',
      intHtml.includes('data-lg="2"'), true);

    // parseCritEdition usa il parser, renderCritEdition usa il renderer
    // — verifica che siano compatibili con il codice di produzione
    assert('integrazione → parseCritEdition restituisce array',
      Array.isArray(intLgs), true);
    assert('integrazione → ogni elemento è lg',
      intLgs.every(l => l.kind === 'lg'), true);

    console.groupEnd();

    // ── RISULTATO ────────────────────────────────────────────────
    const total = passed + failed;
    const color = failed === 0 ? '#2a6e3f' : '#8b1a1a';
    console.log(`%c\n══ RISULTATO: ${passed}/${total} test superati${failed > 0 ? ` — ${failed} FALLITI` : ' ✓'} ══`,
      `color:${color};font-weight:bold`);
  }

  </script>

  <!-- RESIZER DRAG LOGIC -->
  <script>
  (function () {
    const resizer  = document.getElementById('col-resizer');
    const colLeft  = document.getElementById('col-left');
    const mainEl   = document.querySelector('main');

    let dragging = false;
    let startX   = 0;
    let startW   = 0;

    function isActive() {
      return document.getElementById('main-body').classList.contains('layout-dual');
    }

    resizer.addEventListener('mousedown', function (e) {
      if (!isActive()) return;
      dragging = true;
      startX   = e.clientX;
      startW   = colLeft.getBoundingClientRect().width;
      resizer.classList.add('dragging');
      document.body.style.cursor     = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      const mainW = mainEl.getBoundingClientRect().width;
      const delta = e.clientX - startX;
      const newW  = Math.min(Math.max(startW + delta, mainW * 0.15), mainW * 0.85);
      const pct   = (newW / mainW * 100).toFixed(2) + '%';
      document.getElementById('main-body').style.setProperty('--col-left-w', pct);
    });

    document.addEventListener('mouseup', function () {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor     = '';
      document.body.style.userSelect = '';
    });

    /* Touch support */
    resizer.addEventListener('touchstart', function (e) {
      if (!isActive()) return;
      dragging = true;
      startX   = e.touches[0].clientX;
      startW   = colLeft.getBoundingClientRect().width;
      resizer.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      const mainW = mainEl.getBoundingClientRect().width;
      const delta = e.touches[0].clientX - startX;
      const newW  = Math.min(Math.max(startW + delta, mainW * 0.15), mainW * 0.85);
      const pct   = (newW / mainW * 100).toFixed(2) + '%';
      document.getElementById('main-body').style.setProperty('--col-left-w', pct);
    }, { passive: true });

    document.addEventListener('touchend', function () {
      dragging = false;
      resizer.classList.remove('dragging');
    });

    /* Reset alla 50/50 con doppio clic */
    resizer.addEventListener('dblclick', function () {
      document.getElementById('main-body').style.removeProperty('--col-left-w');
    });
  })();
  </script>

  <!-- Fix: corregge il link Home risalendo il pathname finché trova index.html.
       Zero configurazione: funziona in locale, su GitHub Pages e su qualsiasi
       sottopath senza dover dichiarare la root nel markup. -->
  <script>
    (function () {
      const link = document.getElementById('home-link');
      if (!link) return;
      const parts = window.location.pathname.split('/');
      (async function () {
        for (let i = parts.length - 1; i > 0; i--) {
          const candidate = parts.slice(0, i).join('/') + '/index.html';
          try {
            const r = await fetch(candidate, { method: 'HEAD' });
            if (r.ok) { link.href = candidate; return; }
          } catch (_) {}
        }
      })();
    })();
  </script>
