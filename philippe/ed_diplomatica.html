/* ── Avvia Mirador (idempotente) ── */
function initMiradorForCol(col) {
  const st = miradorState[col];
  if (!st.pages.length) return;
  if (st.initialized) return;
  st.initialized = true;
  mountMirador(col);
}

function hideMiradorLoading(col) {
  const el = document.getElementById(`fac-loading-${col}`);
  if (el) el.style.display = "none";
}

function showMiradorError(col, msg) {
  const el = document.getElementById(`fac-loading-${col}`);
  if (!el) return;
  el.innerHTML = `
    <div style="text-align:center;padding:32px 24px;color:var(--muted);max-width:360px;margin:auto">
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;color:var(--dipl-damage)">Facsimile non disponibile</div>
      <div style="font-size:11px;line-height:1.7;margin-bottom:14px">${msg}</div>
      <div style="font-size:10px;line-height:1.7;background:var(--bg-panel);border:1px solid var(--border);border-radius:5px;padding:12px;text-align:left">
        <strong style="display:block;margin-bottom:4px;color:var(--text)">Come risolvere:</strong>
        Apri il progetto con un server locale.<br>
        In VS Code: <em>Live Server</em> → tasto destro su <code>diplomatica-testo.html</code>
        → <em>Open with Live Server</em>.
      </div>
    </div>`;
}

/* ── Monta Mirador: fetch manifest → filtra canvas → Blob URL ── */
async function mountMirador(col) {
  const st          = miradorState[col];
  const manifestUrl = st.pages[0]?.manifestUrl;
  if (!manifestUrl) { showMiradorError(col, "Nessun manifest IIIF nel TEI."); return; }

  // ── 1. Scarica il manifest ───────────────────────────────────────────────
  let sourceManifest;
  try {
    const r = await fetch(manifestUrl, {
      headers: { Accept: "application/json, application/ld+json" }
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    sourceManifest = await r.json();
  } catch(e) {
    showMiradorError(col, `Manifest non raggiungibile: ${e.message}`);
    return;
  }

  // ── 2. Filtra le canvas corrispondenti ai fogli TEI ─────────────────────
  const allCanvases = extractCanvasesFromManifest(sourceManifest);
  if (!allCanvases.length) { showMiradorError(col, "Nessuna canvas nel manifest."); return; }

  // Popola la barra info IIIF
  populateFacInfoBar(col, sourceManifest, manifestUrl);

  const wantedNs      = st.pages.map(p => p.n.toLowerCase());
  const foundCanvases = filterCanvasesByFolio(allCanvases, wantedNs);
  const finalCanvases = foundCanvases.length === wantedNs.length
    ? foundCanvases
    : allCanvases.slice(0, wantedNs.length);

  st.canvases      = finalCanvases;
  st.canvasIndexes = finalCanvases.map((_, i) => i); // 0,1,... nel manifest ridotto
  st.pageIdx       = 0;

  // ── 3. Manifest ridotto → Blob URL ──────────────────────────────────────
  const reduced = buildReducedManifest(sourceManifest, finalCanvases);
  if (st.blobUrl) URL.revokeObjectURL(st.blobUrl);
  st.blobUrl = URL.createObjectURL(
    new Blob([JSON.stringify(reduced)], { type: "application/json" })
  );

  // ── 4. Monta Mirador sul Blob URL ────────────────────────────────────────
  hideMiradorLoading(col);

  st.viewer = Mirador.viewer({
    id: MIRADOR_EL[col],
    windows: [{
      id:                          `win-${col}`,
      loadedManifest:              st.blobUrl,
      canvasIndex:                 0,
      view:                        "single",
      thumbnailNavigationPosition: "off",
      allowClose:                  false,
      allowMaximize:               false,
      allowTopMenuButton:          false,
      hideWindowTitle:             true,
      sideBarOpenByDefault:        false,
    }],
    workspace: {
      showZoomControls:      true,
      type:                  "mosaic",
      isWorkspaceAddVisible: false,
    },
    workspaceControlPanel: { enabled: false },
    thumbnailNavigation:   { defaultPosition: "off" },
    window: {
      allowMaximize:        false,
      allowClose:           false,
      allowTopMenuButton:   false,
      sideBarOpenByDefault: false,
      hideWindowTitle:      true,
    },
  });

  // ── 5. Subscriber: sincronizza toolbar con navigazione interna Mirador ──
  installStoreSync(col);
  updateFacNav(col);

}


/**
 * Installa listener sui pulsanti DOM nativi di Mirador.
 * Lo store con Blob URL non aggiorna canvasIndex in modo affidabile,
 * quindi tracciamo la posizione direttamente su st.pageIdx.
 */
function installStoreSync(col) {
  const st        = miradorState[col];
  const container = document.getElementById(MIRADOR_EL[col]);
  if (!container || st.storeSubscribed) return;
  st.storeSubscribed = true;

  // Polling finché i pulsanti sono nel DOM
  const poll = setInterval(() => {
    const btnNext = container.querySelector('button[aria-label="Next item"]');
    const btnPrev = container.querySelector('button[aria-label="Previous item"]');
    if (!btnNext || !btnPrev) return;
    clearInterval(poll);

    btnNext.addEventListener('click', () => {
      if (st.pageIdx < st.canvases.length - 1) {
        st.pageIdx++;
        setTimeout(() => updateFacNav(col), 80);
      }
    });

    btnPrev.addEventListener('click', () => {
      if (st.pageIdx > 0) {
        st.pageIdx--;
        setTimeout(() => updateFacNav(col), 80);
      }
    });
  }, 100);
}

/** Legge pageIdx corrente (non dallo store, inaffidabile con Blob URL) */
function getCurrentAbsIndex(col) {
  return miradorState[col].pageIdx ?? 0;
}

/** Sincronizza toolbar dopo navigazione programmatica */
function syncAfterNativeNav(col) {
  updateFacNav(col);
}



/** Estrae le canvas direttamente da un oggetto manifest JSON (IIIF v2 o v3) */
function extractCanvasesFromManifest(manifest) {
  if (manifest.items) return manifest.items;                           // IIIF v3
  if (manifest.sequences?.[0]?.canvases) return manifest.sequences[0].canvases; // IIIF v2
  return [];
}

/**
 * Per ogni nome foglio (es. "49v") cerca la canvas corrispondente
 * confrontando la label esatta (formato VAT: "49v", "50r", ecc.).
 * Matching: label esatta > label che inizia con n > label che contiene n.
 */
function filterCanvasesByFolio(canvases, wantedNs) {
  console.log('[IIIF] wantedNs:', wantedNs);
  console.log('[IIIF] prime 5 labels:', canvases.slice(0,5).map(c => getCanvasLabel(c)));
  return wantedNs.map(n => {
    let found = canvases.find(c => getCanvasLabel(c).toLowerCase() === n);
    if (!found) found = canvases.find(c => getCanvasLabel(c).toLowerCase().startsWith(n));
    if (!found) found = canvases.find(c => getCanvasLabel(c).toLowerCase().includes(n));
    console.log('[IIIF] cercando', JSON.stringify(n), '→', found ? getCanvasLabel(found) : 'NON TROVATO');
    return found;
  }).filter(Boolean);
}

/**
 * Costruisce un manifest minimo con solo le canvas selezionate.
 * Mantiene il formato originale: v2 se il source è v2, v3 se è v3.
 */
function buildReducedManifest(source, canvases) {
  const label = source.label || source["@label"] || "Facsimile";
  const labelStr = typeof label === "object"
    ? (Object.values(label)[0]?.[0] || "Facsimile")
    : label;

  // IIIF v3: usa items invece di sequences
  if (source.items || source["@context"]?.includes?.("3/context.json")) {
    return {
      "@context": "http://iiif.io/api/presentation/3/context.json",
      "id":       source.id || source["@id"] || "https://example.org/reduced",
      "type":     "Manifest",
      "label":    typeof label === "object" ? label : { "none": [labelStr] },
      "items":    canvases,
      "metadata": source.metadata || [],
    };
  }

  // IIIF v2
  return {
    "@context":  "http://iiif.io/api/presentation/2/context.json",
    "@id":       source["@id"] || "https://example.org/reduced",
    "@type":     "sc:Manifest",
    "label":     labelStr,
    "sequences": [{
      "@type":    "sc:Sequence",
      "@id":      (source["@id"] || "https://example.org") + "/sequence/normal",
      "canvases": canvases,
    }],
    "metadata":  source.metadata || [],
  };
}

/** Recupera la label testuale di una canvas (IIIF v2 e v3) */
function getCanvasLabel(canvas) {
  const lbl = canvas.label;
  if (!lbl) return "";
  if (typeof lbl === "string") return lbl;
  if (typeof lbl === "object") {
    // IIIF v3: { none: ["1r"] } oppure { en: ["1r"] }
    const vals = Object.values(lbl);
    const first = vals[0];
    if (Array.isArray(first)) return first[0] || "";
    return first || "";
  }
  return "";
}

/** Recupera il service URL dell'immagine IIIF da una canvas */
function getCanvasImageService(canvas) {
  // IIIF v3
  const body = canvas.items?.[0]?.items?.[0]?.body;
  if (body?.service) {
    const svc = Array.isArray(body.service) ? body.service[0] : body.service;
    return svc["@id"] || svc.id || null;
  }
  // IIIF v2
  const img = canvas.images?.[0]?.resource;
  if (img?.service) return img.service["@id"] || img.service.id || null;
  return null;
}

/** Dimensioni di una canvas */
function getCanvasDimensions(canvas) {
  return { w: canvas.width || 1000, h: canvas.height || 1000 };
}




/* ── Navigazione toolbar ── */
function facPage(col, action) {
  const st  = miradorState[col];
  if (!st.canvasIndexes?.length) return;
  const max    = st.canvasIndexes.length - 1;
  const before = st.pageIdx;  // salva indice prima della modifica

  if      (action === "first")                  st.pageIdx = 0;
  else if (action === "last" )                  st.pageIdx = max;
  else if (action === "prev" && before > 0)     st.pageIdx = before - 1;
  else if (action === "next" && before < max)   st.pageIdx = before + 1;

  if (st.pageIdx !== before)
    miradorNavigateTo(col, st.pageIdx, before);
  else
    updateFacNav(col);
}

function updateFacNav(col) {
  const st    = miradorState[col];
  const pages = st.pages;
  const max   = (st.canvasIndexes?.length || pages.length) - 1;

  // Aggiorna label del bottone
  const label = pages[st.pageIdx]?.n || `${st.pageIdx + 1}`;
  const labelEl = document.getElementById(`fac-page-label-${col}`);
  if (labelEl) labelEl.textContent = label;

  // Popola il dropdown (solo la prima volta)
  const dropdown = document.getElementById(`fac-select-${col}`);
  if (dropdown && dropdown.children.length === 0) {
    pages.forEach((p, i) => {
      const item = document.createElement("button");
      item.textContent = p.n || `${i + 1}`;
      item.dataset.idx = i;
      item.style.cssText = `display:block;width:100%;padding:7px 16px;text-align:center;
        font-family:'Source Sans 3',sans-serif;font-size:10px;font-weight:700;
        letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);
        background:none;border:none;cursor:pointer;transition:all .12s;white-space:nowrap`;
      item.onmouseover = () => { item.style.background = "var(--accent-light)"; item.style.color = "var(--accent)"; };
      item.onmouseout  = () => { item.style.background = "none"; item.style.color = "var(--muted)"; };
      item.onclick = () => { facGoTo(col, i); facCloseDropdown(col); };
      dropdown.appendChild(item);
    });
  }
  // Evidenzia la voce corrente
  if (dropdown) {
    Array.from(dropdown.children).forEach((item, i) => {
      const active = i === st.pageIdx;
      item.style.color  = active ? "var(--accent)" : "var(--muted)";
      item.style.fontWeight = active ? "800" : "700";
    });
  }

  ["first","prev"].forEach(k => {
    const b = document.getElementById(`fac-${k}-${col}`);
    if (b) b.disabled = st.pageIdx === 0;
  });
  ["next","last"].forEach(k => {
    const b = document.getElementById(`fac-${k}-${col}`);
    if (b) b.disabled = st.pageIdx === max;
  });
}

/**
 * Naviga a un indice locale (0,1,...) cliccando i pulsanti DOM di Mirador.
 * Riceve l'indice TARGET e l'indice di PARTENZA separatamente
 * per evitare che st.pageIdx (già aggiornato dalla toolbar) inganni il delta.
 */
function miradorNavigateTo(col, targetLocalIdx, fromIdx) {
  const st        = miradorState[col];
  const container = document.getElementById(MIRADOR_EL[col]);
  if (!container) return;

  const curIdx = (fromIdx !== undefined) ? fromIdx : st.pageIdx;
  const tgtIdx = targetLocalIdx;
  if (curIdx === tgtIdx) { updateFacNav(col); return; }

  const delta    = tgtIdx - curIdx;
  const btnLabel = delta > 0 ? "Next item" : "Previous item";
  const steps    = Math.abs(delta);
  let   clicked  = 0;

  const doClick = () => {
    if (clicked >= steps) { updateFacNav(col); return; }
    const btn = container.querySelector(`button[aria-label="${btnLabel}"]`);
    if (btn && !btn.disabled) {
      btn.click();
      clicked++;
      setTimeout(doClick, 120);
    } else {
      updateFacNav(col);
    }
  };
  doClick();
}

/** Apre/chiude il dropdown carta */
function facToggleDropdown(col) {
  const dd = document.getElementById(`fac-select-${col}`);
  if (!dd) return;
  const isOpen = dd.style.display !== "none";
  // Chiude tutti gli altri dropdown
  ["L","R"].forEach(c => facCloseDropdown(c));
  if (!isOpen) dd.style.display = "block";
}

function facCloseDropdown(col) {
  const dd = document.getElementById(`fac-select-${col}`);
  if (dd) dd.style.display = "none";
}

// Chiudi dropdown cliccando fuori
document.addEventListener("click", e => {
  ["L","R"].forEach(col => {
    const wrap = document.getElementById(`fac-dropdown-wrap-${col}`);
    if (wrap && !wrap.contains(e.target)) facCloseDropdown(col);
  });
});

/** Navigazione diretta via menu a tendina */
function facGoTo(col, value) {
  const st  = miradorState[col];
  const idx = typeof value === "number" ? value : parseInt(value, 10);
  if (isNaN(idx)) return;
  const maxIdx = (st.canvasIndexes?.length || st.pages.length) - 1;
  const before = st.pageIdx;
  st.pageIdx = Math.max(0, Math.min(idx, maxIdx));
  if (st.canvasIndexes?.length && st.pageIdx !== before)
    miradorNavigateTo(col, st.pageIdx, before);
  updateFacNav(col);
}



/**
 * Naviga il pannello Facsimile alla carta corrispondente al facs id.
 * Accetta sia riferimenti a <zone> (con highlight) che a <surface> (solo navigazione).
 */
function jumpToFacs(facsId, evt) {
  try {
    // Risolvi: zone o surface?
    const zone    = zoneIndex[facsId];
    const surface = surfaceIndex[facsId];
    const target  = zone || surface;
    if (!target) {
      console.warn(`jumpToFacs: id facsimile non trovato negli indici: "${facsId}"`);
      return;
    }

    // Determina la colonna di origine dal click
    const clickedEl = evt ? (evt.target || evt.currentTarget) : null;
    const originCol = clickedEl ? colOf(clickedEl) : null;

    // Il facsimile va nella colonna OPPOSTA a quella di origine.
    // Fallback a "R" se l'origine non è determinabile.
    const destCol = originCol ? targetCol(originCol) : "R";

    // Assicura che la vista edizione sia attiva (layout dual)
    if (document.getElementById("main-body").classList.contains("layout-single")) {
      selectView("edition");
    }

    // Apri il facsimile nella colonna di destinazione senza toccare l'altra
    switchPane(destCol, "facsimile");
    initMiradorForCol(destCol);

    // Naviga alla carta
    const st = miradorState[destCol];
    if (!st || !st.pages) {
      console.warn(`jumpToFacs: stato Mirador non disponibile per la colonna "${destCol}"`);
      return;
    }
    const targetLocalIdx = st.pages.findIndex(p => p.n === target.surfaceN);
    if (targetLocalIdx < 0) {
      console.warn(`jumpToFacs: carta "${target.surfaceN}" non trovata nel manifesto IIIF`);
      return;
    }
    if (targetLocalIdx !== st.pageIdx) {
      const before = st.pageIdx;
      st.pageIdx   = targetLocalIdx;
      miradorNavigateTo(destCol, targetLocalIdx, before);
    }

    // Highlight solo se è una zona con coordinate
    if (zone && zone.ulx !== undefined)
      setTimeout(() => highlightZone(destCol, zone), 400);

  } catch (e) {
    console.error('jumpToFacs: errore inatteso:', e);
  }
}

/**
 * Evidenzia una zona nel viewer Mirador usando un overlay SVG.
 * Le coordinate sono in px sulla canvas originale e vengono
 * scalate alle dimensioni attuali del viewer.
 */
function highlightZone(col, zone) {
  const container = document.getElementById(MIRADOR_EL[col]);
  if (!container) return;

  // Rimuovi highlight precedente
  container.querySelectorAll(".facs-zone-highlight").forEach(el => el.remove());

  // Trova il canvas viewer di Mirador
  const osdEl = container.querySelector(".mirador-canvas-world, canvas, [class*='osd'], [class*='OpenSeaDragon']");

  // Approccio alternativo: overlay assoluto proporzionale
  // Calcola la posizione dell'immagine nel viewer
  const store   = miradorState[col].viewer?.store;
  const canvas  = miradorState[col].canvases?.[miradorState[col].pageIdx];
  if (!canvas) return;

  const cw = canvas.width  || 1000;
  const ch = canvas.height || 1000;

  // Crea un overlay SVG sopra il viewer
  const viewer = container.querySelector(".fac-mirador-container") || container;
  const vRect  = viewer.getBoundingClientRect();

  const overlay = document.createElementNS("http://www.w3.org/2000/svg","svg");
  overlay.classList.add("facs-zone-highlight");
  overlay.setAttribute("viewBox", `0 0 ${cw} ${ch}`);
  overlay.style.cssText = `
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:20;
  `;

  const rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
  rect.setAttribute("x",      zone.ulx);
  rect.setAttribute("y",      zone.uly);
  rect.setAttribute("width",  zone.lrx - zone.ulx);
  rect.setAttribute("height", zone.lry - zone.uly);
  rect.setAttribute("fill",   "rgba(160,63,51,0.15)");
  rect.setAttribute("stroke", "var(--accent)");
  rect.setAttribute("stroke-width", "8");
  overlay.appendChild(rect);

  viewer.style.position = "relative";
  viewer.appendChild(overlay);

  // Rimuovi dopo 3 secondi con fade
  setTimeout(() => {
    overlay.style.transition = "opacity .5s";
    overlay.style.opacity = "0";
    setTimeout(() => overlay.remove(), 500);
  }, 3000);
}


/* ═══════════════════════════════════════════════════════════════
   TIPI TEI — Costruttori e validazione (Fase 1 v8.0)
   Ogni funzione crea un oggetto TeiNode puro (no HTML, no DOM).
   Il Parser (Fase 2) li produce; il Renderer (Fase 3) li consuma.
   Ogni costruttore valida l'input e lancia un errore descrittivo
   se riceve valori di tipo errato.
═══════════════════════════════════════════════════════════════ */

/* ── Helper di validazione (privato, non chiamare dall'esterno) ── */
function _teiReq(val, name, expected) {
  const ok = expected === 'array'
    ? Array.isArray(val)
    : typeof val === expected;
  if (!ok) throw new Error(
    `TeiNode: '${name}' deve essere ${expected}, ricevuto ${Array.isArray(val) ? 'array' : typeof val}`
  );
}
function _teiOpt(val, name, expected) {
  if (val !== undefined) _teiReq(val, name, expected);
}

/* ── Nodi base ── */

/** Nodo testo puro. */
function createTextNode(value) {
  _teiReq(value, 'value', 'string');
  return { kind: 'text', value };
}

/** Cambio riga fisica nel manoscritto.
 *  @param {number}  n       - numero riga
 *  @param {string}  facs    - id facsimile (opzionale)
 *  @param {boolean} breakNo - true se break="no" */
function createLbNode(n, facs, breakNo = false) {
  _teiReq(n,      'n',      'number');
  _teiOpt(facs,   'facs',   'string');
  _teiReq(breakNo,'breakNo','boolean');
  return { kind: 'lb', n, facs, break: breakNo };
}

/** Cambio carta. */
function createPbNode(facs) {
  _teiReq(facs, 'facs', 'string');
  return { kind: 'pb', facs };
}

/** Confine di verso. */
function createMilestoneNode(unit, n) {
  _teiReq(unit, 'unit', 'string');
  _teiReq(n,    'n',    'number');
  return { kind: 'milestone', unit, n };
}

/* ── Elementi inline ── */

/** Abbreviazione con espansione. */
function createAbbrNode(abbr, expan) {
  _teiReq(abbr,  'abbr',  'string');
  _teiReq(expan, 'expan', 'string');
  return { kind: 'abbr', abbr, expan };
}

/** Forma originale con regolarizzazione.
 *  orig è TeiNode[] perché può contenere abbr annidati. */
function createOrigNode(orig, reg) {
  _teiReq(orig, 'orig', 'array');
  _teiReq(reg,  'reg',  'string');
  return { kind: 'orig', orig, reg };
}

/** Forma errata con correzione. */
function createSicNode(sic, corr) {
  _teiReq(sic,  'sic',  'string');
  _teiReq(corr, 'corr', 'string');
  return { kind: 'sic', sic, corr };
}

/** Cancellatura. */
function createDelNode(text, rend) {
  _teiReq(text, 'text', 'string');
  _teiOpt(rend, 'rend', 'string');
  return { kind: 'del', text, rend };
}

/** Sostituzione per sovrascrittura. */
function createSubstNode(del, add, place) {
  _teiReq(del,   'del',   'string');
  _teiReq(add,   'add',   'string');
  _teiReq(place, 'place', 'string');
  return { kind: 'subst', del, add, place };
}

/** Aggiunta. */
function createAddNode(content, place) {
  _teiReq(content, 'content', 'array');
  _teiReq(place,   'place',   'string');
  return { kind: 'add', content, place };
}

/** Danno materiale. */
function createDamageNode(text) {
  _teiReq(text, 'text', 'string');
  return { kind: 'damage', text };
}

/** Lettura incerta. */
function createUnclearNode(text) {
  _teiReq(text, 'text', 'string');
  return { kind: 'unclear', text };
}

/** Integrazione editoriale. */
function createSuppliedNode(text, reason) {
  _teiReq(text, 'text', 'string');
  _teiOpt(reason, 'reason', 'string');
  return { kind: 'supplied', text, reason };
}

/** Formattazione. */
function createHiNode(content, rend) {
  _teiReq(content, 'content', 'array');
  if (rend !== 'italic' && rend !== 'bold')
    throw new Error(`TeiNode: 'rend' deve essere 'italic' o 'bold', ricevuto '${rend}'`);
  return { kind: 'hi', content, rend };
}

/** Marcatore di nota. */
function createSegNode(id, note, content) {
  _teiReq(id, 'id', 'string');
  _teiOpt(note,    'note',    'array');
  _teiOpt(content, 'content', 'array');
  return { kind: 'seg', id, note, content };
}

/* ── Strutture di blocco ── */

/** Paragrafo in prosa. */
function createPNode(content) {
  _teiReq(content, 'content', 'array');
  return { kind: 'p', content };
}

/** Blocco versale. */
function createLgNode(verses) {
  _teiReq(verses, 'verses', 'array');
  return { kind: 'lg', verses };
}

/** Singolo verso. */
function createVerseNode(n, content) {
  _teiReq(n,       'n',       'number');
  _teiReq(content, 'content', 'array');
  return { kind: 'verse', n, content };
}

/** Nota di commento. */
function createNoteNode(target, content, type) {
  _teiReq(target,  'target',  'string');
  _teiReq(content, 'content', 'array');
  _teiOpt(type,    'type',    'string');
  return { kind: 'note', target, type, content };
}

/* ── Nodi nota (sottoinsieme per renderNoteContent) ── */

/** Testo puro dentro una nota. */
function createNoteTextNode(value) {
  _teiReq(value, 'value', 'string');
  return { kind: 'note-text', value };
}

/** Formattazione dentro una nota. */
function createNoteHiNode(rend, content) {
  if (rend !== 'italic' && rend !== 'bold')
    throw new Error(`TeiNode: 'rend' deve essere 'italic' o 'bold', ricevuto '${rend}'`);
  _teiReq(content, 'content', 'array');
  return { kind: 'note-hi', rend, content };
}

/** Paragrafo interno a una nota. */
function createNotePNode(content) {
  _teiReq(content, 'content', 'array');
  return { kind: 'note-p', content };
}

/* ── Facsimile ── */

/** Zona facsimile. */
function createZoneNode(id, n, ulx, uly, lrx, lry) {
  _teiReq(id,  'id',  'string');
  _teiReq(n,   'n',   'string');
  _teiReq(ulx, 'ulx', 'number');
  _teiReq(uly, 'uly', 'number');
  _teiReq(lrx, 'lrx', 'number');
  _teiReq(lry, 'lry', 'number');
  return { kind: 'zone', id, n, ulx, uly, lrx, lry };
}

/** Superficie facsimile. */
function createSurfaceNode(id, n, zones) {
  _teiReq(id,    'id',    'string');
  _teiReq(n,     'n',     'string');
  _teiReq(zones, 'zones', 'array');
  return { kind: 'surface', id, n, zones };
}

/** Documento completo (output del parser). */
function createDivNode(type, surfaces, content) {
  _teiReq(type,     'type',     'string');
  _teiReq(surfaces, 'surfaces', 'array');
  _teiReq(content,  'content',  'array');
  return { kind: 'div', type, surfaces, content };
}


/* ═══════════════════════════════════════════════════════════════
   PARSER TEI — Elementi inline (Fase 2 v8.0, Settimana 1)
   Funzioni pure: DOM node → TeiNode (nessun HTML, nessuno stato).
   Ogni parse* riceve un Element TEI e restituisce il TeiNode
   corrispondente usando i costruttori della Fase 1.
   parseNodes è il dispatcher principale.
═══════════════════════════════════════════════════════════════ */

/**
 * Dispatcher principale.
 * Itera nodeList e converte ogni nodo nel TeiNode corrispondente.
 * I nodi testo vuoti (solo whitespace) vengono omessi.
 * @param   {NodeList|Array} nodeList
 * @returns {TeiNode[]}
 */
function parseNodes(nodeList) {
  return Array.from(nodeList).flatMap(node => {
    if (node.nodeType === 3) {
      // Filtra solo whitespace con newline (indentazione XML).
      // Spazi " " tra elementi inline sono semanticamente significativi.
      const t = node.textContent;
      if (!t || (t.trim() === '' && t.includes('\n'))) return [];
      return [createTextNode(t)];
    }
    if (node.nodeType !== 1) return [];
    switch (node.localName) {
      case 'lb':        return [parseLb(node)];
      case 'pb':        return [parsePb(node)];
      case 'milestone': return [parseMilestone(node)];
      case 'choice':    return [parseChoice(node)];
      case 'del':       return [parseDel(node)];
      case 'subst':     return [parseSubst(node)];
      case 'add':       return [parseAdd(node)];
      case 'damage':    return [parseDamage(node)];
      case 'unclear':   return [parseUnclear(node)];
      case 'supplied':  return [parseSupplied(node)];
      case 'hi':        return [parseHi(node)];
      case 'seg':       return [parseSeg(node)];
      case 'note':      return [parseNote(node)];
      case 'p':         return [parseP(node)];
      case 'lg':        return [parseLg(node)];
      case 'ab':        return [parseAb(node)];
      case 'abbr':      // <abbr> standalone (fuori da <choice>)
        return [createAbbrNode(node.textContent, '')];
      default:          return parseNodes(node.childNodes);
    }
  });
}

/** <lb n="1" facs="#A_1r" break="no"/> → LbNode */
function parseLb(node) {
  const n       = parseInt(node.getAttribute('n') || '0', 10);
  const facsRaw = (node.getAttribute('facs') || '').replace('#', '');
  const facs    = facsRaw || undefined;
  const breakNo = node.getAttribute('break') === 'no';
  return createLbNode(n, facs, breakNo);
}

/** <pb facs="#A_1r"/> → PbNode */
function parsePb(node) {
  const facs = (node.getAttribute('facs') || '').replace('#', '');
  return createPbNode(facs || '');
}

/** <milestone unit="verse" n="1"/> → MilestoneNode */
function parseMilestone(node) {
  const unit = node.getAttribute('unit') || '';
  const n    = parseInt(node.getAttribute('n') || '0', 10);
  return createMilestoneNode(unit, n);
}

/**
 * <choice> → AbbrNode | OrigNode | SicNode
 * Tre varianti riconosciute:
 *   <abbr>/<expan>  → abbr con espansione
 *   <orig>/<reg>    → forma originale (orig può contenere markup annidato)
 *   <sic>/<corr>    → forma errata con correzione
 */
function parseChoice(node) {
  const abbr = directChild(node, 'abbr');
  if (abbr) {
    const expan = directChild(node, 'expan');
    return createAbbrNode(abbr.textContent, expan ? expan.textContent : '');
  }
  const orig = directChild(node, 'orig');
  if (orig) {
    const reg = directChild(node, 'reg');
    return createOrigNode(parseNodes(orig.childNodes), reg ? reg.textContent : '');
  }
  const sic = directChild(node, 'sic');
  if (sic) {
    const corr = directChild(node, 'corr');
    return createSicNode(sic.textContent, corr ? corr.textContent : '');
  }
  // Fallback: nessuna variante riconosciuta
  return createTextNode(node.textContent);
}

/** <del rend="overwritten">text</del> → DelNode */
function parseDel(node) {
  const rend = node.getAttribute('rend') || undefined;
  return createDelNode(node.textContent, rend);
}

/**
 * <subst><del>r</del><add place="over">n</add></subst> → SubstNode
 * Usa il testo grezzo di <del> e <add> (markup interno ignorato,
 * coerente con la struttura dati di v8_struttura_dati.md).
 */
function parseSubst(node) {
  const delEl = directChild(node, 'del');
  const addEl = directChild(node, 'add');
  const del   = delEl ? delEl.textContent : '';
  const add   = addEl ? addEl.textContent : '';
  const place = addEl ? (addEl.getAttribute('place') || 'over') : 'over';
  return createSubstNode(del, add, place);
}

/** <add place="above">content</add> → AddNode (content è TeiNode[]) */
function parseAdd(node) {
  const place   = node.getAttribute('place') || 'above';
  const content = parseNodes(node.childNodes);
  return createAddNode(content, place);
}

/** <damage>text</damage> → DamageNode */
function parseDamage(node) {
  return createDamageNode(node.textContent);
}

/** <unclear>text</unclear> → UnclearNode */
function parseUnclear(node) {
  return createUnclearNode(node.textContent);
}

/** <supplied reason="lost">text</supplied> → SuppliedNode */
function parseSupplied(node) {
  const reason = node.getAttribute('reason') || undefined;
  return createSuppliedNode(node.textContent, reason);
}

/**
 * <hi rend="italic">content</hi> → HiNode
 * rend viene normalizzato: qualsiasi valore diverso da 'bold' → 'italic'.
 */
function parseHi(node) {
  const r    = node.getAttribute('rend') || '';
  const rend = r === 'bold' ? 'bold' : 'italic';
  return createHiNode(parseNodes(node.childNodes), rend);
}

/**
 * <seg xml:id="x"/>  → SegNode (ancora per nota, id valorizzato)
 * <seg>testo</seg>   → SegNode (id vuoto; il testo sarà attraversato dal renderer)
 */
function parseSeg(node) {
  const id      = node.getAttribute('xml:id') || '';
  const content = parseNodes(node.childNodes);
  return createSegNode(id, undefined, content);
}

/**
 * <note target="#x">content</note> → NoteNode
 * Il contenuto viene parsato come TeiNoteNode[] tramite parseNoteNodes.
 */
function parseNote(node) {
  const target  = (node.getAttribute('target') || '').replace('#', '');
  const type    = node.getAttribute('type') || undefined;
  const content = parseNoteNodes(node.childNodes);
  return createNoteNode(target, content, type);
}

/**
 * Dispatcher per il contenuto interno a <note>.
 * Produce TeiNoteNode[] (sottoinsieme: note-text, note-hi, note-p).
 * Gestisce anche <em> e <strong> come alias di <hi rend="italic/bold">.
 */
function parseNoteNodes(nodeList) {
  return Array.from(nodeList).flatMap(node => {
    if (node.nodeType === 3) {
      const t = node.textContent;
      if (!t || (t.trim() === '' && t.includes('\n'))) return [];
      return [createNoteTextNode(t)];
    }
    if (node.nodeType !== 1) return [];
    if (node.localName === 'hi') {
      const r    = node.getAttribute('rend') || '';
      const rend = r === 'bold' ? 'bold' : 'italic';
      return [createNoteHiNode(rend, parseNoteNodes(node.childNodes))];
    }
    if (node.localName === 'p') {
      return [createNotePNode(parseNoteNodes(node.childNodes))];
    }
    if (node.localName === 'em')
      return [createNoteHiNode('italic', [createNoteTextNode(node.textContent)])];
    if (node.localName === 'strong')
      return [createNoteHiNode('bold', [createNoteTextNode(node.textContent)])];
    return node.textContent ? [createNoteTextNode(node.textContent)] : [];
  });
}


/* ═══════════════════════════════════════════════════════════════
   PARSER TEI — Strutture di blocco (Fase 2 v8.0, Settimana 2)
   Funzioni pure: DOM Element → TeiNode (nessun HTML, nessuno stato).
   Dipendono da parseNodes (Fase 2 S1) e dai costruttori (Fase 1).
═══════════════════════════════════════════════════════════════ */

/**
 * <l n="1">content</l> → VerseNode
 * @param {Element} lNode
 * @returns {VerseNode}
 */
function parseVerse(lNode) {
  const n       = parseInt(lNode.getAttribute('n') || '0', 10);
  const content = parseNodes(lNode.childNodes);
  return createVerseNode(n, content);
}

/**
 * <lg>...</lg> → LgNode
 * Itera i figli diretti:
 *   <l>  → VerseNode
 *   <pb> → PbNode  (edge case: cambio carta a metà blocco versale)
 *   <lb> → LbNode  (edge case: lb fuori da <l>, raro ma presente)
 * Nodi testo e whitespace vengono ignorati.
 * @param {Element} lgNode
 * @returns {LgNode}
 */
function parseLg(lgNode) {
  const childEls = Array.from(lgNode.childNodes).filter(n => n.nodeType === 1);
  const hasL = childEls.some(n => n.localName === 'l');

  if (hasL) {
    // Struttura standard: <l n="X"> espliciti
    const verses = Array.from(lgNode.childNodes).flatMap(node => {
      if (node.nodeType !== 1) return [];
      switch (node.localName) {
        case 'l':  return [parseVerse(node)];
        case 'pb': return [parsePb(node)];
        case 'lb': return [parseLb(node)];
        default:   return [];
      }
    });
    return createLgNode(verses);
  } else {
    // Struttura con lb + milestone (es. <lg> dentro <p> senza <l>):
    // tutto il contenuto diventa un unico VerseNode implicito;
    // renderInterpLg Modalità A spezzerà ai milestone.
    return createLgNode([createVerseNode(0, parseNodes(lgNode.childNodes))]);
  }
}

/**
 * <p>content</p> → PNode
 * @param {Element} pNode
 * @returns {PNode}
 */
function parseP(pNode) {
  return createPNode(parseNodes(pNode.childNodes));
}

/**
 * <ab>content</ab> → PNode
 * <ab> (anonymous block) non ha un tipo dedicato nella struttura dati:
 * viene trattato come paragrafo. Il renderer li distingue se necessario
 * tramite il contesto (dentro <lg> o meno).
 * @param {Element} abNode
 * @returns {PNode}
 */
function parseAb(abNode) {
  return createPNode(parseNodes(abNode.childNodes));
}

/**
 * Parser principale: <div type="diplomatic"> → TeiNode[]
 * I figli attesi al primo livello sono: pb, p, lg, ab.
 * Nodi testo e whitespace al primo livello vengono ignorati.
 * @param {Element} divNode - <div> TEI radice della diplomatica
 * @returns {TeiNode[]}
 */
function parseDiplomatic(divNode) {
  return Array.from(divNode.childNodes).flatMap(node => {
    if (node.nodeType !== 1) return [];
    switch (node.localName) {
      case 'pb':        return [parsePb(node)];
      case 'p':         return [parseP(node)];
      case 'lg':        return [parseLg(node)];
      case 'ab':        return [parseAb(node)];
      case 'milestone': return [parseMilestone(node)];
      default:          return [];
    }
  });
}

/**
 * Parser per l'interpretativa (flusso manuale).
 * Strutturalmente identico a parseDiplomatic:
 * la distinzione semantica (normalizzazioni, smart quotes ecc.)
 * avviene nel renderer (Fase 3), non nel parser.
 * @param {Element} divNode - <div> TEI radice dell'interpretativa
 * @returns {TeiNode[]}
 */
function parseInterpretative(divNode) {
  return parseDiplomatic(divNode);
}


/* ═══════════════════════════════════════════════════════════════
   RENDERER TEI — Diplomatica (Fase 3 v8.0, Settimana 1)
   Funzioni pure: TeiNode + RenderContext → { html, ctx }.
   Il contesto è immutabile: nessun renderer muta l'input;
   ogni aggiornamento usa { ...ctx, campo: valore }.
   L'output HTML è identico a walkDiplomatic.
═══════════════════════════════════════════════════════════════ */

/**
 * Crea un contesto di rendering con valori di default.
 * @param {object} overrides - campi da sovrascrivere
 * @returns {RenderContext}
 */
function createRenderContext(overrides = {}) {
  return {
    currentSurface:   '',
    showSurfaceLabel: false,
    firstLbAfterPb:   false,
    firstLbAfterLg:   false,
    firstLbAfterP:    false,
    noteIndexMap:     {},
    zoneIndex:        {},
    surfaceIndex:     {},
    showLbMarkers:    true,
    ...overrides,
  };
}

/**
 * Risolve la label visiva (es. "41v") di un id facsimile.
 * Cerca prima in zoneIndex, poi in surfaceIndex.
 * @param {string}        facs - id facsimile (senza #)
 * @param {RenderContext} ctx
 * @returns {string} label o stringa vuota
 */
function facsLabel(facs, ctx) {
  if (!facs) return '';
  const z = ctx.zoneIndex[facs];
  if (z) return z.surfaceN || '';
  const s = ctx.surfaceIndex[facs];
  return s ? (s.surfaceN || '') : '';
}

/**
 * Accumulatore principale per la diplomatica.
 * Itera i nodi propagando il contesto aggiornato.
 * @param {TeiNode[]}     nodes
 * @param {RenderContext} ctx
 * @returns {{ html: string, ctx: RenderContext }}
 */
function renderDiplNodes(nodes, ctx) {
  let html = '';
  for (const node of nodes) {
    const res = renderDiplNode(node, ctx);
    html += res.html;
    ctx  = res.ctx;
  }
  return { html, ctx };
}

/**
 * Dispatcher per la diplomatica: delega al renderer del kind.
 * @param {TeiNode}       node
 * @param {RenderContext} ctx
 * @returns {{ html: string, ctx: RenderContext }}
 */
function renderDiplNode(node, ctx) {
  switch (node.kind) {
    case 'text':      return renderDiplText(node, ctx);
    case 'lb':        return renderDiplLb(node, ctx);
    case 'pb':        return renderDiplPb(node, ctx);
    case 'abbr':      return renderDiplAbbr(node, ctx);
    case 'orig':      return renderDiplOrig(node, ctx);
    case 'sic':       return renderDiplSic(node, ctx);
    case 'del':       return renderDiplDel(node, ctx);
    case 'subst':     return renderDiplSubst(node, ctx);
    case 'add':       return renderDiplAdd(node, ctx);
    case 'damage':    return renderDiplDamage(node, ctx);
    case 'unclear':   return renderDiplUnclear(node, ctx);
    case 'supplied':  return renderDiplSupplied(node, ctx);
    case 'hi':        return renderDiplNodes(node.content, ctx);
    case 'seg':       return renderDiplSeg(node, ctx);
    case 'p':         return renderDiplP(node, ctx);
    case 'lg':        return renderDiplLg(node, ctx);
    case 'note':
    case 'milestone': return { html: '', ctx };
    default:          return { html: '', ctx };
  }
}

/* ── Renderer per kind ────────────────────────────────────────── */

/** Testo puro con smart quotes. */
function renderDiplText(node, ctx) {
  return { html: smartQuotes(node.value), ctx };
}

/**
 * <lb> nella diplomatica: <br> + numero riga + label carta cliccabile.
 * Non usa firstLbAfter* (flag riservati all'interpretativa).
 */
function renderDiplLb(node, ctx) {
  const facs    = node.facs || ctx.currentSurface;
  const lbl     = facsLabel(facs, ctx);
  const showLbl = ctx.showSurfaceLabel && !!lbl;
  const facsBtn = showLbl ? lbFacsSpan(facs, lbl) : '';
  const newCtx  = showLbl ? { ...ctx, showSurfaceLabel: false } : ctx;
  const html    = `<br><span class="line-n" style="position:static;width:auto;`
                + `display:inline;margin-right:.4em">${node.n}</span>`
                + `<span class="lb-indent"></span>${facsBtn}`;
  return { html, ctx: newCtx };
}

/** <pb>: nessun output HTML, aggiorna la superficie corrente. */
function renderDiplPb(node, ctx) {
  return { html: '', ctx: { ...ctx, currentSurface: node.facs, showSurfaceLabel: true } };
}

/** <choice><abbr>/<expan>: span con titolo espansione. */
function renderDiplAbbr(node, ctx) {
  const title = node.expan ? `Espansione: ${smartQuotes(node.expan.trim())}` : '';
  return {
    html: `<span class="dipl-abbr" title="${title}">${smartQuotes(node.abbr)}</span>`,
    ctx,
  };
}

/** <choice><orig>/<reg>: span con contenuto orig e titolo regolarizzato. */
function renderDiplOrig(node, ctx) {
  const regText  = node.reg ? smartQuotes(node.reg.trim()) : '';
  const regTitle = node.reg !== undefined
    ? (regText ? 'Forma regolarizzata: ' + regText : 'Forma regolarizzata: omesso')
    : '';
  const res = renderDiplNodes(node.orig, ctx);
  return {
    html: `<span class="dipl-reg" title="${regTitle}">${res.html}</span>`,
    ctx:  res.ctx,
  };
}

/** <choice><sic>/<corr>: mostra la forma originale (diplomatica). */
function renderDiplSic(node, ctx) {
  return { html: smartQuotes(node.sic), ctx };
}

/** <del>: span rosso barrato. */
function renderDiplDel(node, ctx) {
  return {
    html: `<span class="dipl-del" title="Cancellato">${smartQuotes(node.text)}</span>`,
    ctx,
  };
}

/** <subst>: del senza barrato (opacità) + add. */
function renderDiplSubst(node, ctx) {
  const hDel = `<span class="dipl-subst-del" title="Sostituito per sovrascrittura">`
             + `${smartQuotes(node.del)}</span>`;
  const hAdd = `<span class="dipl-add" data-place="${node.place}" `
             + `title="Aggiunta (${node.place})">${smartQuotes(node.add)}</span>`;
  return { html: hDel + hAdd, ctx };
}

/** <add>: span verde con data-place; il contenuto è TeiNode[]. */
function renderDiplAdd(node, ctx) {
  const res = renderDiplNodes(node.content, ctx);
  return {
    html: `<span class="dipl-add" data-place="${node.place}" `
        + `title="Aggiunta (${node.place})">${res.html}</span>`,
    ctx:  res.ctx,
  };
}

/** <damage>: span ocra. */
function renderDiplDamage(node, ctx) {
  return {
    html: `<span class="dipl-damage" title="Danno materiale">${smartQuotes(node.text)}</span>`,
    ctx,
  };
}

/** <unclear>: span ocra lettura incerta. */
function renderDiplUnclear(node, ctx) {
  return {
    html: `<span class="dipl-unclear" title="Lettura incerta">${smartQuotes(node.text)}</span>`,
    ctx,
  };
}

/** <supplied>: span con titolo e reason opzionale. */
function renderDiplSupplied(node, ctx) {
  const reason = node.reason ? ': ' + node.reason : '';
  return {
    html: `<span class="dipl-supplied" title="Integrazione${reason}">`
        + `${smartQuotes(node.text)}</span>`,
    ctx,
  };
}

/**
 * <seg>: renderizza il contenuto testuale.
 * Ancora vuota (content assente o vuoto) → nessun output.
 */
function renderDiplSeg(node, ctx) {
  if (!node.content || !node.content.length) return { html: '', ctx };
  return renderDiplNodes(node.content, ctx);
}

/** <p>: paragrafo con classe tei-prose-p. */
function renderDiplP(node, ctx) {
  const res = renderDiplNodes(node.content, ctx);
  return { html: `<p class="tei-prose-p">${res.html}</p>`, ctx: res.ctx };
}

/**
 * <lg> nella diplomatica: trasparente.
 * I versi vengono appiattiti come flusso; lb e pb sono gestiti normalmente.
 */
function renderDiplLg(node, ctx) {
  // Verso proxy (n=0): <lg> senza <l>, nella diplomatica scorre come prosa piatta
  if (node.verses.length === 1 && node.verses[0].kind === 'verse' && node.verses[0].n === 0) {
    return renderDiplNodes(node.verses[0].content, ctx);
  }
  let html = '<div class="tei-lg">';
  for (const item of node.verses) {
    if (item.kind === 'verse') {
      const res = renderDiplNodes(item.content, ctx);
      html += teiLDiv(item.n, res.html);
      ctx = res.ctx;
    } else if (item.kind === 'pb') {
      ctx = renderDiplPb(item, ctx).ctx;
    } else if (item.kind === 'lb') {
      const res = renderDiplLb(item, ctx);
      html += res.html;
      ctx = res.ctx;
    }
  }
  html += '</div>';
  return { html, ctx };
}


/* ═══════════════════════════════════════════════════════════════
   RENDERER TEI — Interpretativa (Fase 3 v8.0, Settimana 2)
   Produce lo stesso output di walkInterpAuto / walkInterpManual.
   Differenze dalla diplomatica:
     • abbr  → expan    • orig  → reg     • sic   → corr
     • del   → ""       • subst → add     • lb    → | marker
     • lg    → <div class="tei-lg"> strutturato
═══════════════════════════════════════════════════════════════ */

/**
 * Accumulatore principale per l'interpretativa.
 * @param {TeiNode[]}     nodes
 * @param {RenderContext} ctx
 * @returns {{ html: string, ctx: RenderContext }}
 */
function renderInterpNodes(nodes, ctx) {
  let html = '';
  for (const node of nodes) {
    const res = renderInterpNode(node, ctx);
    html += res.html;
    ctx  = res.ctx;
  }
  return { html, ctx };
}

/**
 * Dispatcher per l'interpretativa.
 * @param {TeiNode}       node
 * @param {RenderContext} ctx
 * @returns {{ html: string, ctx: RenderContext }}
 */
function renderInterpNode(node, ctx) {
  switch (node.kind) {
    case 'text':      return renderInterpText(node, ctx);
    case 'lb':        return renderInterpLb(node, ctx);
    case 'pb':        return renderInterpPb(node, ctx);
    case 'abbr':      return renderInterpAbbr(node, ctx);
    case 'orig':      return renderInterpOrig(node, ctx);
    case 'sic':       return renderInterpSic(node, ctx);
    case 'del':       return renderInterpDel(node, ctx);
    case 'subst':     return renderInterpSubst(node, ctx);
    case 'add':       return renderInterpAdd(node, ctx);
    case 'damage':    return renderInterpDamage(node, ctx);
    case 'unclear':   return renderInterpUnclear(node, ctx);
    case 'supplied':  return renderInterpSupplied(node, ctx);
    case 'hi':        return renderInterpHi(node, ctx);
    case 'seg':       return renderInterpSeg(node, ctx);
    case 'p':         return renderInterpP(node, ctx);
    case 'lg':        return renderInterpLg(node, ctx);
    case 'note':
    case 'milestone': return { html: '', ctx };
    default:          return { html: '', ctx };
  }
}

/* ── Renderer per kind ────────────────────────────────────────── */

function renderInterpText(node, ctx) {
  return { html: smartQuotes(node.value), ctx };
}

/**
 * <lb> nell'interpretativa: separatore | con gestione dei flag.
 * Se firstLbAfterPb/Lg/P → sopprime il |, mostra solo il btn carta.
 */
function renderInterpLb(node, ctx) {
  const isFirst = ctx.firstLbAfterPb || ctx.firstLbAfterLg || ctx.firstLbAfterP;
  let newCtx = { ...ctx, firstLbAfterPb: false, firstLbAfterLg: false, firstLbAfterP: false };

  const facs    = node.facs || newCtx.currentSurface;
  const lbl     = facsLabel(facs, newCtx);
  const rawLbl  = lbl || (facs ? facs.replace(/^[^_]*_/, 'f.') : '');
  const showLbl = newCtx.showSurfaceLabel && (lbl || facs);
  const facsBtn = showLbl && rawLbl ? lbFacsSpan(facs, rawLbl) : '';
  if (showLbl) newCtx = { ...newCtx, showSurfaceLabel: false };

  if (isFirst) return { html: facsBtn, ctx: newCtx };
  return { html: lbMarkerSpan(node.break) + facsBtn, ctx: newCtx };
}

/** <pb> nell'interpretativa: aggiorna ctx e attiva firstLbAfterPb. */
function renderInterpPb(node, ctx) {
  return {
    html: '',
    ctx:  { ...ctx, currentSurface: node.facs, showSurfaceLabel: true, firstLbAfterPb: true },
  };
}

/** <choice><abbr/expan> → mostra l'espansione (non l'abbreviazione). */
function renderInterpAbbr(node, ctx) {
  return { html: smartQuotes(node.expan || node.abbr), ctx };
}

/** <choice><orig/reg> → mostra la forma regolarizzata. */
function renderInterpOrig(node, ctx) {
  return { html: smartQuotes(node.reg), ctx };
}

/** <choice><sic/corr> → mostra la correzione. */
function renderInterpSic(node, ctx) {
  return { html: smartQuotes(node.corr), ctx };
}

/** <del> → omesso nell'interpretativa. */
function renderInterpDel(node, ctx) {
  return { html: '', ctx };
}

/** <subst> → mostra solo la parte aggiunta. */
function renderInterpSubst(node, ctx) {
  return { html: smartQuotes(node.add), ctx };
}

/** <add> → mostra il contenuto (TeiNode[]). */
function renderInterpAdd(node, ctx) {
  return renderInterpNodes(node.content, ctx);
}

/** <damage> → †testo†. */
function renderInterpDamage(node, ctx) {
  return { html: `\u2020${smartQuotes(node.text)}\u2020`, ctx };
}

/** <unclear> → †testo†. */
function renderInterpUnclear(node, ctx) {
  return { html: `\u2020${smartQuotes(node.text)}\u2020`, ctx };
}

/** <supplied> → ⟨testo⟩. */
function renderInterpSupplied(node, ctx) {
  return { html: `\u27E8${smartQuotes(node.text)}\u27E9`, ctx };
}

/** <hi> → <em> o <strong>. */
function renderInterpHi(node, ctx) {
  const res  = renderInterpNodes(node.content, ctx);
  const html = node.rend === 'bold'
    ? `<strong>${res.html}</strong>`
    : `<em>${res.html}</em>`;
  return { html, ctx: res.ctx };
}

/**
 * <seg> → se ha xml:id con nota → superscript marker.
 *          altrimenti → renderizza il contenuto.
 */
function renderInterpSeg(node, ctx) {
  if (node.id) {
    const ni   = ctx.noteIndexMap[node.id] || '';
    const html = ni
      ? `<sup class="note-marker" data-seg-id="${node.id}">${ni}</sup>`
      : '';
    return { html, ctx };
  }
  if (!node.content || !node.content.length) return { html: '', ctx };
  return renderInterpNodes(node.content, ctx);
}

/** <p> / <ab> → paragrafo con firstLbAfterP attivato.
 *  Se il contenuto contiene milestone versali (es. <ab> con milestone
 *  fuori da <lg>) → tratta come blocco versale anziché prosa.
 *  La diplomatica non è toccata: renderDiplP non ha questa logica. */
function renderInterpP(node, ctx) {
  if (node.content.some(n => n.kind === 'milestone' && n.unit === 'verse')) {
    const lgProxy = createLgNode([createVerseNode(0, node.content)]);
    return renderInterpLg(lgProxy, ctx);
  }
  const res = renderInterpNodes(node.content, { ...ctx, firstLbAfterP: true });
  return { html: `<p class="tei-prose-p">${res.html}</p>`, ctx: res.ctx };
}

/**
 * <lg> → <div class="tei-lg"> strutturato con versi numerati.
 * Due modalità:
 *   A) TeiNode[] contiene MilestoneNode → split a ogni milestone
 *      (compatibile con buildLgBlock: <l> trasparenti)
 *   B) Nessun milestone → ogni VerseNode è un verso
 * In entrambi i casi il primo <lb> dell'intero blocco è soppresso.
 */
function renderInterpLg(node, ctx) {
  // Appiattisce il contenuto: verse→content, pb/lb diretti passano interi
  const allNodes = node.verses.flatMap(item =>
    item.kind === 'verse' ? item.content : [item]
  );

  const hasMilestones = allNodes.some(n => n.kind === 'milestone' && n.unit === 'verse');

  // Produce array di segmenti (array di TeiNode[])
  let rawSegs;
  if (hasMilestones) {
    rawSegs = [];
    let cur = [];
    for (const n of allNodes) {
      if (n.kind === 'milestone' && n.unit === 'verse') { rawSegs.push(cur); cur = []; }
      else cur.push(n);
    }
    if (cur.length) rawSegs.push(cur);
  } else {
    rawSegs = node.verses.filter(v => v.kind === 'verse').map(v => v.content);
    // pb/lb al livello di lg vanno in testa al primo segmento
    const outer = node.verses.filter(v => v.kind !== 'verse');
    if (outer.length && rawSegs.length) rawSegs[0] = [...outer, ...rawSegs[0]];
  }

  // Separa lb iniziali da ciascun segmento per il posizionamento retroattivo:
  // il | va alla FINE del verso precedente, non all'inizio del verso successivo.
  const segs = rawSegs.map(nodes => {
    const lbs  = [];
    const rest = [...nodes];
    while (rest.length && rest[0].kind === 'lb') lbs.push(rest.shift());
    return { lbs, rest };
  });

  let newCtx = ctx;
  let firstLbOverall = true;
  let pendingFacsBtn = ''; // label carta da preporre al segmento corrente
  const verseHtmls  = []; // un elemento per segmento

  segs.forEach(({ lbs, rest }) => {
    // Processa gli lb iniziali con posizionamento retroattivo
    for (const lb of lbs) {
      const facs    = lb.facs || newCtx.currentSurface;
      const lbl     = facsLabel(facs, newCtx);
      const rawLbl  = lbl || (facs ? facs.replace(/^[^_]*_/, 'f.') : '');
      const showLbl = newCtx.showSurfaceLabel && (lbl || facs);
      const facsBtn = showLbl && rawLbl ? lbFacsSpan(facs, rawLbl) : '';
      if (showLbl) newCtx = { ...newCtx, showSurfaceLabel: false };

      if (!firstLbOverall) {
        // Retroattivo: appende | alla FINE del verso precedente
        if (verseHtmls.length > 0)
          verseHtmls[verseHtmls.length - 1] += lbMarkerSpan(lb.break) + facsBtn;
      } else {
        // Primo lb: soppresso; la label carta va in testa al verso corrente
        firstLbOverall = false;
        pendingFacsBtn = facsBtn;
      }
    }

    // Rende il resto del segmento (lb interni = cambio riga dentro il verso)
    let segHtml = pendingFacsBtn;
    pendingFacsBtn = '';

    for (const n of rest) {
      if (n.kind === 'lb') {
        const facs    = n.facs || newCtx.currentSurface;
        const lbl     = facsLabel(facs, newCtx);
        const rawLbl  = lbl || (facs ? facs.replace(/^[^_]*_/, 'f.') : '');
        const showLbl = newCtx.showSurfaceLabel && (lbl || facs);
        const facsBtn = showLbl && rawLbl ? lbFacsSpan(facs, rawLbl) : '';
        if (showLbl) newCtx = { ...newCtx, showSurfaceLabel: false };
        if (!firstLbOverall) {
          segHtml += lbMarkerSpan(n.break) + facsBtn;
        } else {
          segHtml += facsBtn;
          firstLbOverall = false;
        }
      } else if (n.kind === 'pb') {
        newCtx = { ...newCtx, currentSurface: n.facs, showSurfaceLabel: true };
      } else {
        const res = renderInterpNode(n, newCtx);
        segHtml += res.html;
        newCtx = res.ctx;
      }
    }
    verseHtmls.push(segHtml);
  });

  // Costruisce i div versali, saltando i segmenti vuoti (es. prima di milestone)
  let html = '<div class="tei-lg">';
  verseHtmls.forEach((vh, i) => {
    if (vh.trim() || vh.includes('lb-marker') || vh.includes('lb-facs'))
      html += teiLDiv(i + 1, vh);
  });
  html += '</div>';

  return { html, ctx: { ...newCtx, firstLbAfterLg: true } };
}


/* ═══════════════════════════════════════════════════════════════
   CONTESTO DI RENDERING — Factory con dati documento (Fase 4 v8.0)
   createContext è il punto di ingresso per la Fase 5 (Integrazione):
   riceve i tre indici globali del documento e restituisce un contesto
   immutabile pronto per i renderer.
   Stato globale rimosso in v8.2 (Blocco C).
═══════════════════════════════════════════════════════════════ */

/**
 * Crea il contesto di rendering inizializzato con i dati del documento.
 * Wrapper esplicito su createRenderContext — API per la Fase 5.
 * @param {object} zoneIndex    - lookup zone facsimile { id → {surfaceN} }
 * @param {object} surfaceIndex - lookup superfici    { id → {surfaceN} }
 * @param {object} noteIndexMap - mappa seg-id → numero nota { id → n }
 * @returns {RenderContext}
 */
function createContext(zoneIndex, surfaceIndex, noteIndexMap) {
  if (typeof zoneIndex    !== 'object' || zoneIndex    === null)
    throw new Error('createContext: zoneIndex deve essere un object');
  if (typeof surfaceIndex !== 'object' || surfaceIndex === null)
    throw new Error('createContext: surfaceIndex deve essere un object');
  if (typeof noteIndexMap !== 'object' || noteIndexMap === null)
    throw new Error('createContext: noteIndexMap deve essere un object');
  return createRenderContext({ zoneIndex, surfaceIndex, noteIndexMap });
}

  assert('subst dipl → dipl-add',        substDiplHtml.includes('dipl-add'),       true);
  assert('subst dipl → testo add',       substDiplHtml.includes('nuovo'),          true);

  // Render interpretativa: mostra solo la parte aggiunta
  const substInterpHtml = renderInterpNode(substNodes[0], createRenderContext()).html;
  assert('subst interp → solo add',      substInterpHtml,            'nuovo');
  assert('subst interp → no del',        !substInterpHtml.includes('vecchio'), true);

  // ── 5. <add> con markup interno (choice dentro add) ──────────
  resetState();
  const addMarkupP = firstEl(tei(
    '<p><add place="above"><choice><abbr>q</abbr><expan>que</expan></choice> bien</add></p>'), 'p');
  const addMarkupNodes = parseNodes(addMarkupP.childNodes);
  assert('add con markup → kind add',             addMarkupNodes[0].kind,                 'add');
  assert('add con markup → content[0] abbr',      addMarkupNodes[0].content[0].kind,      'abbr');
  assert('add con markup → content[1] text',      addMarkupNodes[0].content[1].kind,      'text');
  const addDiplHtml = renderDiplNode(addMarkupNodes[0], createRenderContext()).html;
  assert('add markup dipl → dipl-add',            addDiplHtml.includes('dipl-add'),       true);
  assert('add markup dipl → abbr preservato',     addDiplHtml.includes('dipl-abbr'),      true);
  const addInterpHtml = renderInterpNode(addMarkupNodes[0], createRenderContext()).html;
  assert('add markup interp → expan',             addInterpHtml.includes('que'),          true);

  // ── 6. <damage> e <unclear> in sequenza ──────────────────────
  resetState();
  const damnP = firstEl(tei(
    '<p><damage>lac</damage> <unclear>x</unclear></p>'), 'p');
  const damnNodes = parseNodes(damnP.childNodes);
  assert('damage+unclear → 3 nodi', damnNodes.length === 3, true);
  assert('damage+unclear → [0] damage',  damnNodes[0].kind, 'damage');
  assert('damage+unclear → [1] space',   damnNodes[1].value, ' ');
  assert('damage+unclear → [2] unclear', damnNodes[2].kind, 'unclear');
  const damnDiplHtml = renderDiplNodes(damnNodes, createRenderContext()).html;
  assert('damage dipl → classe',   damnDiplHtml.includes('dipl-damage'),  true);
  assert('unclear dipl → classe',  damnDiplHtml.includes('dipl-unclear'), true);
  const damnInterpHtml = renderInterpNodes(damnNodes, createRenderContext()).html;
  assert('damage interp → †', damnInterpHtml.includes('\u2020'), true);

  // ── 7. Sequenza pb → lg → p (cambio carta tra strutture diverse) ─
  resetState();
  const mixDiv = firstEl(tei(
    '<div>' +
    '<pb facs="#A_1r"/>' +
    '<lg><l n="1"><lb n="1"/>verso</l></lg>' +
    '<pb facs="#B_2r"/>' +
    '<p><lb n="2"/>prosa dopo cambio carta</p>' +
    '</div>'), 'div');
  const mixNodes = parseDiplomatic(mixDiv);
  assert('pb→lg→pb→p → 4 nodi top', mixNodes.length === 4, true);
  assert('pb→lg→pb→p → [0] pb',     mixNodes[0].kind, 'pb');
  assert('pb→lg→pb→p → [1] lg',     mixNodes[1].kind, 'lg');
  assert('pb→lg→pb→p → [2] pb',     mixNodes[2].kind, 'pb');
  assert('pb→lg→pb→p → [3] p',      mixNodes[3].kind, 'p');
  const { html: mixHtml, ctx: mixCtx } = renderDiplNodes(mixNodes, createContext({}, {}, {}));
  assert('pb→lg→pb→p → surface aggiornata', mixCtx.currentSurface, 'B_2r');
  assert('pb→lg→pb→p → tei-lg presente',   mixHtml.includes('tei-lg'),              true);
  assert('pb→lg→pb→p → prosa presente',    mixHtml.includes('prosa dopo cambio'),   true);

  console.groupEnd();

  // ── TARGETCOL (lock-panel) ───────────────────────────────────────
  console.group('%c TEST TARGETCOL', 'font-weight:bold;font-size:13px');

  const _savedLock = lockedCol;

  lockedCol = null;
  assert('lock=null, src=L → R (comp. storico)', targetCol('L'), 'R');
  assert('lock=null, src=R → L (comp. storico)', targetCol('R'), 'L');

  lockedCol = 'L';
  assert('lock=L, src=L → R (cross-nav classico)',        targetCol('L'), 'R');
  assert('lock=L, src=R → R (switch interno R)',          targetCol('R'), 'R');

  lockedCol = 'R';
  assert('lock=R, src=R → L (cross-nav classico)',        targetCol('R'), 'L');
  assert('lock=R, src=L → L (switch interno L)',          targetCol('L'), 'L');

  // jumpToFacs: originCol null → fallback "R" (indipendente da lock)
  lockedCol = 'L';
  assert('jumpToFacs fallback null → R',  (null ? targetCol(null) : 'R'), 'R');

  lockedCol = _savedLock;

  console.groupEnd();

  const total = passed + failed;
  const color = failed === 0 ? '#2a6e3f' : '#8b1a1a';
  console.log(`%c\n══ RISULTATO: ${passed}/${total} test superati${failed > 0 ? ` — ${failed} FALLITI` : ' ✓'} ══`,
    `color:${color};font-weight:bold`);
}
</script>
  <!-- RESIZER DRAG LOGIC -->
  <script>
  (function () {
    const resizer  = document.getElementById('col-resizer');
    const colLeft  = document.getElementById('col-left');
    const mainEl   = document.querySelector('main');

    let dragging = false;
    let startX   = 0;
    let startW   = 0;

    function isActive() {
      return document.getElementById('main-body').classList.contains('layout-dual');
    }

    resizer.addEventListener('mousedown', function (e) {
      if (!isActive()) return;
      dragging = true;
      startX   = e.clientX;
      startW   = colLeft.getBoundingClientRect().width;
      resizer.classList.add('dragging');
      document.body.style.cursor    = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      const mainW = mainEl.getBoundingClientRect().width;
      const delta = e.clientX - startX;
      const newW  = Math.min(Math.max(startW + delta, mainW * 0.15), mainW * 0.85);
      const pct   = (newW / mainW * 100).toFixed(2) + '%';
      document.getElementById('main-body').style.setProperty('--col-left-w', pct);
    });

    document.addEventListener('mouseup', function () {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor     = '';
      document.body.style.userSelect = '';
    });

    /* Touch support */
    resizer.addEventListener('touchstart', function (e) {
      if (!isActive()) return;
      dragging = true;
      startX   = e.touches[0].clientX;
      startW   = colLeft.getBoundingClientRect().width;
      resizer.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      const mainW = mainEl.getBoundingClientRect().width;
      const delta = e.touches[0].clientX - startX;
      const newW  = Math.min(Math.max(startW + delta, mainW * 0.15), mainW * 0.85);
      const pct   = (newW / mainW * 100).toFixed(2) + '%';
      document.getElementById('main-body').style.setProperty('--col-left-w', pct);
    }, { passive: true });

    document.addEventListener('touchend', function () {
      dragging = false;
      resizer.classList.remove('dragging');
    });

    /* Reset alla 50/50 con doppio click */
    resizer.addEventListener('dblclick', function () {
      document.getElementById('main-body').style.removeProperty('--col-left-w');
    });
  })();
  </script>
