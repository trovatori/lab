<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edizione Diplomatica e Interpretativa · Filologia Romanza Digitale</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Mirador IIIF Viewer -->
  <script src="https://unpkg.com/mirador@3.3.0/dist/mirador.min.js"></script>

  <style>
    :root {
      --accent:       #a03f33;
      --accent-light: rgba(160,63,51,0.08);
      --bg:           #fbf9f4;
      --bg-panel:     #f5f3ee;
      --text:         #1a1410;
      --muted:        #6b7280;
      --border:       #e2ddd6;
      --dipl-add:     #2a6e3f;
      --dipl-del:     #8b1a1a;
      --dipl-damage:  #7a5c00;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "Source Sans 3", sans-serif; background: var(--bg); color: var(--text); margin: 0; }

    /* ── LAYOUT ── */
    .layout-single #col-right  { display: none !important; }
    .layout-single #col-left   { width: 100% !important; border-right: none !important; }
    .layout-single #col-resizer{ display: none !important; }
    .layout-dual   #col-right  { display: flex !important; }
    .layout-dual   #col-left   { width: var(--col-left-w, 50%); border-right: none !important; flex: none !important; }
    .layout-dual   #col-right  { flex: 1 !important; min-width: 15%; }
    .hidden { display: none !important; }

    /* ── RESIZER ── */
    #col-resizer {
      flex-shrink: 0;
      width: 12px;
      background: transparent;
      cursor: col-resize;
      position: relative;
      z-index: 20;
      user-select: none;
    }
    /* linea sottile centrale */
    #col-resizer::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      background: var(--border);
      transition: background 0.2s;
    }
    /* grip pill */
    #col-resizer::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 24px;
      background: #d1cdc8;
      border-radius: 99px;
      transition: background 0.2s, height 0.2s;
      z-index: 1;
    }
    #col-resizer:hover::before,
    #col-resizer.dragging::before {
      background: #bbb;
    }
    #col-resizer:hover::after,
    #col-resizer.dragging::after {
      background: #9e9e9e;
      height: 32px;
    }

    /* ── SIDEBAR ── */
    aside {
      width: 220px; flex-shrink: 0; background: var(--bg-panel);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      overflow: hidden; transition: width 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    aside.collapsed { width: 52px; }
    .sidebar-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

    /* Header sidebar con toggle */
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 12px 10px 16px; flex-shrink: 0; min-height: 48px; overflow: hidden;
    }
    aside.collapsed .sidebar-header { justify-content: center; padding: 14px 0 10px; }
    .sidebar-header-label {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.15em; color: var(--muted);
      white-space: nowrap; overflow: hidden; opacity: 1; transition: opacity 0.12s;
    }
    aside.collapsed .sidebar-header-label { opacity: 0; width: 0; pointer-events: none; }
    .sidebar-toggle-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px;
      border: none; background: transparent; cursor: pointer;
      color: var(--muted); display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s; padding: 0;
    }
    .sidebar-toggle-btn:hover { background: rgba(0,0,0,0.07); color: var(--text); }
    .sidebar-toggle-btn .material-symbols-outlined { font-size: 20px; }

    /* Sidebar tab — rimossa, toggle ora è interno */
    .sidebar-tab { display: none !important; }

    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 16px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); background: none; border: none; border-left: 3px solid transparent;
      cursor: pointer; transition: background 0.15s, color 0.15s, padding 0.22s;
      text-align: left; overflow: hidden; white-space: nowrap;
    }
    .nav-btn:hover  { background: rgba(0,0,0,0.04); color: var(--text); }
    .nav-btn.active { background: white; border-left-color: var(--accent); color: var(--accent); font-weight: 800; }
    .nav-btn .material-symbols-outlined { font-size: 18px; font-variation-settings: "FILL" 0,"wght" 300,"GRAD" 0,"opsz" 20; flex-shrink: 0; }
    .nav-label { white-space: nowrap; overflow: hidden; transition: opacity 0.12s; }
    aside.collapsed .nav-label { opacity: 0; width: 0; pointer-events: none; display: none; }
    aside.collapsed .nav-btn { justify-content: center; padding: 11px 0; gap: 0; }
    aside.collapsed .sep { margin: 8px 10px; }
    aside.collapsed #resp-info { display: none; }
    aside.collapsed .sidebar-footer { display: none; }
    /* Tooltip icone in modalità collassata */
    aside.collapsed .nav-btn[title]:hover::after {
      content: attr(title); position: fixed; left: 58px;
      background: #1a1410; color: white; font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 5px 10px; border-radius: 5px; white-space: nowrap;
      pointer-events: none; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }

    /* ── TABS ── */
    .tab-bar { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); background: white; min-height: 40px; overflow-x: auto; scrollbar-width: none; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab {
      padding: 0 14px; font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; white-space: nowrap; transition: all 0.15s; margin-bottom: -1px;
    }
    .tab:hover  { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    /* ── PIN / LOCK PANEL ──
       Pulsante puntina in fondo alla tab-bar. Mutuamente esclusivo tra i
       due pannelli. Quando un pannello è bloccato le sue tab sono disabilitate;
       i link cross-pane sull'altro pannello switchano l'altro pannello. */
    .pin-btn {
      margin-left: auto; padding: 0 12px; background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted);
      display: inline-flex; align-items: center;
      transition: color 0.15s, border-color 0.15s;
      margin-bottom: -1px;
    }
    .pin-btn:hover { color: var(--text); }
    .pin-btn .material-symbols-outlined { font-size: 18px; }
    .pin-btn.locked { color: var(--accent); border-bottom-color: var(--accent); }
    .pin-btn.locked .material-symbols-outlined {
      font-variation-settings: "FILL" 1;
      transform: rotate(-30deg);
    }
    .tab-bar.locked .tab { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
    .tab-bar.locked .tab.active { opacity: 0.85; }

    /* ── SCROLL ── */
    .scroll-pane {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color 0.3s;
    }
    .scroll-pane:hover {
      scrollbar-color: #d1cdc8 transparent;
    }
    .scroll-pane::-webkit-scrollbar { width: 6px; }
    .scroll-pane::-webkit-scrollbar-track { background: transparent; }
    .scroll-pane::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 99px;
      transition: background 0.3s;
    }
    .scroll-pane:hover::-webkit-scrollbar-thumb { background: #d1cdc8; }
    .scroll-pane::-webkit-scrollbar-thumb:hover { background: #b0aca6; }

    /* ── POPOVER NOTE FRONT ── */
    .fn-marker { font-family: "Source Sans 3", sans-serif; font-size: 0.65em; vertical-align: super; line-height: 1; color: var(--accent); font-weight: 700; cursor: pointer; }
    .fn-marker:hover { text-decoration: underline; }
    .fn-popover {
      position: fixed; z-index: 999;
      width: 340px; max-width: 90vw;
      background: white; border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      box-shadow: 0 4px 24px rgba(0,0,0,0.13);
      padding: 14px 16px 14px 14px;
      font-family: "Source Serif 4", serif;
      font-size: 0.9rem; line-height: 1.7; color: var(--text);
      opacity: 0; pointer-events: none;
      transition: opacity .12s;
    }
    .fn-popover.visible { opacity: 1; pointer-events: auto; }
    .fn-popover-head { font-family: "Source Sans 3", sans-serif; font-size: 8px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .fn-popover-close { position: absolute; top: 8px; right: 10px; font-size: 14px; color: var(--muted); cursor: pointer; background: none; border: none; line-height: 1; padding: 2px; }
    .fn-popover-close:hover { color: var(--accent); }

    /* ── PROSE (front-matter) ── */
    .prose { max-width: 720px; margin: 0 auto; padding: 52px 48px; }
    .prose h1 { font-family: "Source Sans 3", sans-serif; font-size: 1.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; margin: 0 0 2rem; color: var(--accent); }
    .prose h2 { font-family: "Source Sans 3", sans-serif; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 2.5rem 0 0.8rem; }
    .prose p  { font-family: "Source Serif 4", serif; font-size: 1.05rem; line-height: 1.85; margin: 0 0 1.2rem; }

    /* ── TESTO POETICO ── */
    .tei-content { font-family: "Source Serif 4", serif; font-size: 1.1rem; line-height: 1.9; padding: 48px 52px; }
    .tei-lg { margin-bottom: 1.5rem; }
    .tei-l  { position: relative; padding-left: 3.5rem; margin-bottom: 0.15rem; }
    .tei-l-text { display: block; }
    .lb-indent { display: none; } /* rimosso, non più usato */
    /* Run-over indent per righe diplomatiche (lb inline) */
    .lb-line { display: flex; align-items: baseline; margin-bottom: 0.05rem; }
    .lb-n    { flex-shrink: 0; width: 3rem; text-align: right; font-family: "Source Sans 3", sans-serif; font-size: 0.7rem; color: var(--accent); opacity: 0.55; user-select: none; margin-right: 0.5rem; }
    .lb-text { flex: 1; padding-left: 1.5rem; text-indent: -1.5rem; }
    .line-n { position: absolute; left: 0; width: 2.8rem; text-align: right; font-family: "Source Sans 3", sans-serif; font-size: 0.7rem; color: var(--accent); opacity: 0.55; user-select: none; top: 0.25em; }

    /* ── TESTO PROSA (dentro tei-content) ── */
    .tei-prose-p {
      font-family: "Source Serif 4", serif;
      font-size: 1.05rem;
      line-height: 1.85;
      margin: 0 0 1.2rem;
      padding-left: 0;
    }

    /* ── DIPLOMATICA ── */
    .dipl-abbr    { font-style: italic; border-bottom: 1px dotted #999; cursor: help; }
    .dipl-reg     { font-style: normal;  border-bottom: 1px dotted #999; cursor: help; }
    .dipl-add     { color: var(--dipl-add); font-size: 0.8em; vertical-align: super; line-height: 1; }
    .dipl-add::before { content: "↑"; font-size: 0.75em; opacity: 0.6; }
    .dipl-add[data-place="margin"]::before { content: "→"; }
    .dipl-del     { color: var(--dipl-del); text-decoration: line-through; text-decoration-color: var(--dipl-del); opacity: 0.7; }
    .dipl-subst-del { color: var(--dipl-del); opacity: 0.6; }
    .dipl-damage  { color: var(--dipl-damage); border-bottom: 2px dotted var(--dipl-damage); cursor: help; }
    .dipl-damage::before { content: "†"; margin-right: 1px; }
    .dipl-damage::after  { content: "†"; margin-left:  1px; }
    .dipl-unclear { color: var(--dipl-damage); border-bottom: 2px dotted var(--dipl-damage); cursor: help; }
    .dipl-unclear::before { content: "†"; margin-right: 1px; }
    .dipl-unclear::after  { content: "†"; margin-left:  1px; }
    .dipl-supplied { color: var(--dipl-damage); }
    .dipl-supplied::before { content: "⟨"; }
    .dipl-supplied::after  { content: "⟩"; }

    

    /* ── INTERPRETATIVA ── */
    /* ── COLLEGAMENTO FACSIMILE ── */
    .lb-facs {
      font-family: "Source Sans 3", sans-serif;
      font-size: 0.6em;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.55;
      cursor: pointer;
      vertical-align: super;
      line-height: 1;
      padding: 0 2px;
      border-radius: 2px;
      transition: opacity .15s, background .15s;
      user-select: none;
      letter-spacing: 0.02em;
      text-decoration: none;
      font-style: italic;
    }
    .lb-facs:hover {
      opacity: 1;
      background: var(--accent-light);
    }
    .lb-marker {
      color: var(--muted);
      font-size: 0.85em;
      font-family: "Source Sans 3", sans-serif;
      font-weight: 400;
      letter-spacing: 0;
      cursor: default;
      user-select: none;
    }
    .hide-lb-markers .lb-marker { display: none; }
    .lb-marker-tight {
      color: var(--muted);
      font-size: 0.85em;
      font-family: "Source Sans 3", sans-serif;
      font-weight: 400;
      letter-spacing: 0;
      cursor: default;
      user-select: none;
    }
    .hide-lb-markers .lb-marker-tight { display: none; }
    .interp-corr { border-bottom: 1px solid #aaa; cursor: help; }

    /* ── NOTE / SEG ── */
    .tei-seg { cursor: pointer; }
    .note-marker { font-family: "Source Sans 3", sans-serif; font-size: 0.65em; vertical-align: super; line-height: 1; color: var(--accent); font-weight: 700; cursor: pointer; }
    .note-marker.hl, .tei-seg.hl { background: var(--accent-light); border-radius: 2px; }
    .note-entry {
      border-left: 3px solid var(--accent); padding: 14px 18px; margin: 16px;
      background: rgba(132,139,144,0.116); font-family: "Source Serif 4", serif;
      font-size: 0.95rem; transition: background 0.15s; cursor: pointer;
    }
    .note-entry.hl { background: rgba(83,104,120,0.13); }
    .note-marker-label { font-family: "Source Sans 3", sans-serif; font-size: 0.7rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }

    /* ── TRADUZIONE ── */
    .tei-translation .tei-l { font-style: italic; color: #4b5563; }

    /* ── LEGENDA ── */
    .legend { font-family: "Source Sans 3", sans-serif; font-size: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: #fafaf8; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .legend-label { font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-right: 4px; }
    .legend-item  { display: flex; align-items: center; gap: 5px; color: var(--muted); }

    /* ── FACSIMILE / MIRADOR ── */
    .fac-wrapper { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .fac-toolbar {
      padding: 8px 14px; border-bottom: 1px solid var(--border); background: white;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 8px; flex-shrink: 0; z-index: 10;
    }
    .fac-mirador-container { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    /* ── Barra info IIIF ── */
    .fac-info-bar { flex-shrink: 0; border-bottom: 1px solid var(--border); background: #f7f5f0; font-size: 10px; color: var(--muted); overflow: hidden; }
    .fac-info-bar-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 14px; cursor: pointer; user-select: none; border-bottom: 1px solid transparent; transition: border-color .15s; }
    .fac-info-bar.open .fac-info-bar-header { border-bottom-color: var(--border); }
    .fac-info-bar-title { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .fac-info-bar-toggle { font-size: 11px; transition: transform .2s; display: inline-block; }
    .fac-info-bar.open .fac-info-bar-toggle { transform: rotate(180deg); }
    .fac-info-bar-body { max-height: 0; overflow: hidden; transition: max-height .25s cubic-bezier(0.4,0,0.2,1); }
    .fac-info-bar.open .fac-info-bar-body { max-height: 200px; overflow-y: auto; }
    .fac-info-bar-inner { padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 3px; }
    .fac-info-row { display: flex; gap: 6px; line-height: 1.4; }
    .fac-info-label { font-weight: 700; flex-shrink: 0; color: var(--muted); }
    .fac-info-value { color: var(--text); word-break: break-all; }
    .fac-info-value a { color: var(--accent); text-decoration: none; }
    .fac-info-value a:hover { text-decoration: underline; }
    /* Forza Mirador a riempire il contenitore e nasconde i pannelli laterali */
    .fac-mirador-container .mirador-viewer { width: 100% !important; height: 100% !important; }
    .fac-mirador-container [class*="WorkspaceControlPanel"],
    .fac-mirador-container [class*="WorkspaceMosaic"] > :not([class*="Window"]) { display: none !important; }

    .fac-btn  { padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; background: white; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
    .fac-btn .material-symbols-outlined { font-size: 16px; font-variation-settings: "FILL" 0,"wght" 300,"GRAD" 0,"opsz" 20; }
    .fac-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .fac-btn:disabled { opacity: 0.3; cursor: default; }
    .page-indicator { font-family: "Source Sans 3", sans-serif; font-size: 12px; font-weight: 800; color: var(--accent); min-width: 72px; text-align: center; }
    .fac-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #e8e6e0; flex-direction: column; gap: 12px; z-index: 5;
    }
    .fac-loading-text { font-family: "Source Sans 3", sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .fac-spinner {
      width: 28px; height: 28px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    
    /* Rimuove la linea blu superiore (border-top del Window di Mirador) */
    #mirador-mount-L > div,
    #mirador-mount-R > div,
    #mirador-mount-L [class*="Window"],
    #mirador-mount-R [class*="Window"],
    #mirador-mount-L [class*="window"],
    #mirador-mount-R [class*="window"] {
      border-top: none !important;
      outline: none !important;
      box-shadow: none !important;
    }
    /* Barra superiore finestra */
    #mirador-mount-L [class*="windowTopBar"],
    #mirador-mount-R [class*="windowTopBar"],
    #mirador-mount-L [class*="topBar"],
    #mirador-mount-R [class*="topBar"] {
      background-color: white !important;
      border-bottom: 1px solid var(--border) !important;
      box-shadow: none !important;
    }
    /* Posizionamento corretto mirador-canvas-nav (pulsanti zoom/frecce) */
    #mirador-mount-L .mirador-osd-container,
    #mirador-mount-R .mirador-osd-container { position: relative !important; }
    #mirador-mount-L .mirador-canvas-nav,
    #mirador-mount-R .mirador-canvas-nav {
      position: absolute !important;
      bottom: 8px !important;
      top: auto !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      height: auto !important;
      width: auto !important;
      background: transparent !important;
      box-shadow: none !important;
      display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important;
      align-items: center !important;
    }
    /* Pulsanti su una riga */
    #mirador-mount-L .mirador-canvas-nav button,
    #mirador-mount-R .mirador-canvas-nav button { padding: 4px !important; width: 32px !important; height: 32px !important; }
    #mirador-mount-L .mirador-canvas-nav .MuiSvgIcon-root,
    #mirador-mount-R .mirador-canvas-nav .MuiSvgIcon-root { font-size: 18px !important; width: 18px !important; height: 18px !important; }
    /* Figli diretti del canvas-nav: anche loro su una riga */
    #mirador-mount-L .mirador-canvas-nav > div,
    #mirador-mount-R .mirador-canvas-nav > div,
    #mirador-mount-L .mirador-osd-navigation,
    #mirador-mount-R .mirador-osd-navigation {
      display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important;
    }
    /* Nascondi contatore pagine (già nella fac-toolbar) */
    #mirador-mount-L .mirador-canvas-count, #mirador-mount-R .mirador-canvas-count,
    #mirador-mount-L .mirador-canvas-label,  #mirador-mount-R .mirador-canvas-label { display: none !important; }
    /* Sfondo bianco workspace */
    #mirador-mount-L .mirador-workspace-viewport,
    #mirador-mount-R .mirador-workspace-viewport { background: white !important; }
    /* Altezza canvas corretta */
    #mirador-mount-L .mirador10,
    #mirador-mount-R .mirador10 { height: 100% !important; }

    /* Colore pulsanti Mirador */

<script>
/* ═══════════════════════════════════════════════════════════════
   ed_diplomatica.html — Viewer TEI Filologia Romanza Digitale
   Versione: 5.1
   ─────────────────────────────────────────────────────────────
   ARCHITETTURA:
   Il viewer carica un file XML TEI (definito in TEI_FILE) e
   costruisce dinamicamente la visualizzazione in 5 pannelli:
     • Facsimile  — viewer IIIF via Mirador
     • Diplomatica — trascrizione diplomatica (walkDiplomatic)
     • Interpretativa — generata automaticamente da <diplomatic>
                        oppure letta da <interpretative> (manuale)
     • Testo      — edizione critica da <div type="edition">
     • Commento   — note di commento (commentData / noteIndexMap)
   ─────────────────────────────────────────────────────────────
   FUNZIONI CONDIVISE CON I CONVERTER:
   Le funzioni marcate [SYNC] hanno copie identiche o quasi in:
     • tei-converter-interp.html (converter interpretativa)
     • tei-converter-dipl.html   (converter diplomatica)
   Aggiornare tutte le copie in caso di modifiche.
═══════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════
   CONFIGURAZIONE
═══════════════════════════════════════════════════════════════ */
const TEI_FILE = "philippe.xml"; // ← modifica qui con il nome del file XML
const NS = "http://www.tei-c.org/ns/1.0";
let xml = null;

const PANE_ORDER  = ["facsimile","diplomatica","interpretativa","testo","commento","traduzione"];
const PANE_LABELS = {
  facsimile:      "Facsimile",
  diplomatica:    "Ed. Diplomatica",
  interpretativa: "Ed. Interpretativa",
  testo:          "Testo Critico",
  commento:       "Commento",
  traduzione:     "Traduzione",
};

let availablePanes = [];
const activePaneId = { L: null, R: null };

/* Stato Mirador per colonna */
const miradorState = {
  L: { viewer: null, pages: [], pageIdx: 0, initialized: false },
  R: { viewer: null, pages: [], pageIdx: 0, initialized: false },
};

let noteIndexMap = {};
let commentData  = [];

/* ═══════════════════════════════════════════════════════════════
   SMART QUOTES  — applicata a tutto il testo del progetto
═══════════════════════════════════════════════════════════════ */
function smartQuotes(str) {
  if (!str) return str;
  return str
    .replace(/(^|[\s(\[{>«])"([^"])/g, '$1\u201C$2')
    .replace(/"([\s.,;:!?)\]}>»]|$)/g,  '\u201D$1')
    .replace(/(\w)'(\w)/g,              '$1\u2019$2')
    .replace(/(^|[\s])'(\w)/g,          '$1\u2018$2')
    .replace(/'/g,                       '\u2019');
}

/* ═══════════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════════ */
/* ── Barra info IIIF ── */
function toggleFacInfoBar(col) {
  document.getElementById("fac-info-bar-" + col)?.classList.toggle("open");
}

function populateFacInfoBar(col, manifest, manifestUrl) {
  const el = document.getElementById("fac-info-inner-" + col);
  if (!el) return;
  function getLabel(v) {
    if (!v) return "";
    if (typeof v === "string") return v;
    if (Array.isArray(v)) return v[0] || "";
    if (typeof v === "object") { const vals = Object.values(v)[0]; return Array.isArray(vals) ? vals[0] : (vals || ""); }
    return "";
  }
  function getMeta(key) {
    const meta = manifest.metadata || [];
    for (const m of meta) {
      if (getLabel(m.label).toLowerCase().includes(key.toLowerCase())) return getLabel(m.value);
    }
    return "";
  }
  function asLink(val) {
    if (!val) return val;
    return /^https?:\/\//i.test(val) ? `<a href="${val}" target="_blank" rel="noopener">${val} ↗</a>` : val;
  }
  const repo   = getMeta("repository") || getMeta("biblioth") || getMeta("institution") || "";
  const date   = getMeta("date") || getMeta("data") || "";
  const shelf  = getMeta("shelfmark") || getMeta("segnatura") || getMeta("cote") || "";
  const source = getMeta("source images") || getMeta("source image") || "";
  const rows = [
    repo   && ["Istituzione",    repo],
    shelf  && ["Segnatura",      shelf],
    date   && ["Data",           date],
    source && ["Fonte immagini", asLink(source)],
    ["Manifest", `<a href="${manifestUrl}" target="_blank" rel="noopener">IIIF manifest ↗</a>`],
  ].filter(Boolean);
  el.innerHTML = rows.map(([lbl, val]) =>
    `<div class="fac-info-row"><span class="fac-info-label">${lbl}</span><span class="fac-info-value">${val}</span></div>`
  ).join("");
}

document.addEventListener("DOMContentLoaded", async () => {
  // sidebar-tab rimossa — toggle gestito da buildSidebar()
  const status = document.getElementById("loading-status");
  status.textContent = "Caricamento…";
  try {

    if (!r.ok) throw new Error(r.status);
    xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    buildAll();
    status.textContent = "Laboratorio di Filologia Romanza Digitale";
  } catch(e) {
    status.textContent = "Errore XML";
    console.error(e);

});

/* ═══════════════════════════════════════════════════════════════
   BUILD ALL
═══════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════
   HELPER HTML — Funzioni di costruzione elementi ricorrenti
   Eliminano la ripetizione di stringhe HTML identiche nei walker.
   Funzioni pure: nessun effetto collaterale.
═══════════════════════════════════════════════════════════════ */

/** Span separatore di riga | per l'interpretativa.
 *  @param {boolean} tight - true per break="no" (nessuno spazio) */
function lbMarkerSpan(tight = false) {
  return tight
    ? `<span class="lb-marker-tight" title="Cambio di riga (parola continua)">|</span>`
    : `<span class="lb-marker" title="Cambio di riga nel ms."> | </span>`;
}

/** Superscript cliccabile con il numero carta.
 *  @param {string} facs - id facsimile (senza #)
 *  @param {string} lbl  - label visivo (es. "41v") */
function lbFacsSpan(facs, lbl) {
  return `<sup class="lb-facs" onclick="jumpToFacs('${facs}',event)" title="c. ${lbl}">${lbl}</sup>`;
}

/** Div tei-l con numero verso e contenuto.
 *  @param {number} n       - numero verso (1-based)
 *  @param {string} content - HTML del testo del verso */
function teiLDiv(n, content) {
  return `<div class="tei-l"><span class="line-n">${n}</span><span class="tei-l-text">${content}</span></div>`;
}


let showLbMarkers = false;
function toggleLbMarkers() {
  showLbMarkers = !showLbMarkers;
  ['L','R'].forEach(col => {
    const el = document.getElementById(`interp-text-${col}`);
    if (el) el.classList.toggle('hide-lb-markers', !showLbMarkers);
    const btn = document.getElementById(`btn-lb-toggle-${col}`);
    if (btn) {
      btn.style.opacity    = showLbMarkers ? '1' : '0.45';
      btn.title            = showLbMarkers ? 'Nascondi separatori di riga' : 'Mostra separatori di riga ( | )';
    }
  });
}

/* Indice globale delle zone facsimile: { zoneId → { surfaceId, n, ulx, uly, lrx, lry } } */
let zoneIndex = {};

/* Indice globale delle superfici: { surfaceId → n } */
let surfaceIndex = {};

/**
 * Costruisce gli indici di lookup facsimile:
 *   zoneIndex[facs]    → { surfaceN, xmlId }   da <zone> nel TEI
 *   surfaceIndex[facs] → { surfaceN }           da <surface> nel TEI
 * Usati da walkDiplomatic e walkInterpAuto per mostrare il numero
 * carta cliccabile (lb-facs) accanto al primo <lb> di ogni carta.
 */
function buildZoneIndex() {
  zoneIndex = {};
  surfaceIndex = {};
  const surfaces = Array.from(xml.getElementsByTagNameNS(NS, "surface"));
  surfaces.forEach(surf => {
    const sid = surf.getAttribute("xml:id") || "";
    const surfN = surf.getAttribute("n") || "";
    if (sid) surfaceIndex[sid] = { surfaceN: surfN };
    Array.from(surf.getElementsByTagNameNS(NS, "zone")).forEach(zone => {
      const zid = zone.getAttribute("xml:id");
      if (!zid) return;
      const zoneN = zone.getAttribute("n") || surfN; // usa @n della zone, fallback su surface
      zoneIndex[zid] = {
        surfaceN: zoneN,
        surfaceId: sid,
        ulx: parseInt(zone.getAttribute("ulx") || 0),
        uly: parseInt(zone.getAttribute("uly") || 0),
        lrx: parseInt(zone.getAttribute("lrx") || 0),
        lry: parseInt(zone.getAttribute("lry") || 0),
      };
      // Aggiorna surfaceIndex con il primo n disponibile se non già impostato
      if (sid && !surfaceIndex[sid].surfaceN && zoneN)
        surfaceIndex[sid].surfaceN = zoneN;
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   NOTE FRONT (popover)
═══════════════════════════════════════════════════════════════ */

function renderFrontNoteContent(noteNode) {
  let h = "";
  noteNode.childNodes.forEach(c => {
    if (c.nodeType === 3) {
      h += smartQuotes(c.textContent);
    } else if (c.nodeType === 1) {
      if (c.localName === "em") {
        h += `<em>${smartQuotes(c.textContent)}</em>`;
      } else if (c.localName === "hi") {
        const r = c.getAttribute('rend') || '';
        const t = smartQuotes(c.textContent);
        h += r === 'bold' ? `<strong>${t}</strong>` : `<em>${t}</em>`;
      } else if (c.localName === "strong") {
        h += `<strong>${smartQuotes(c.textContent)}</strong>`;
      } else if (c.localName === "ref") {
        h += `<a href="${c.getAttribute('target')||'#'}" style="color:var(--accent2)">${smartQuotes(c.textContent)}</a>`;
      } else if (c.localName === "p") {
        h += `<p style="margin:0 0 0.5rem">${renderFrontNoteContent(c)}</p>`;
      } else {
        h += smartQuotes(c.textContent);
      }
    }
  });
  return h;
}

function buildFrontNotes() {
  // Processa tutte le sezioni front aggiungendo marker cliccabili
  const frontEl = xml.getElementsByTagNameNS(NS, "front")[0];
  if (!frontEl) return;

  // Per ogni div front già renderizzato, trova le <note> e sostituisce con marker
  ["introduction","editorialNote","criteria","witnesses","bibliography"].forEach(type => {
    const viewEl = document.getElementById("view-" + type);
    if (!viewEl) return;

    // Cerca le note nel div front corrispondente
    const divEls = Array.from(xml.getElementsByTagNameNS(NS,"div"))
      .filter(d => d.getAttribute("type") === type);
    if (!divEls.length) return;

    // Ri-renderizza il contenuto con i marker
    let noteIdx = 0;
    const divEl = divEls[0];
    let h = "";
    Array.from(divEl.getElementsByTagNameNS(NS,"p")).forEach(p => {
      let ph = "";
      p.childNodes.forEach(node => {
        if (node.nodeType === 3) {
          ph += smartQuotes(node.textContent);
        } else if (node.nodeType === 1) {
          if (node.localName === "note") {
            noteIdx++;
            const noteHtml = renderFrontNoteContent(node);
            ph += `<sup class="fn-marker note-marker" data-fn-html="${encodeURIComponent(noteHtml)}" data-fn-n="${noteIdx}" tabindex="0">${noteIdx}</sup>`;
          } else if (node.localName === "hi") {
            const r = node.getAttribute('rend') || '';
            const t = smartQuotes(node.textContent);
            ph += r === 'bold' ? `<strong>${t}</strong>` : `<em>${t}</em>`;
          } else if (node.localName === "em") {
            ph += `<em>${smartQuotes(node.textContent)}</em>`;
          } else if (node.localName === "strong") {
            ph += `<strong>${smartQuotes(node.textContent)}</strong>`;
          } else {
            ph += smartQuotes(node.textContent);
          }
        }
      });
      h += `<p>${ph}</p>`;
    });
    if (noteIdx > 0) viewEl.innerHTML = `<h1>${divEl.getElementsByTagNameNS(NS,"head")[0]?.textContent || ''}</h1>${h}`;
  });
}

function initFrontNotePopover() {
  const popover = document.getElementById("fn-popover");
  const body    = document.getElementById("fn-popover-body");
  const head    = document.getElementById("fn-popover-head");
  const close   = document.getElementById("fn-popover-close");
  let activeMarker = null;

  function showPopover(marker) {
    const html = decodeURIComponent(marker.dataset.fnHtml || "");
    const n    = marker.dataset.fnN || "";
    body.innerHTML = html;
    head.textContent = `Nota ${n}`;
    popover.classList.add("visible");
    activeMarker = marker;
    positionPopover(marker);
  }

  function hidePopover() {
    popover.classList.remove("visible");
    activeMarker = null;
  }

  function positionPopover(marker) {
    const rect = marker.getBoundingClientRect();
    const pw   = popover.offsetWidth  || 340;
    const ph   = popover.offsetHeight || 120;
    const vw   = window.innerWidth;
    const vh   = window.innerHeight;
    const gap  = 8;

    // Posizione orizzontale: allineato al marker, corretto se esce dallo schermo
    let left = rect.left;
    if (left + pw > vw - 8) left = vw - pw - 8;
    if (left < 8) left = 8;

    // Posizione verticale: sotto il marker se c'è spazio, altrimenti sopra
    let top;
    if (rect.bottom + gap + ph < vh) {
      top = rect.bottom + gap;
    } else {
      top = rect.top - gap - ph;
    }

    popover.style.left = left + "px";
    popover.style.top  = Math.max(8, top) + "px";
  }

  // Click sul marker
  document.body.addEventListener("click", e => {
    const marker = e.target.closest(".fn-marker");
    if (marker) {
      e.stopPropagation();
      if (activeMarker === marker) { hidePopover(); return; }
      showPopover(marker);
      return;
    }
    if (!e.target.closest("#fn-popover")) hidePopover();
  });

  // Pulsante chiudi
  close.addEventListener("click", e => { e.stopPropagation(); hidePopover(); });

  // Riposiziona al resize
  window.addEventListener("resize", () => {
    if (activeMarker) positionPopover(activeMarker);
  });
}

function buildAll() {
  buildZoneIndex();
  buildHeader();
  buildFrontMatter();
  buildFacsimileContainers();
  buildDiplomatica();
  buildInterpretativa();
  buildTesto();
  discoverPanes();
  buildSidebar();
  buildCommento();
  buildTraduzione();
  buildTabs();
  bindTestoEvents(); // listener note: attivo sempre, indipendentemente dal testo critico
  buildFrontNotes();
  initFrontNotePopover();
  const first = ["introduction","editorialNote","criteria","witnesses"]
    .find(t => document.getElementById("view-"+t)?.dataset.present);
  selectView(first || "edition");
}

/* ═══════════════════════════════════════════════════════════════
   UTILITY — Funzioni di supporto generale
═══════════════════════════════════════════════════════════════ */
function getDiv(type) {
  return Array.from(xml.getElementsByTagNameNS(NS,"div"))
    .find(d => d.getAttribute("type") === type) || null;
}
function colOf(el) {
  if (el.closest("#col-left"))  return "L";
  if (el.closest("#col-right")) return "R";
  return null;
}
function otherCol(col) { return col === "L" ? "R" : "L"; }

/* Stato del lock-panel: 'L', 'R', o null.
   Quando una colonna è bloccata le navigazioni cross-pane non la
   modificano: il bersaglio diventa sempre l'altra colonna. */
let lockedCol = null;

/* Sceglie la colonna di destinazione per una navigazione cross-pane.
   Con lockedCol === null è bit-per-bit equivalente a otherCol(srcCol),
   preservando il comportamento storico intatto. */
function targetCol(srcCol) {
  if (lockedCol) return otherCol(lockedCol);
  return otherCol(srcCol);
}
function ensurePaneVisible(col, paneId) {
  if (document.getElementById("main-body").classList.contains("layout-single")) {
    // In layout single: non cambiare vista, il pannello è già visibile
  }
  if (activePaneId[col] !== paneId) switchPane(col, paneId);
}
function clearHighlights() {
  document.querySelectorAll(".note-marker.hl,.tei-seg.hl,.note-entry.hl")
    .forEach(el => el.classList.remove("hl"));
}

/* ═══════════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════════ */
function buildHeader() {
  const author = xml.getElementsByTagNameNS(NS,"author")[0]?.textContent?.trim() || "";
  const title  = xml.getElementsByTagNameNS(NS,"title")[0]?.textContent?.trim()  || "";
  const resp   = xml.getElementsByTagNameNS(NS,"name")[0]?.textContent?.trim()   || "";

/* ═══════════════════════════════════════════════════════════════
   FRONT MATTER (supporto prosa piena)
═══════════════════════════════════════════════════════════════ */
const FRONT_LABELS = { introduction:"Introduzione", editorialNote:"Nota al testo", criteria:"Criteri editoriali" };

function buildFrontMatter() {
  const divs = Array.from(xml.getElementsByTagNameNS(NS,"div"));

  Object.keys(FRONT_LABELS).forEach(type => {
    const d  = divs.find(x => x.getAttribute("type") === type);
    const el = document.getElementById("view-" + type);
    if (!el || !d) return;
    el.innerHTML = `<h1>${smartQuotes(d.getElementsByTagNameNS(NS,"head")[0]?.textContent || FRONT_LABELS[type])}</h1>` +
                   formatTEIDiv(d);
    el.dataset.present = "1";
  });

  // Testimoni
  const witnesses = Array.from(xml.getElementsByTagNameNS(NS,"witness"));
  const witEl = document.getElementById("view-witnesses");
  if (witnesses.length > 0 && witEl) {
    let h = '<h1>Testimoni</h1><div style="margin-top:2rem">';
    witnesses.forEach(w => {
      h += `<div class="wit-entry"><span class="wit-id">${w.getAttribute("xml:id")}</span><span class="wit-name">${smartQuotes(w.textContent.trim())}</span></div>`;
    });
    witEl.innerHTML = h + "</div>";
    witEl.dataset.present = "1";
  }
}

/**
 * Renderizza ricorsivamente i nodi di un div TEI in HTML.
 * Gestisce <p>, <head>, testo semplice, e applica smartQuotes a tutto.
 */
function formatTEIDiv(node) {
  let h = "";
  node.childNodes.forEach(c => {
    if (c.localName === "head") return;
    if (c.localName === "p") {
      h += `<p>${smartQuotes(renderInlineXML(c))}</p>`;
    } else if (c.localName === "div") {
      const head = c.getElementsByTagNameNS(NS,"head")[0];
      if (head) h += `<h2>${smartQuotes(head.textContent)}</h2>`;
      h += formatTEIDiv(c);
    } else if (c.nodeType === 3 && c.textContent.trim()) {
      h += `<p>${smartQuotes(c.textContent.trim())}</p>`;
    }
  });
  return h;
}

/**
 * Renderizza l'interno di un nodo inline (per <p> con markup misto)
 */
function renderInlineXML(node) {
  let h = "";
  node.childNodes.forEach(c => {
    if (c.nodeType === 3) {
      h += smartQuotes(c.textContent);
    } else if (c.nodeType === 1) {
      if (c.localName === "em") {
        h += `<em>${smartQuotes(c.textContent)}</em>`;
      } else if (c.localName === "hi") {
        const r = c.getAttribute('rend') || '';
        const t = smartQuotes(c.textContent);
        h += r === 'bold' ? `<strong>${t}</strong>` : `<em>${t}</em>`;
      } else if (c.localName === "strong") {
        h += `<strong>${c.textContent}</strong>`;
      } else if (c.localName === "ref") {
        h += `<a href="${c.getAttribute('target')||'#'}">${c.textContent}</a>`;
      } else {
        h += c.textContent;
      }
    }
  });
  return h;
}

/* ═══════════════════════════════════════════════════════════════
   DISCOVER PANES
═══════════════════════════════════════════════════════════════ */
function discoverPanes() {
  const checks = {
    facsimile:      () => xml.getElementsByTagNameNS(NS,"surface").length > 0,
    diplomatica:    () => !!getDiv("diplomatic"),
    interpretativa: () => !!getDiv("interpretative"),
    testo:          () => { const d = getDiv("edition"); return d ? (d.getElementsByTagNameNS(NS,"l").length > 0 || d.getElementsByTagNameNS(NS,"p").length > 0 || d.textContent.trim().length > 0) : false; },
    commento:       () => {
      const e = getDiv("edition");
      if (e && e.getElementsByTagNameNS(NS,"note").length > 0) return true;
      const d = getDiv("diplomatic");
      if (d && d.getElementsByTagNameNS(NS,"note").length > 0) return true;
      const i = getDiv("interpretative");
      return i ? i.getElementsByTagNameNS(NS,"note").length > 0 : false;
    },
    traduzione:     () => !!getDiv("translation"),
  };
  availablePanes = PANE_ORDER.filter(p => checks[p]?.());
}

   TABS
═══════════════════════════════════════════════════════════════ */
function buildTabs() {

      `<button class="tab" data-pane="${p}" data-col="${col}"
               onclick="switchPane('${col}','${p}')">${PANE_LABELS[p]}</button>`
    ).join("");

    h += `<button class="pin-btn" data-col="${col}" onclick="toggleLock('${col}')"
            title="Blocca pannello" aria-label="Blocca pannello">

          </button>`;
    document.getElementById("tabs-"+col).innerHTML = h;

  activePaneId.R = availablePanes[1] || availablePanes[0] || null;

/* Aggiorna l'UI in base a lockedCol. Idempotente. */
function applyLockUI() {
  ["L","R"].forEach(col => {
    const bar = document.getElementById("tabs-"+col);
    const pin = bar?.querySelector(".pin-btn");
    if (!bar || !pin) return;
    const isLocked = lockedCol === col;
    bar.classList.toggle("locked", isLocked);
    pin.classList.toggle("locked", isLocked);
    pin.title = isLocked ? "Sblocca pannello" : "Blocca pannello";
  });
}

/* Toggle lock su una colonna. Mutuamente esclusivo. */
function toggleLock(col) {
  lockedCol = lockedCol === col ? null : col;
  applyLockUI();
}

/* ═══════════════════════════════════════════════════════════════
   VIEW SWITCHING
═══════════════════════════════════════════════════════════════ */
function selectView(viewId) {
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("nav-"+viewId)?.classList.add("active");

  // Auto-collasso sidebar in modalità edizione
  const sidebar   = document.getElementById("main-sidebar");
  const toggleBtn = document.getElementById("sidebar-toggle");
  if (viewId === "edition") {
    sidebar.classList.add("collapsed");
    if (toggleBtn) {
      toggleBtn.querySelector(".material-symbols-outlined").textContent = "right_panel_close";
      toggleBtn.title = "Espandi menu";
    }
  } else {
    sidebar.classList.remove("collapsed");
    if (toggleBtn) {
      toggleBtn.querySelector(".material-symbols-outlined").textContent = "left_panel_close";
      toggleBtn.title = "Comprimi menu";
    }
  }

  const body    = document.getElementById("main-body");
  const scrollL = document.getElementById("scroll-L");

  if (viewId === "edition") {
    body.classList.replace("layout-single","layout-dual");
    document.getElementById("tabs-L").classList.remove("hidden");
    document.getElementById("tabs-R").classList.remove("hidden");
    hideFrontViews();
    document.getElementById("panes-L").classList.remove("hidden");
    scrollL.style.overflow = "hidden";
    scrollL.style.height   = "100%";
    switchPane("L", activePaneId.L);
    switchPane("R", activePaneId.R);
  } else {
    body.classList.replace("layout-dual","layout-single");
    document.getElementById("tabs-L").classList.add("hidden");
    document.getElementById("panes-L").classList.add("hidden");
    scrollL.style.overflow = "";
    scrollL.style.height   = "";
    hideFrontViews();
    // Esce dalla modalità edizione: rilascia il lock (ha senso solo in layout-dual)
    if (lockedCol !== null) { lockedCol = null; applyLockUI(); }
    document.getElementById("view-"+viewId)?.classList.remove("hidden");
  }
}

function hideFrontViews() {
  ["introduction","editorialNote","criteria","witnesses"]
    .forEach(id => document.getElementById("view-"+id)?.classList.add("hidden"));
}

/* ═══════════════════════════════════════════════════════════════
   SWITCH PANE
═══════════════════════════════════════════════════════════════ */
function switchPane(col, paneId) {
  if (!paneId) return;
  activePaneId[col] = paneId;
  document.querySelectorAll(`[data-col="${col}"].tab`)
    .forEach(t => t.classList.toggle("active", t.dataset.pane === paneId));
  ["facsimile","diplomatica","interpretativa","testo","commento","traduzione"].forEach(p => {
    document.getElementById(`out-${p}-${col}`)?.classList.toggle("hidden", p !== paneId);
  });
  if (paneId === "facsimile") {
    initMiradorForCol(col);
    // Rimuove il background opaco di mirador-canvas-nav ogni volta che il pannello è visibile
    fixMiradorCanvasNav(col);
  }
}

/**
 * Imposta background trasparente su mirador-canvas-nav.
 * Viene chiamata ogni volta che il pannello facsimile diventa visibile.
 * Usa polling perché Mirador monta l'elemento in modo asincrono.
 */
function fixMiradorCanvasNav(col) {
  const container = document.getElementById(MIRADOR_EL[col]);
  if (!container) return;
  let attempts = 0;
  const interval = setInterval(() => {
    attempts++;
    // Assicura posizionamento corretto del contenitore OSD
    container.querySelectorAll(".mirador-osd-container").forEach(el => {
      el.style.setProperty("position", "relative", "important");
    });
    // Ancora i pulsanti in basso al centro, sfondo trasparente
    container.querySelectorAll(".mirador-canvas-nav").forEach(el => {
      el.style.setProperty("background", "transparent", "important");
      el.style.setProperty("background-color", "transparent", "important");
      el.style.setProperty("box-shadow", "none", "important");
      el.style.setProperty("position", "absolute", "important");
      el.style.setProperty("bottom", "8px", "important");
      el.style.setProperty("top", "auto", "important");
      el.style.setProperty("left", "50%", "important");
      el.style.setProperty("transform", "translateX(-50%)", "important");
      el.style.setProperty("height", "auto", "important");
      el.style.setProperty("width", "auto", "important");
    });
    if (attempts >= 20) clearInterval(interval); // smette dopo 4 secondi
  }, 200);
}

/* ═══════════════════════════════════════════════════════════════
   WALK NODES — dispatcher generico
═══════════════════════════════════════════════════════════════ */
function walkNodes(nodeList, handlers) {
  let out = "";
  Array.from(nodeList).forEach(node => {
    if (node.nodeType === 3) {
      out += handlers.text ? handlers.text(node) : node.textContent;
    } else if (node.nodeType === 1) {
      const fn = handlers[node.localName] || handlers.default;
      out += fn ? fn(node) : node.textContent;
    }
  });
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   buildLgHtml — gestisce sia versi (<lg>/<l>) che prosa (<p>)
═══════════════════════════════════════════════════════════════ */
/**
 * Itera i figli diretti di un <div> TEI e applica walkFn a ciascuno.
 * Gestisce <p>, <ab> e testo libero. Punto di ingresso per tutti
 * i walker che elaborano un intero div (diplomatica, interpretativa).
 * @param {Element} div    - elemento <div> TEI da elaborare
 * @param {Function} walkFn - walker da applicare (es. walkDiplomatic)
 * @returns {string} HTML completo del div
 */
function buildLgHtml(div, walkFn) {
  let h = "";

  // Prosa: se il div contiene <p> o <ab> (senza <lg>/<l>)
  const hasParagraphs = div.getElementsByTagNameNS(NS,"p").length > 0
                      || div.getElementsByTagNameNS(NS,"ab").length > 0;
  const hasVerses     = div.getElementsByTagNameNS(NS,"l").length > 0;

  if (hasParagraphs && !hasVerses) {
    Array.from(div.childNodes).forEach(node => {
      if (node.nodeType === 1 && node.localName === "p") {
        h += `<p class="tei-prose-p">${walkFn(node)}</p>`;
      } else if (node.nodeType === 1 && node.localName === "ab") {
        h += walkFn(node);
      } else if (node.nodeType === 1 && node.localName === "div") {
        const head = node.getElementsByTagNameNS(NS,"head")[0];
        if (head) h += `<h2 style="font-family:'Source Sans 3',sans-serif;font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin:2rem 0 0.6rem">${smartQuotes(head.textContent)}</h2>`;
        h += buildLgHtml(node, walkFn);
      }
    });
    return h;
  }

  // Testo poetico: <lg>/<l>
  Array.from(div.getElementsByTagNameNS(NS,"lg")).forEach(lg => {
    if (lg.parentNode.localName === "lg") return;
    h += '<div class="tei-lg">';
    Array.from(lg.getElementsByTagNameNS(NS,"l")).forEach(l => {
      h += teiLDiv(l.getAttribute("n")||"", walkFn(l));
    });
    h += "</div>";
  });

  // Fallback: <l> direttamente nel div
  if (!h) {
    Array.from(div.getElementsByTagNameNS(NS,"l")).forEach(l => {
      h += `<div class="tei-lg"><div class="tei-l"><span class="line-n">${l.getAttribute("n")||""}</span><span class="tei-l-text">${walkFn(l)}</span></div></div>`;
    });
  }
  return h;
}

/**
 * Post-processing: ristruttura le righe inline (br + .line-n) in div block
 * con hanging indent per il run-over delle righe lunghe.
 * Trasforma: <br><span class="line-n">N</span>testo
 * In:        <div class="lb-line"><span class="lb-n">N</span><span class="lb-text">testo</span></div>
 */
function wrapLbLines(container) {
  // Opera solo su elementi che contengono <br> (struttura prose con lb)
  // Non tocca i .tei-lg che usano già div.tei-l
  const nodes = Array.from(container.childNodes);
  nodes.forEach(node => {
    if (node.nodeType === 1 && node.classList.contains('tei-content')) {
      // Trova tutti i <br> con .line-n inline
      const brs = Array.from(node.querySelectorAll('br'));
      brs.forEach(br => {
        const lineN = br.nextSibling;
        if (!lineN || lineN.nodeType !== 1 || !lineN.classList.contains('line-n')) return;
        // Raccoglie tutti i nodi dopo .line-n fino al prossimo <br> o fine
        const lineNodes = [];
        let cur = lineN.nextSibling;
        while (cur && !(cur.nodeName === 'BR')) {
          lineNodes.push(cur);
          cur = cur.nextSibling;
        }
        // Costruisce il div
        const div = document.createElement('div');
        div.className = 'lb-line';
        const nSpan = document.createElement('span');
        nSpan.className = 'lb-n';
        nSpan.innerHTML = lineN.innerHTML;
        const textSpan = document.createElement('span');
        textSpan.className = 'lb-text';
        lineNodes.forEach(n => textSpan.appendChild(n.cloneNode(true)));
        div.appendChild(nSpan);
        div.appendChild(textSpan);
        // Inserisce il div al posto del br + line-n + nodi
        br.parentNode.insertBefore(div, br);
        br.remove();
        lineN.remove();
        lineNodes.forEach(n => n.remove());
      });
    }
  });
}

/* ═══════════════════════════════════════════════════════════════
   DIPLOMATICA
═══════════════════════════════════════════════════════════════ */
function buildDiplomatica() {
  const div = getDiv("diplomatic");
  if (!div) return;
  // Fase 5: nuovo stack Parser + Renderer (sostituisce buildLgHtml + walkDiplomatic)
  const diplNodes    = parseDiplomatic(div);
  const diplCtx      = createContext(zoneIndex, surfaceIndex, noteIndexMap);
  const { html }     = renderDiplNodes(diplNodes, diplCtx);

  // Rileva elementi presenti nel TEI
  const hasAbbr     = div.getElementsByTagNameNS(NS,"abbr").length > 0 ||
                      Array.from(div.getElementsByTagNameNS(NS,"choice"))
                        .some(c => c.getElementsByTagNameNS(NS,"abbr").length > 0);
  const hasAdd      = div.getElementsByTagNameNS(NS,"add").length > 0;
  const hasDel      = div.getElementsByTagNameNS(NS,"del").length > 0;
  const hasSubst    = div.getElementsByTagNameNS(NS,"subst").length > 0;
  const hasDamage   = div.getElementsByTagNameNS(NS,"damage").length > 0 ||
                      div.getElementsByTagNameNS(NS,"unclear").length > 0;
  const hasSupplied = div.getElementsByTagNameNS(NS,"supplied").length > 0;

  const hasReg = div.getElementsByTagNameNS(NS,"orig").length > 0;
  const items = [];
  if (hasAbbr)     items.push(`<span class="legend-item"><span style="font-style:italic;border-bottom:1px dotted #999;font-family:'Source Serif 4',serif">abbr̃</span>&nbsp;Abbreviazione</span>`);
  if (hasReg)      items.push(`<span class="legend-item"><span style="font-style:normal;border-bottom:1px dotted #999;font-family:'Source Serif 4',serif">orig</span>&nbsp;Forma originale</span>`);
  if (hasAdd)      items.push(`<span class="legend-item"><span style="color:var(--dipl-add);font-size:0.85em;vertical-align:super">↑add</span>&nbsp;Aggiunta</span>`);
  if (hasDel)      items.push(`<span class="legend-item"><span style="color:var(--dipl-del);text-decoration:line-through">del</span>&nbsp;Cancellatura</span>`);
  if (hasSubst)    items.push(`<span class="legend-item"><span style="color:var(--dipl-del);opacity:0.6">sub</span>&nbsp;Sostituzione per sovrascrittura</span>`);
  if (hasDamage)   items.push(`<span class="legend-item"><span style="color:var(--dipl-damage)">†&nbsp;†</span>&nbsp;Ms. incomprensibile, danneggiato o lacunoso</span>`);
  if (hasSupplied) items.push(`<span class="legend-item"><span style="color:var(--dipl-damage)">⟨int⟩</span>&nbsp;Integrazione</span>`);

  const legendHtml = items.length > 0
    ? `<span class="legend-label">Legenda</span>${items.join("")}`
    : "";

  ["L","R"].forEach(col => {
    document.getElementById(`dipl-text-${col}`).innerHTML = html;
    wrapLbLines(document.getElementById(`dipl-text-${col}`));
    const legendEl = document.getElementById(`legend-dipl-${col}`);
    legendEl.innerHTML = legendHtml;
    legendEl.style.display = items.length > 0 ? "" : "none";
  });
}

/* ── HELPER: cerca solo tra figli diretti (non discendenti) ── */
/* ── walkDiplomatic rimosso in Fase 6 — sostituito da renderDiplNodes ── */

/**
 * Cerca solo tra i figli diretti di un nodo (non i discendenti).
 * Necessario per evitare che getElementsByTagNameNS trovi elementi
 * annidati dentro <choice> o <subst> — problema tipico con strutture
 * come <choice><orig><choice>…</choice></orig><reg>…</reg></choice>.
 * [SYNC] Funzione identica in tei-converter-interp.html
 */
function directChild(node, localName) {
  return Array.from(node.childNodes).find(c => c.nodeType === 1 && c.localName === localName) || null;
}


/* ═══════════════════════════════════════════════════════════════
   WALKER — INTERPRETATIVA AUTOMATICA
   Tre percorsi in base alla struttura del TEI diplomatico:
   1. buildInterpAutoWithMilestones — tutto il testo è in versi
      (<milestone unit="verse"> fuori da <lg>): produce versi
      numerati da <milestone>.
   2. walkInterpAuto + buildLgBlock — prosa con blocchi versali
      delimitati da <lg>: la prosa scorre normalmente, i <lg>
      vengono resi come blocchi versali indentati.
   3. walkInterpAuto puro — prosa senza nessun verso.
   [SYNC] Logica condivisa con tei-converter-interp.html
═══════════════════════════════════════════════════════════════ */
/**
 * Costruisce l'HTML di un blocco versale da un array di segmenti testuali.
 * Ogni segmento diventa un <div class="tei-l"> con numero verso.
 * Funzione pura — nessun effetto collaterale su stato globale.
 * Usata da buildLgBlock e buildInterpAutoWithMilestones.
 * @param {string[]} segments - array di stringhe HTML, una per verso
 * @returns {string} HTML del blocco <div class="tei-lg">
 */
function buildLgHtmlFromSegments(segments) {
  if (!segments.length) return '';
  let h = '<div class="tei-lg">';
  segments.forEach((seg, i) => {
    if (seg) h += teiLDiv(i+1, seg);
  });
  h += '</div>';
  return h;
}



/**
 * Popola noteIndexMap e commentData leggendo <note> e <seg xml:id>
 * dal <div type="diplomatic">.
 * Chiamata nel flusso automatico prima di buildInterpretativa.
 * Nel flusso manuale viene invece usata la logica inline in
 * buildInterpretativa che legge le note dall'interpretativa stessa.
 */
function buildDiplomaticNotes() {
  const diplDiv = getDiv("diplomatic");
  if (!diplDiv) return;
  const notes = Array.from(diplDiv.getElementsByTagNameNS(NS,"note"));
  if (!notes.length) return;

  commentData = notes.map(n => ({
    target: (n.getAttribute("target")||"").replace("#",""),
    html:   renderNoteContent(n),
  }));
  const noteTargets = new Set(commentData.map(d => d.target));
  let idx = 1;
  noteIndexMap = {};
  (function walk(node) {
    if (node.nodeType !== 1) return;
    const id = node.getAttribute("xml:id");
    if (node.localName === "seg" && id && noteTargets.has(id) && !noteIndexMap[id])
      noteIndexMap[id] = idx++;
    Array.from(node.childNodes).forEach(walk);
  })(diplDiv);
}


/**
 * Punto di ingresso per la costruzione del pannello interpretativa.
 * Determina il flusso (automatico o manuale) in base al contenuto
 * di <div type="interpretative">:
 *   • hasContent=true  → flusso manuale: usa buildInterpManual
 *   • hasContent=false → flusso automatico: usa walkInterpAuto
 *     con buildInterpAutoWithMilestones o buildLgBlock a seconda
 *     della presenza di <milestone> fuori da <lg>.
 * Popola noteIndexMap e commentData per il pannello Commento.
 */
function buildInterpretativa() {
  const interpDiv = getDiv("interpretative");
  if (!interpDiv) return;

  const hasContent = interpDiv.getElementsByTagNameNS(NS,"l").length > 0 ||
                     interpDiv.getElementsByTagNameNS(NS,"p").length > 0;

  let html, legendNote;
  if (hasContent) {
    // Flusso manuale: cerca le note nell'interpretativa;
    // se non ce ne sono, usa quelle della diplomatica come fallback
    // (caso comune: note scritte nella diplomatica, testo nell'interpretativa).
    noteIndexMap = {};
    commentData  = [];
    const interpNotes = Array.from(interpDiv.getElementsByTagNameNS(NS, 'note'));
    const sourceDiv   = interpNotes.length > 0 ? interpDiv : getDiv('diplomatic');
    const notes       = sourceDiv
      ? Array.from(sourceDiv.getElementsByTagNameNS(NS, 'note'))
      : [];
    // I <seg> vengono sempre cercati nell'interpretativa (dove sta il testo)
    const segs    = Array.from(interpDiv.getElementsByTagNameNS(NS, 'seg'));
    const targets = new Set(notes.map(n => (n.getAttribute('target')||'').replace('#','')));
    let counter = 0;
    segs.forEach(s => {
      const sid = s.getAttribute('xml:id') || '';
      if (sid && targets.has(sid)) { counter++; noteIndexMap[sid] = counter; }
    });
    // Popola commentData per buildCommento
    notes.forEach(note => {
      const target = (note.getAttribute('target')||'').replace('#','');
      if (target) commentData.push({ target, html: renderNoteContent(note) });
    });
    // Fase 5: nuovo stack per il flusso manuale
    const iNodesM     = parseInterpretative(interpDiv);
    const iCtxM       = createContext(zoneIndex, surfaceIndex, noteIndexMap);
    ({ html }         = renderInterpNodes(iNodesM, iCtxM));
    legendNote = "Trascrizione interpretativa compilata manualmente";
    html = html.replace(/\s+(<span class="lb-marker-tight")/g, '$1');
  } else {
    const diplDiv = getDiv("diplomatic");
    if (!diplDiv) return;
    // Flusso automatizzato: carica le note dalla diplomatica
    buildDiplomaticNotes();
    // Fase A.3: nuovo stack Parser + Renderer sostituisce
    // buildInterpAutoWithMilestones + buildLgHtml + walkInterpAuto.
    // renderInterpP gestisce internamente il caso milestone fuori da <lg>.
    try {
      const autoNodes = parseDiplomatic(diplDiv);
      const autoCtx   = createContext(zoneIndex, surfaceIndex, noteIndexMap);
      ({ html }       = renderInterpNodes(autoNodes, autoCtx));
      legendNote = "Generata automaticamente dall’edizione diplomatica";
    } catch (e) {
      console.error('buildInterpretativa (flusso auto):', e);
      html       = '<p style="color:var(--red,red);padding:1em">'
                 + 'Errore nel rendering dell’edizione interpretativa. '
                 + 'Vedere la console per i dettagli.</p>';
      legendNote = "Errore nel rendering automatico";
    }
    // Rimuove whitespace prima di lb-marker-tight
    html = html.replace(/\s+(<span class="lb-marker-tight")/g, '$1');
  }

  // Rileva elementi presenti nel div sorgente
  const srcDiv = hasContent ? interpDiv : (getDiv("diplomatic") || interpDiv);
  const hasDamageOrUnclear = srcDiv.getElementsByTagNameNS(NS,"damage").length > 0 ||
                             srcDiv.getElementsByTagNameNS(NS,"unclear").length > 0;
  const hasSupplied = srcDiv.getElementsByTagNameNS(NS,"supplied").length > 0;

  const interpItems = [];
  if (hasDamageOrUnclear) interpItems.push(`<span class="legend-item">†&nbsp;†&nbsp;Ms. incomprensibile, danneggiato o lacunoso</span>`);
  if (hasSupplied)        interpItems.push(`<span class="legend-item">⟨&nbsp;⟩&nbsp;Integrazione editoriale</span>`);

  // La nota sul metodo è sempre presente se c'è testo
  const legendHtml = `<span class="legend-item" style="color:var(--muted)">${legendNote}</span>${interpItems.join("")}`;

  ["L","R"].forEach(col => {
    const textEl = document.getElementById(`interp-text-${col}`);
    textEl.innerHTML = html;
    // Applica stato corrente dei separatori
    textEl.classList.toggle('hide-lb-markers', !showLbMarkers);
    const legendEl = document.getElementById(`legend-interp-${col}`);
    const toggleBtn = `<button id="btn-lb-toggle-${col}" onclick="toggleLbMarkers()"
      title="${showLbMarkers ? 'Nascondi separatori di riga' : 'Mostra separatori di riga ( | )'}"
      style="margin-left:auto;background:none;border:1px solid var(--border);border-radius:3px;
             padding:2px 8px;font-size:10px;font-family:'Source Sans 3',sans-serif;
             font-weight:700;cursor:pointer;color:var(--muted);opacity:${showLbMarkers?'1':'0.45'};
             letter-spacing:0.05em;transition:opacity .15s"> | </button>`;
    legendEl.innerHTML = `<span class="legend-label">Legenda</span>${legendHtml}${toggleBtn}`;
    legendEl.style.display = "";
  });
}




/* ═══════════════════════════════════════════════════════════════
   TESTO CRITICO — Edizione critica da <div type="edition">
═══════════════════════════════════════════════════════════════ */
function buildTesto() {
  const div = getDiv("edition");
  if (!div) return;

  const testoNotes = Array.from(div.getElementsByTagNameNS(NS,"note")).map(n => ({
    target: (n.getAttribute("target")||"").replace("#",""),
    html:   renderNoteContent(n),
  }));

  // Usa le note del testo critico se presenti, altrimenti mantieni quelle dalla diplomatica
  if (testoNotes.length > 0) {
    commentData = testoNotes;
    const noteTargets = new Set(commentData.map(d => d.target));
    let idx = 1;
    noteIndexMap = {};
    (function walk(node) {
      if (node.nodeType !== 1) return;
      const id = node.getAttribute("xml:id");
      if (node.localName === "seg" && id && noteTargets.has(id) && !noteIndexMap[id])
        noteIndexMap[id] = idx++;
      Array.from(node.childNodes).forEach(walk);
    })(div);
  }

  const html = buildLgHtml(div, walkTesto);
  ["L","R"].forEach(col =>
    document.getElementById(`out-testo-${col}`).innerHTML = html
  );
  bindTestoEvents();
}

/**
 * Renderizza il contenuto di una <note> TEI come HTML per il pannello
 * Commento. Gestisce: testo (con escape entità), <hi rend="italic/bold">,
 * <em>, <strong>, <p>. Le entità XML come &lt; vengono preservate
 * come testo letterale (non interpretate come markup HTML).
 */
function renderNoteContent(noteNode) {
  let h = "";
  noteNode.childNodes.forEach(c => {
    if (c.nodeType === 3) {
      // Escape prima di smartQuotes per preservare entità come &lt; &gt;
      const escaped = c.textContent
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      h += smartQuotes(escaped);
    } else if (c.nodeType === 1) {
      if (c.localName === "em") {
        h += `<em>${smartQuotes(c.textContent)}</em>`;
      } else if (c.localName === "hi") {
        const r = c.getAttribute('rend') || '';
        const t = smartQuotes(c.textContent);
        h += r === 'bold' ? `<strong>${t}</strong>` : `<em>${t}</em>`;
      } else if (c.localName === "strong") {
        h += `<strong>${smartQuotes(c.textContent)}</strong>`;
      } else if (c.localName === "p") {
        h += `<p style="margin:0 0 0.5rem">${smartQuotes(renderNoteContent(c))}</p>`;
      } else {
        const escaped = c.textContent
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        h += smartQuotes(escaped);
      }
    }
  });
  return h;
}

function walkTesto(node) {
  return walkNodes(node.childNodes, {
    text:   t => smartQuotes(t.textContent),
    seg:    n => {
      const sid = n.getAttribute("xml:id");
      const ni  = noteIndexMap[sid] || "";
      const marker = ni ? `<sup class="note-marker" data-seg-id="${sid}">${ni}</sup>` : "";
      return `<span class="tei-seg" data-seg-id="${sid}">${smartQuotes(n.textContent)}</span>${marker}`;
    },
    choice: n => {
      const expan = directChild(n, "expan");
      const corr  = directChild(n, "corr");
      return smartQuotes((expan||corr||n).textContent);
    },
    add:    n => smartQuotes(n.textContent),
    del:    ()=> "",
    note:   ()=> "",
    hi:     n => { const r=n.getAttribute('rend')||''; const t=walkTesto(n); return r==='italic'?`<em>${t}</em>`:r==='bold'?`<strong>${t}</strong>`:t; },
    p:      n => `<p class="tei-prose-p">${walkTesto(n)}</p>`,
    default:n => smartQuotes(n.textContent),
  });
}

function bindTestoEvents() {
  document.body.addEventListener("click", e => {
    const marker = e.target.closest(".note-marker, .tei-seg");
    if (marker) {
      const sid    = marker.dataset.segId;
      const srcCol = colOf(marker);
      if (sid && srcCol) {
        clearHighlights();
        document.querySelectorAll(`.note-marker[data-seg-id="${sid}"]`).forEach(el => el.classList.add("hl"));
        document.querySelectorAll(`.tei-seg[data-seg-id="${sid}"]`).forEach(el => el.classList.add("hl"));
        // In layout single apre commento nella stessa colonna, altrimenti nell'altra
        const isSingle = document.getElementById("main-body").classList.contains("layout-single");
        const tgt = isSingle ? srcCol : targetCol(srcCol);
        ensurePaneVisible(tgt, "commento");
        const ne = document.getElementById(`note-${tgt}-${sid}`);
        if (ne) {
          ne.classList.add("hl");
          setTimeout(() => ne.scrollIntoView({ behavior:"smooth", block:"center" }), 120);
        }
      }
      return;
    }
    if (!e.target.closest(".note-entry")) clearHighlights();
  });
}

/* ═══════════════════════════════════════════════════════════════
   COMMENTO
═══════════════════════════════════════════════════════════════ */
function buildCommento() {
  if (commentData.length === 0) return;
  ["L","R"].forEach(col => {
    let h = "";
    commentData.forEach(nd => {
      const ni = noteIndexMap[nd.target] || "";
      h += `<div class="note-entry" id="note-${col}-${nd.target}" data-note-target="${nd.target}">
              <div class="note-marker-label"><sup>${ni}</sup> Nota di commento</div>
              <div style="line-height:1.75">${nd.html}</div>
            </div>`;
    });
    if (!h) h = '<div style="padding:20px;color:#aaa;font-size:13px;font-style:italic">Nessuna nota.</div>';
    document.getElementById(`out-commento-${col}`).innerHTML = h;

    document.querySelectorAll(`#out-commento-${col} .note-entry`).forEach(entry => {
      entry.addEventListener("click", () => {
        const sid = entry.dataset.noteTarget;
        clearHighlights();
        document.querySelectorAll(`.note-marker[data-seg-id="${sid}"]`).forEach(el => el.classList.add("hl"));
        document.querySelectorAll(`.tei-seg[data-seg-id="${sid}"]`).forEach(el => el.classList.add("hl"));
        entry.classList.add("hl");
        // Trova il pannello che contiene effettivamente il marker
        const isSingle = document.getElementById("main-body").classList.contains("layout-single");
        const tgt = isSingle ? col : targetCol(col);
        // Cerca il marker in interpretativa o testo critico
        const paneOrder = ["interpretativa", "testo", "diplomatica"];
        let foundPane = null;
        let foundEl   = null;
        for (const pane of paneOrder) {
          const el = document.querySelector(`#out-${pane}-${tgt} .note-marker[data-seg-id="${sid}"]`);
          if (el) { foundPane = pane; foundEl = el; break; }
        }
        if (foundPane) {
          ensurePaneVisible(tgt, foundPane);
          setTimeout(() => foundEl?.scrollIntoView({ behavior:"smooth", block:"center" }), 120);
        }
      });
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   TRADUZIONE
═══════════════════════════════════════════════════════════════ */
function buildTraduzione() {
  const div = getDiv("translation");
  if (!div) return;
  function walkTrad(node) {
    return walkNodes(node.childNodes, {
      text:    t => smartQuotes(t.textContent),
      hi:      n => { const r=n.getAttribute('rend')||''; const t=walkTrad(n); return r==='italic'?`<span style="font-style:normal">${t}</span>`:r==='bold'?`<strong>${t}</strong>`:t; },
      p:       n => `<p class="tei-prose-p" style="font-style:italic;color:#4b5563">${walkTrad(n)}</p>`,
      default: n => smartQuotes(n.textContent),
    });
  }
  const html = buildLgHtml(div, walkTrad);
  ["L","R"].forEach(col =>
    document.getElementById(`out-traduzione-${col}`).innerHTML = html
  );
}

/* ═══════════════════════════════════════════════════════════════
   FACSIMILE — MIRADOR IIIF
   Strategia (ispirata all'approccio Gemini):
   · Mirador riceve loadedManifest come URL diretto — gestisce
     autonomamente il fetch, senza CORS lato JS.
   · canvasIndex iniziale calcolato dai nomi foglio nel TEI
     (<surface n="49v">) cercando nell'URL della canvas.
   · Dopo il caricamento, un subscriber Redux intercetta ogni
     navigazione e la blocca se esce dall'intervallo TEI.
   · I pulsanti della toolbar chiamano direttamente lo store
     Redux di Mirador (stessa tecnica di Gemini per canvasIndex).
═══════════════════════════════════════════════════════════════ */

const MIRADOR_EL = { L: "mirador-mount-L", R: "mirador-mount-R" };

function buildFacsimileContainers() {
